<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sarge Sporting Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/target.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        input, select, textarea { font-size: 16px !important; }
        @media print {
            .no-print { display: none !important; }
            body {
                background-color: white !important; padding: 0 !important; margin: 5mm !important;
                font-family: "Courier New", Courier, monospace; color: black !important;
            }
            .print-only { display: block !important; }
            table { width: 100% !important; border-collapse: collapse !important; border: 1.5pt solid black !important; table-layout: fixed; }
            th, td {
                border: 0.5pt solid black !important; padding: 0 !important; color: black !important;
                text-align: center !important; vertical-align: middle !important; overflow: hidden;
                height: 30px;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .print-header {
                display: flex; justify-content: space-between; align-items: center;
                border-bottom: 2pt solid black; padding-bottom: 8pt; margin-bottom: 12pt; font-size: 13pt;
            }
            .print-notes {
                margin-top: 12pt; font-size: 10pt; border: 0.75pt solid black;
                padding: 6pt; min-height: 28pt; text-align: left;
            }
            .signature-section { margin-top: 24pt; display: flex; justify-content: flex-end; }
            .sig-line {
                border-top: 1pt solid black; width: 260pt; text-align: center;
                padding-top: 6pt; font-size: 9pt; font-weight: bold;
            }
        }
        #capture-container {
            position: absolute; left: -9999px; top: 0; width: 1200px; background: white; padding: 40px; color: black; font-family: "Courier New", Courier, monospace;
        }
        #capture-container table { width: 100%; border-collapse: collapse; border: 2pt solid black; table-layout: fixed; }
        #capture-container th, #capture-container td { border: 1pt solid black; padding: 0; text-align: center !important; vertical-align: middle !important; }
        .cell-center { display: flex; align-items: center; justify-content: center; height: 100%; width: 100%; text-align: center; }
        .hit-bg { background-color: #16a34a !important; color: white !important; border-color: #15803d !important; }
        .hit2-bg { background-color: #65a30d !important; color: white !important; border-color: #4d7c0f !important; }
        .miss-bg { background-color: #ef4444 !important; color: white !important; border-color: #b91c1c !important; }
        .first-up-highlight { animation: lead-pulse 2s infinite; border: 2px solid #f97316 !important; }
        @keyframes lead-pulse {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 9999px; font-size: 9px; font-weight: 900; text-transform: uppercase; border: 1px solid #e2e8f0; background: white; color: #64748b; cursor: pointer; white-space: nowrap; }
        .chip.active { background: #0f172a; color: white; border-color: #0f172a; }
        .chip.miss-active { background: #ef4444; color: white; border-color: #b91c1c; }
        .bar-track { background: #f1f5f9; border-radius: 6px; overflow: hidden; height: 10px; width: 100%; }
        .bar-fill { background: #f97316; height: 100%; border-radius: 6px; }
        .navbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 8px; font-weight: 900; text-transform: uppercase; color: #94a3b8; padding: 6px 4px; border-radius: 10px; flex: 1; }
        .navbtn.active { color: #f97316; background: #1e293b; }
        .hidden-view { display: none !important; }
        /* Glove mode: scales up every tappable/readable element on the scoring
           screen (buttons, target cards, dropdowns, stand nav) for shooting in
           gloves or cold weather. Scoped by a `glove-mode` class toggled on
           <body> in render(), so it applies wherever the scoring screen's own
           markup carries these hooks - no ternary classes scattered through
           every template string, just these overrides plus the class hooks. */
        body.glove-mode .glove-standnav { width: 64px !important; height: 64px !important; font-size: 16px !important; }
        body.glove-mode .glove-target-card { padding: 14px !important; min-width: 160px !important; }
        body.glove-mode .glove-target-label { font-size: 14px !important; line-height: 1.5 !important; }
        body.glove-mode .glove-hitmiss-btn { height: 68px !important; font-size: 18px !important; }
        body.glove-mode .glove-missreason-chip { font-size: 13px !important; padding: 12px 6px !important; }
        body.glove-mode .glove-choke-select { font-size: 13px !important; padding: 8px !important; max-width: 110px !important; }
        body.glove-mode .glove-legend-item { font-size: 11px !important; }
        body.glove-mode .glove-shooter-name { font-size: 16px !important; max-width: 160px !important; }
        body.glove-mode .glove-count { font-size: 24px !important; }
        body.glove-mode .glove-nav-btn { padding: 20px !important; font-size: 15px !important; }
        body.glove-mode .glove-edit-btn { font-size: 13px !important; padding: 10px 16px !important; }
        body.glove-mode .glove-stand-title { font-size: 24px !important; }
        body.glove-mode .glove-tag-select { font-size: 14px !important; padding: 12px !important; }
        body.glove-mode .glove-repeat-input { width: 56px !important; font-size: 14px !important; padding: 10px !important; }
        body.glove-mode .glove-pairtype-btn { font-size: 12px !important; padding: 10px 14px !important; }
        body.glove-mode .glove-header-btn { padding: 12px !important; }
        body.glove-mode .glove-header-btn i { width: 20px !important; height: 20px !important; }
        /* Sitewide glove-mode rules (2026-07-14): the hooks above were tuned
           specifically for the dense scoring screen. Paul asked for glove mode
           to apply everywhere, not just scoring - Home, Shooters, History,
           Round Detail, Analysis, Settings, and the New Round wizard all use
           plain <button>/<select>/<input>/.chip/.navbtn elements without
           per-element hooks, so rather than hand-tagging every one of them,
           these generic selectors bump touch targets across the whole app.
           Specificity note: "body.glove-mode .some-class" (two classes) always
           beats "body.glove-mode button" (class + tag) regardless of source
           order, so these generic rules can never override the more tailored
           scoring-screen hooks above - safe to combine both. */
        body.glove-mode button { min-height: 42px !important; padding: 10px 14px !important; font-size: 12px !important; }
        body.glove-mode button i, body.glove-mode button svg { min-width: 16px !important; min-height: 16px !important; }
        body.glove-mode input, body.glove-mode select, body.glove-mode textarea { font-size: 15px !important; padding: 10px !important; }
        body.glove-mode .chip { font-size: 11px !important; padding: 8px 12px !important; }
        body.glove-mode .navbtn { padding: 10px 4px !important; font-size: 10px !important; }
        body.glove-mode .navbtn i, body.glove-mode .navbtn svg { width: 20px !important; height: 20px !important; }
        body.glove-mode #header-actions button { padding: 12px !important; }
        body.glove-mode #header-actions i, body.glove-mode #header-actions svg { width: 20px !important; height: 20px !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans pb-24 overflow-x-hidden">
    <header class="bg-slate-900 text-white sticky top-0 z-50 shadow-md no-print w-full">
        <div class="max-w-5xl mx-auto p-3 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
                <div class="w-8 h-8 flex items-center justify-center bg-orange-500 rounded-lg shadow-sm">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                        <circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-tight uppercase italic leading-none">Sporting Pro</h1>
                    <span class="text-[7px] text-green-400 font-bold uppercase flex items-center gap-1 mt-0.5"><i data-lucide="wifi-off" size="7"></i> Offline Ready</span>
                </div>
            </div>
            <div id="header-actions" class="flex items-center gap-1.5"></div>
        </div>
        <div class="w-full bg-slate-800 h-1"><div id="progress-bar" class="bg-orange-500 h-full transition-all duration-500 w-0"></div></div>
    </header>

    <nav class="max-w-5xl mx-auto flex gap-1 px-2 pt-2 no-print" id="main-nav"></nav>

    <main id="app-container" class="max-w-5xl mx-auto p-2 space-y-3 transition-opacity duration-300 no-print"></main>

    <!-- Export scaffolding (hidden, used for image/PDF export) -->
    <div id="capture-container" class="no-print">
        <div style="border-bottom: 2pt solid black; padding: 10px 0; margin-bottom: 15px; display: flex; justify-content: space-between; font-size: 14pt;">
            <div><strong>GROUND:</strong> <span id="cap-ground"></span></div>
            <div style="text-align:center; text-transform: uppercase;"><strong>Sporting Score Leaderboard</strong></div>
            <div><strong>DATE:</strong> <span id="cap-date"></span></div>
        </div>
        <table id="cap-grid"></table>
        <div style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center; font-size: 11pt; font-weight: bold;">
            <span>Generated by Sarge</span>
            <div style="border-top: 1.5pt solid black; width: 300px; text-align: center; padding-top: 8px;">SCORER / SHOOTER SIGNATURE</div>
        </div>
    </div>
    <div class="hidden print-only" id="print-view">
        <div class="print-header">
            <div><strong>GROUND:</strong> <span id="p-ground"></span></div>
            <div style="text-align:center; text-transform: uppercase;"><strong>Official Scorecard</strong></div>
            <div style="text-align:right"><strong>DATE:</strong> <span id="p-date"></span></div>
        </div>
        <table id="p-grid"></table>
        <div class="print-notes"><strong>NOTES:</strong> <span id="p-notes"></span></div>
        <div class="signature-section"><div class="sig-line">SIGNATURE</div></div>
        <div style="text-align: center; margin-top: 20px; font-size: 8pt; font-weight: bold; color: #666;">Generated by Sarge</div>
    </div>
    <input type="file" id="import-file-input" accept="application/json" class="hidden" onchange="handleImportFile(this.files[0])">

    <script>
    /* =========================================================================================
       DATA LAYER
    ========================================================================================= */
    const DB_KEY = 'sarge_pwa_pro_v3';
    let idCounter = 0;
    function newId() { return `${Date.now()}_${idCounter++}`; }

    function defaultPresets() {
        return {
            clayTypes: ['Standard', 'Midi', 'Mini', 'Battue', 'Rabbit', 'Flash/Zap', 'Ballistic'],
            presentations: ['Crosser (L→R)', 'Crosser (R→L)', 'Incomer', 'Outgoer/Going Away', 'Quartering In', 'Quartering Away', 'Springing Teal', 'Looper', 'Dropper', 'Driven', 'Overhead'],
            missReasons: ['Behind', 'In front', 'Above', 'Below', "Didn't mount", 'Lost sight of it'],
            windOptions: ['Calm', 'Breezy', 'Windy'],
            lightOptions: ['Bright', 'Overcast', 'Flat/Dull'],
            chokes: ['Cylinder', 'Skeet', 'Quarter (1/4)', 'Half (1/2)', 'Three-Quarter (3/4)', 'Full'],
            cartridges: ['21g Fibre 7s', '24g Fibre 7.5s', '28g Fibre 8s'],
            distanceBands: ['Very Close', 'Close', 'Medium', 'Far', 'Very Far'],
            pairTypes: [ {key:'single', label:'Single'}, {key:'simo', label:'Simo Pair'}, {key:'onreport', label:'On-Report Pair'}, {key:'following', label:'Following Pair'} ]
        };
    }
    function defaultDB() {
        return { profiles: [], presets: defaultPresets(), history: [], activeRound: null, view: 'home', analysisShooterId: null, historyRoundId: null, avgWindow: 6, gloveMode: false, groundLocations: {}, autoBackup: true, lastAutoBackupAt: null };
    }
    let db = defaultDB();
    // Glove mode scales up buttons/cards/dropdowns on the scoring screen for
    // shooting in gloves/cold weather. A single boolean toggled from Settings
    // or the quick-access icon in the scoring header; applied via a `glove-mode`
    // class on <body> (set in render()) rather than per-view state, so it
    // survives navigation and CSS in the <style> block handles the sizing.
    function toggleGloveMode() { db.gloveMode = !db.gloveMode; saveDB(); render(); }
    function saveDB() { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {} }
    function loadDB() {
        const s = localStorage.getItem(DB_KEY);
        if (s) {
            try {
                const parsed = JSON.parse(s);
                db = Object.assign(defaultDB(), parsed);
                db.presets = Object.assign(defaultPresets(), db.presets || {});
                // Migration: make sure newly-added default presentation options show up
                // even for a save file whose presentations array predates them.
                ['Driven', 'Overhead'].forEach(v => { if (!db.presets.presentations.includes(v)) db.presets.presentations.push(v); });
                return true;
            } catch (e) {}
        }
        return false;
    }
    function newRound() {
        return {
            id: newId(), createdAt: Date.now(), finishedAt: null, setupComplete: false, wizardStep: 'info',
            ground: '', date: new Date().toISOString().split('T')[0], event: '', notes: '', discipline: 'ESP',
            conditions: { wind: '', light: '', auto: null, readings: [], note: '' }, equipment: { gunId: '', gunName: '', cartridge: '' },
            shooterIds: [], stands: [], hits: {}, chokes: {}, activeIdx: 0, isLocked: false, editingTagsForStandId: null,
            expandedMissKey: null
        };
    }
    function activeRound() { return db.activeRound; }
    function findStand(round, standId) { return round.stands.find(s => s.id === standId); }
    function ensureHitPath(round, shooterId, standId) {
        if (!round.hits[shooterId]) round.hits[shooterId] = {};
        if (!round.hits[shooterId][standId]) round.hits[shooterId][standId] = {};
    }
    function getProfile(id) { return db.profiles.find(p => p.id === id); }

    /* =========================================================================================
       NAVIGATION
    ========================================================================================= */
    function goHome() { db.view = 'home'; saveDB(); render(); }
    function goToMyStats() { const mu = getMainUser(); if (!mu) return; db.analysisShooterId = mu.id; goto('analysis'); }
    function goto(view) { db.view = view; saveDB(); render(); }

    /* =========================================================================================
       PROFILES
    ========================================================================================= */
    function newProfile(name) {
        return { id: newId(), name: (name || '').trim() || `Shooter ${db.profiles.length + 1}`, cpsa: '', class: 'U', createdAt: Date.now(), isMainUser: false, guns: [], cpsaAverage: '', cpsaIssue: '', cpsaUpdated: null };
    }
    function addProfile() {
        db.profiles.push(newProfile());
        saveDB(); render();
    }
    /* Creates a named shooter straight from the Pick Squad screen and drops them into
       the squad in one step - previously you had to add an unnamed "Shooter N" here (or
       go out to the Profiles screen), rename them there, then come back and tick them.
       Auto-selecting into the squad is the obvious intent: you only add someone on this
       screen because they're shooting this round. */
    function addSquadShooter(name) {
        const trimmed = (name || '').trim();
        if (!trimmed) return;
        const p = newProfile(trimmed);
        db.profiles.push(p);
        const r = activeRound();
        if (r && !r.shooterIds.includes(p.id)) r.shooterIds.push(p.id);
        saveDB(); render();
    }
    /* Deliberately does NOT call render(). These are bound to `oninput`, so re-rendering
       on every keystroke rebuilt the whole view and destroyed the <input> being typed
       into - which drops focus and makes Android dismiss the keyboard after each
       character. Saving without re-rendering keeps the field alive and focused; the
       "Last updated" line refreshes on the next natural render, which is soon enough. */
    function updateCpsaRecord(id, field, value) {
        const p = getProfile(id); if (!p) return;
        p[field] = value; p.cpsaUpdated = Date.now();
        saveDB();
    }
    function updateProfile(id, field, value) { const p = getProfile(id); if (p) { p[field] = value; saveDB(); } }
    function deleteProfile(id) {
        if (!confirm('Delete this shooter profile? Their past round history stays saved but will show as "Unknown Shooter".')) return;
        db.profiles = db.profiles.filter(p => p.id !== id);
        saveDB(); render();
    }
    function setMainUser(id) {
        db.profiles.forEach(p => { p.isMainUser = (p.id === id); if (!p.guns) p.guns = []; });
        saveDB(); render();
    }
    function getMainUser() { return db.profiles.find(p => p.isMainUser); }
    function addGun(name) {
        const p = getMainUser(); if (!p || !name || !name.trim()) return;
        if (!p.guns) p.guns = [];
        p.guns.push({ id: newId(), name: name.trim(), shotOffset: 0, maintenanceLog: [] });
        saveDB(); render();
    }
    function removeGun(gunId) {
        const p = getMainUser(); if (!p) return;
        p.guns = (p.guns || []).filter(g => g.id !== gunId);
        saveDB(); render();
    }
    /* Shot count per gun: auto-counted from every round (history + in-progress) where
       that gun was selected, counting the MAIN USER's own attempted shots (hit+miss) in
       that round - other squad members' shots aren't attributed to Paul's gun. `shotOffset`
       is a manual adjustment on top (can be positive or negative) for backfilling rounds
       shot before this feature existed, or rounds not logged in the app. Old saves may not
       have `shotOffset`/`maintenanceLog` on a gun yet, hence the `|| 0` / `|| []` guards
       throughout instead of a migration. */
    function gunAutoShotCount(gun, mainUserId) {
        const rounds = [...db.history, ...(db.activeRound ? [db.activeRound] : [])];
        let total = 0;
        rounds.forEach(r => { if (r.equipment?.gunId === gun.id) total += shooterRoundAttempts(r, mainUserId); });
        return total;
    }
    function gunTotalShotCount(gun, mainUserId) { return gunAutoShotCount(gun, mainUserId) + (gun.shotOffset || 0); }
    function updateGunOffset(gunId, value) {
        const p = getMainUser(); if (!p) return;
        const g = (p.guns || []).find(g => g.id === gunId); if (!g) return;
        g.shotOffset = parseInt(value) || 0;
        saveDB(); render();
    }
    // Maintenance log is purely a dated record (service/clean/parts) sitting alongside the
    // shot count - logging an entry never resets or offsets the count itself.
    function addMaintenanceEntry(gunId, date, note) {
        const p = getMainUser(); if (!p) return;
        const g = (p.guns || []).find(g => g.id === gunId); if (!g) return;
        if (!note || !note.trim()) return;
        if (!g.maintenanceLog) g.maintenanceLog = [];
        g.maintenanceLog.push({ id: newId(), date: date || new Date().toISOString().split('T')[0], note: note.trim(), createdAt: Date.now() });
        saveDB(); render();
    }
    function removeMaintenanceEntry(gunId, entryId) {
        const p = getMainUser(); if (!p) return;
        const g = (p.guns || []).find(g => g.id === gunId); if (!g) return;
        g.maintenanceLog = (g.maintenanceLog || []).filter(e => e.id !== entryId);
        saveDB(); render();
    }

    /* =========================================================================================
       WEATHER (Open-Meteo)

       Uses Open-Meteo: free, no API key, and CORS-enabled, so a static PWA with no backend
       can call it straight from the browser - which is the only reason this is buildable
       here at all. Non-commercial use is free up to 10k calls/day; this app makes one call
       per round, so that's not a concern.

       Design notes:
       - Coordinates are saved PER GROUND (keyed on the lowercased ground name) the first
         time you fetch there. Every later round at that ground needs no GPS fix at all,
         which matters because shooting grounds often have poor signal and a cold GPS lock
         can take a while.
       - The numeric readings (mph, direction, temp, cloud %, precipitation) are stored in
         full on the round. The existing Calm/Breezy/Windy and Bright/Overcast/Flat bands
         are ALSO auto-filled from them, but the raw numbers are the valuable bit for
         analysis later - bands lose too much detail.
       - Everything degrades gracefully: no signal, denied permission or a failed request
         just shows a message and leaves the manual dropdowns exactly as they were. Weather
         must never block starting or scoring a round.
       - IMPORTANT: the band mapping only applies a value if it actually exists in the
         user's own preset list, since those lists are editable in Settings. If Paul
         renames or removes "Breezy", auto-fill silently skips rather than writing a value
         that isn't a valid option.
    ========================================================================================= */
    let weatherState = { loading: false, error: null };
    function groundKey(name) { return (name || '').trim().toLowerCase(); }
    function cardinalDir(deg) {
        if (deg == null || isNaN(deg)) return '';
        const dirs = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
        return dirs[Math.round((deg % 360) / 22.5) % 16];
    }
    // Bands chosen for what actually changes clay behaviour rather than strict Beaufort.
    function windBandFor(mph) {
        if (mph == null || isNaN(mph)) return '';
        if (mph < 4) return 'Calm';
        if (mph <= 12) return 'Breezy';
        return 'Windy';
    }
    function lightBandFor(cloudPct) {
        if (cloudPct == null || isNaN(cloudPct)) return '';
        if (cloudPct < 30) return 'Bright';
        if (cloudPct <= 75) return 'Overcast';
        return 'Flat/Dull';
    }
    function getDeviceCoords() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) { reject(new Error('This device has no location support.')); return; }
            navigator.geolocation.getCurrentPosition(
                pos => resolve({ lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4) }),
                err => reject(new Error(err && err.code === 1 ? 'Location permission denied — allow it, or set the conditions by hand.' : 'Could not get a location fix.')),
                { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 }
            );
        });
    }
    function savedGroundCoords(name) {
        const k = groundKey(name);
        return (k && db.groundLocations && db.groundLocations[k]) || null;
    }
    async function fetchRoundWeather() {
        const r = activeRound();
        if (!r) return;
        weatherState = { loading: true, error: null };
        render();
        try {
            const k = groundKey(r.ground);
            let coords = savedGroundCoords(r.ground);
            if (!coords) {
                coords = await getDeviceCoords();
                if (k) {
                    if (!db.groundLocations) db.groundLocations = {};
                    db.groundLocations[k] = { lat: coords.lat, lon: coords.lon, savedAt: Date.now() };
                }
            }
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}`
                + `&current=temperature_2m,wind_speed_10m,wind_direction_10m,cloud_cover,precipitation&wind_speed_unit=mph`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Weather service returned ' + res.status + '.');
            const data = await res.json();
            // Handle both the newer `current` block and the older `current_weather` shape.
            const c = data.current || data.current_weather || {};
            const num = v => (v === null || v === undefined || isNaN(v)) ? null : Number(v);
            const windMph = num(c.wind_speed_10m !== undefined ? c.wind_speed_10m : c.windspeed);
            const windDir = num(c.wind_direction_10m !== undefined ? c.wind_direction_10m : c.winddirection);
            const tempC = num(c.temperature_2m !== undefined ? c.temperature_2m : c.temperature);
            const cloudPct = num(c.cloud_cover);
            const precipMm = num(c.precipitation);
            if (windMph === null && tempC === null && cloudPct === null) throw new Error('Weather service sent no usable readings.');
            const reading = {
                tempC, windMph, windDir, windCardinal: cardinalDir(windDir), cloudPct, precipMm,
                fetchedAt: Date.now(), lat: coords.lat, lon: coords.lon,
                standIdx: (r.setupComplete && typeof r.activeIdx === 'number') ? r.activeIdx + 1 : null
            };
            r.conditions.auto = reading;
            // Keep every reading, not just the latest: re-checking mid-round would
            // otherwise wipe the start-of-round conditions, which defeats the point of
            // re-checking at all. `auto` stays as "current" for all the existing display
            // code; `readings` is the log a long round can be reconstructed from.
            if (!Array.isArray(r.conditions.readings)) r.conditions.readings = [];
            r.conditions.readings.push(reading);
            const wb = windBandFor(windMph);
            if (wb && (db.presets.windOptions || []).includes(wb)) r.conditions.wind = wb;
            const lb = lightBandFor(cloudPct);
            if (lb && (db.presets.lightOptions || []).includes(lb)) r.conditions.light = lb;
            weatherState = { loading: false, error: null };
        } catch (e) {
            weatherState = { loading: false, error: (e && e.message) || 'Could not get the weather.' };
        }
        saveDB(); render();
    }
    /* Fires when the ground name field loses focus. Only auto-fetches for a ground we
       already have coordinates for - a brand new ground needs GPS, and springing a
       permission prompt on someone mid-typing is rude, so that stays an explicit tap. */
    function maybeAutoFetchWeather() {
        const r = activeRound();
        if (!r || r.conditions.auto || weatherState.loading) return;
        if (savedGroundCoords(r.ground)) fetchRoundWeather();
    }
    function clearRoundWeather() {
        const r = activeRound();

        r.conditions.readings = [];

        saveDB(); render();
    }
    /* Compact one-line summary of a reading, reused on the scoring screen and in round
       detail so the format can't drift between them. */
    function weatherSummary(a) {
        if (!a) return '';
        const bits = [];
        if (a.windMph != null) bits.push(Math.round(a.windMph) + 'mph' + (a.windCardinal ? ' ' + a.windCardinal : ''));
        if (a.tempC != null) bits.push(Math.round(a.tempC) + '°C');
        if (a.cloudPct != null) bits.push(Math.round(a.cloudPct) + '% cloud');
        if (a.precipMm) bits.push(a.precipMm + 'mm rain');
        return bits.join(' • ');
    }

    /* =========================================================================================
       NEW ROUND WIZARD
    ========================================================================================= */
    function startNewRound() { db.activeRound = newRound(); db.view = 'setup-info'; saveDB(); render(); }

    function abandonActiveRound() {
        if (!confirm('Discard this in-progress round? This cannot be undone.')) return;

    }
    function wizardNext(nextStep) { db.activeRound.wizardStep = nextStep; db.view = nextStep; saveDB(); render(); }
    function toggleSquadMember(id) {

        if (i >= 0) r.shooterIds.splice(i, 1); else r.shooterIds.push(id);
        saveDB(); render();
    }
    function goToStandSetup() {
        if (!activeRound().shooterIds.length) { alert('Pick at least one shooter.'); return; }
        wizardNext('setup-stands');
    }
    function addStand() { activeRound().stands.push({ id: newId(), slots: [] }); saveDB(); render(); }
    function getShooterChoke(round, shooterId, standId) {
        if (round.chokes?.[shooterId]?.[standId]) return round.chokes[shooterId][standId];
        // carry forward the most recent choke this shooter set on an earlier stand
        const idx = round.stands.findIndex(s => s.id === standId);
        for (let i = idx - 1; i >= 0; i--) {
            const prev = round.chokes?.[shooterId]?.[round.stands[i].id];
            if (prev) return prev;
        }
        return '';
    }
    function setShooterChoke(shooterId, standId, value) {
        const r = activeRound();
        if (!r.chokes) r.chokes = {};
        if (!r.chokes[shooterId]) r.chokes[shooterId] = {};
        r.chokes[shooterId][standId] = value;
        saveDB(); render();
    }
    function removeStand(standId) {
        const r = activeRound();
        r.stands = r.stands.filter(s => s.id !== standId);
        Object.values(r.hits).forEach(byStand => delete byStand[standId]);
        saveDB(); render();
    }
    /* A "pair definition" (defId) is the bird(s) as they appear on the stand board —
       e.g. "rabbit + quartering midi, on report". ESP throws the SAME definition
       repeatedly for however many pairs the stand calls for, so each definition also
       has a repeatCount. Every repetition still gets its own pairId group of real,
       independently-scoreable slots (so a hit on rep 2 doesn't affect rep 1), but the
       clayType/presentation only need to be set ONCE per bird position and are kept in
       sync across every repetition by updateSlot(). */
    // Defaults new/ungrown slots to the middle distance band rather than the first
    // (nearest) one, since "unset" shouldn't silently read as "very close" in analysis.
    function defaultDistanceBand() {
        const d = db.presets.distanceBands || [];
        return d[Math.floor(d.length / 2)] || d[0] || '';
    }
    function addPairGroup(standId, pairType, repeatCount) {
        const st = findStand(activeRound(), standId);
        const defId = newId();
        const birds = pairType === 'single' ? 1 : 2;
        const reps = Math.max(1, parseInt(repeatCount) || 1);
        for (let rep = 0; rep < reps; rep++) {
            const pairId = newId();
            for (let b = 0; b < birds; b++) {
                st.slots.push({ id: newId(), clayType: db.presets.clayTypes[0], presentation: db.presets.presentations[0], distance: defaultDistanceBand(), pairId, pairType, defId, birdIndex: b });
            }
        }
        saveDB(); render();
    }
    function removePairGroup(standId, defId) {
        const st = findStand(activeRound(), standId);
        const removedIds = st.slots.filter(s => (s.defId || s.pairId) === defId).map(s => s.id);
        st.slots = st.slots.filter(s => (s.defId || s.pairId) !== defId);
        const r = activeRound();
        Object.values(r.hits).forEach(byStand => { const cell = byStand[standId]; if (cell) removedIds.forEach(id => delete cell[id]); });
        saveDB(); render();
    }
    function updateSlot(standId, slotId, field, value) {
        const st = findStand(activeRound(), standId);
        const slot = st.slots.find(s => s.id === slotId);
        if (!slot) return;
        // Propagate clayType/presentation to every repetition of this same bird position,
        // so tagging a pair once applies to all X repeats of it on this stand.
        const defKey = slot.defId || slot.pairId;
        st.slots.forEach(s => { if ((s.defId || s.pairId) === defKey && s.birdIndex === slot.birdIndex) s[field] = value; });
        saveDB(); render();
    }
    function updatePairGroupType(standId, defId, newType) {
        const st = findStand(activeRound(), standId);
        const slots = st.slots.filter(s => (s.defId || s.pairId) === defId);
        if (!slots.length) return;
        const wantBirds = newType === 'single' ? 1 : 2;
        const pairIds = [...new Set(slots.map(s => s.pairId))];
        slots.forEach(s => { s.pairType = newType; });
        const r = activeRound();
        pairIds.forEach(pairId => {
            const repSlots = slots.filter(s => s.pairId === pairId);
            if (repSlots.length > wantBirds) {
                const removeId = repSlots[repSlots.length - 1].id;
                st.slots = st.slots.filter(s => s.id !== removeId);
                Object.values(r.hits).forEach(byStand => { const cell = byStand[standId]; if (cell) delete cell[removeId]; });
            } else if (repSlots.length < wantBirds) {
                st.slots.push({ id: newId(), clayType: repSlots[0].clayType, presentation: repSlots[0].presentation, distance: repSlots[0].distance || defaultDistanceBand(), pairId, pairType: newType, defId, birdIndex: 1 });
            }
        });
        saveDB(); render();
    }
    function setPairGroupRepeatCount(standId, defId, newCount) {
        const st = findStand(activeRound(), standId);
        const defSlots = st.slots.filter(s => (s.defId || s.pairId) === defId);
        if (!defSlots.length) return;
        const pairType = defSlots[0].pairType;
        const birds = pairType === 'single' ? 1 : 2;
        const pairIds = [...new Set(defSlots.map(s => s.pairId))];
        const count = Math.max(1, parseInt(newCount) || 1);
        const r = activeRound();
        if (count > pairIds.length) {
            const template = {};
            defSlots.filter(s => s.pairId === pairIds[0]).forEach(s => { template[s.birdIndex] = { clayType: s.clayType, presentation: s.presentation, distance: s.distance }; });
            for (let i = pairIds.length; i < count; i++) {
                const pairId = newId();
                for (let b = 0; b < birds; b++) {
                    st.slots.push({ id: newId(), clayType: template[b]?.clayType || db.presets.clayTypes[0], presentation: template[b]?.presentation || db.presets.presentations[0], distance: template[b]?.distance || defaultDistanceBand(), pairId, pairType, defId, birdIndex: b });
                }
            }
        } else if (count < pairIds.length) {
            const removePairIds = pairIds.slice(count);
            const removedSlotIds = st.slots.filter(s => removePairIds.includes(s.pairId)).map(s => s.id);
            st.slots = st.slots.filter(s => !removePairIds.includes(s.pairId));
            Object.values(r.hits).forEach(byStand => { const cell = byStand[standId]; if (cell) removedSlotIds.forEach(id => delete cell[id]); });
        }
        saveDB(); render();
    }
    function standTargetCount(st) { return st.slots.length; }
    function setStandCount(count) {
        const r = activeRound();
        const n = Math.max(0, parseInt(count) || 0);
        while (r.stands.length < n) r.stands.push({ id: newId(), slots: [] });
        if (r.stands.length > n) r.stands = r.stands.slice(0, n);
        saveDB(); render();
    }
    function finishStandSetup() {

    /* =========================================================================================
       SCORING
    ========================================================================================= */
    let undoSnapshot = null;
    // Barrel is inferred automatically from a target's position within its pair —
    // first bird of a pair/following/on-report group = 1st barrel, second bird = 2nd barrel.
    // No manual toggle: this matches how a shooter actually loads (barrel 1 at the first
    // bird, barrel 2 at the second) rather than tracking genuine "took 2 shots at one bird" recoveries.
    function slotBarrel(st, slotId) {
        const slot = st.slots.find(s => s.id === slotId);
        if (!slot) return 'hit1';
        const group = st.slots.filter(s => s.pairId === slot.pairId);
        return group.findIndex(s => s.id === slotId) === 0 ? 'hit1' : 'hit2';
    }
    function setHit(shooterId, standId, slotId) {
        const r = activeRound();
        if (r.isLocked) return;
        undoSnapshot = JSON.stringify(r.hits);
        ensureHitPath(r, shooterId, standId);
        const st = findStand(r, standId);
        const barrel = slotBarrel(st, slotId);
        const byStand = r.hits[shooterId][standId];
        const cell = byStand[slotId] || (byStand[slotId] = { result: null, missReason: null });
        cell.result = (cell.result === 'hit1' || cell.result === 'hit2') ? null : barrel;
        cell.missReason = null;
        if (cell.result !== null && navigator.vibrate) navigator.vibrate(50);
        saveDB(); render();
    }
    function setMiss(shooterId, standId, slotId) {
        const r = activeRound();
        if (r.isLocked) return;
        undoSnapshot = JSON.stringify(r.hits);
        ensureHitPath(r, shooterId, standId);
        const byStand = r.hits[shooterId][standId];
        const cell = byStand[slotId] || (byStand[slotId] = { result: null, missReason: null });
        cell.result = (cell.result === 'miss') ? null : 'miss';
        if (cell.result !== 'miss') cell.missReason = null;
        // A fresh miss shows the reason list open; un-marking closes it.
        r.expandedMissKey = null;

    /* The miss-reason list is tall (one row per reason) and previously stayed open

       that chip reopens the list to change it. `expandedMissKey` is keyed by

    function missKey(shooterId, slotId) { return shooterId + '::' + slotId; }
    function toggleMissReasonList(shooterId, slotId) {
        const r = activeRound();

        const key = missKey(shooterId, slotId);
        r.expandedMissKey = (r.expandedMissKey === key) ? null : key;
        saveDB(); render();
    }
    function setMissReason(shooterId, standId, slotId, reason) {

    function undo() { if (undoSnapshot) { activeRound().hits = JSON.parse(undoSnapshot); undoSnapshot = null; saveDB(); render(); } }
    function toggleLock() { activeRound().isLocked = !activeRound().isLocked; saveDB(); render(); }

    function shooterStandTotal(round, shooterId, standId) {

        let t = 0;

    /* =========================================================================================
       ANALYSIS ENGINE
    ========================================================================================= */
    function getAllShots({ shooterId = null, groundFilter = null, includeActive = true } = {}) {
        const rounds = [...db.history, ...(includeActive && db.activeRound ? [db.activeRound] : [])];
        const shots = [];
        rounds.forEach(r => {
            if (groundFilter && (r.ground || '').trim().toLowerCase() !== groundFilter.trim().toLowerCase()) return;
            r.stands.forEach((st, standPos) => {
                st.slots.forEach(slot => {
                    Object.keys(r.hits || {}).forEach(shId => {
                        if (shooterId && shId !== shooterId) return;
                        const cell = r.hits[shId]?.[st.id]?.[slot.id];
                        if (!cell || cell.result == null) return;
                        shots.push({
                            roundId: r.id, date: r.date, ground: r.ground || '(no ground set)', shooterId: shId,
                            standId: st.id, standPos: standPos + 1, standTotal: r.stands.length,
                            clayType: slot.clayType, presentation: slot.presentation, pairType: slot.pairType,
                            distance: slot.distance || '(not set)',
                            wind: r.conditions?.wind || '(not set)', light: r.conditions?.light || '(not set)',
                            choke: getShooterChoke(r, shId, st.id) || '(not set)', result: cell.result, missReason: cell.missReason
                        });
                    });
                });
            });
        });
        return shots;
    }
    /* CONFIDENCE / SAMPLE SIZE
       A hit rate from a handful of targets is mostly noise: 3 from 8 on battues is not a
       weakness, it's a coin toss. Acting on that wastes practice time on a problem that
       may not exist, which is the single easiest way for a shooter to spin their wheels.

       Uses a Wilson score interval rather than the textbook normal approximation, because
       the normal one behaves badly exactly where this app lives - small samples and
       proportions near 0% or 100% (it happily produces intervals below 0 or above 100).
       Wilson stays sensible at those extremes.

       A subgroup is only called a genuine difference when its interval sits entirely
       above or below the shooter's own overall average - i.e. the difference survives the
       uncertainty rather than being explainable by it. */
    function wilsonInterval(hits, n, z = 1.96) {
        if (!n) return { lo: 0, hi: 100, half: 50 };
        const p = hits / n;
        const denom = 1 + (z * z) / n;
        const centre = (p + (z * z) / (2 * n)) / denom;
        const half = (z / denom) * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n));
        return {
            lo: Math.max(0, Math.round((centre - half) * 100)),
            hi: Math.min(100, Math.round((centre + half) * 100)),
            half: Math.round(half * 100)
        };
    }
    /* Roughly how many MORE attempts are needed to pin a rate down to +/- marginPct.
       Standard sample-size formula; an estimate, not a promise, since it uses the current
       (itself uncertain) hit rate. Good enough to answer "is this worth chasing yet?". */
    function shotsNeededFor(hits, n, marginPct = 10) {
        const p = n ? hits / n : 0.5;
        const z = 1.96, E = marginPct / 100;
        const need = Math.ceil((z * z * p * (1 - p)) / (E * E));
        return Math.max(0, need - n);
    }
    function pctBy(shots, keyFn, minSample = 5) {
        const groups = {};
        shots.forEach(s => { const k = keyFn(s) || '(untagged)'; (groups[k] = groups[k] || []).push(s); });
        return Object.entries(groups).map(([key, arr]) => {
            const hits = arr.filter(s => s.result === 'hit1' || s.result === 'hit2').length;
            const ci = wilsonInterval(hits, arr.length);
            return {
                key, attempts: arr.length, hits,
                pct: arr.length ? Math.round(hits / arr.length * 100) : 0,
                lowSample: arr.length < minSample,
                ci, needMore: shotsNeededFor(hits, arr.length, 10)
            };
        }).sort((a, b) => a.pct - b.pct);
    }
    /* TIERED EVIDENCE
       Paul asked for useful output from ~50 targets rather than waiting for a few hundred.
       Straight-up lowering the bar would have re-created the exact problem the confidence
       work exists to stop, so instead evidence is TIERED and each tier is labelled for
       what it is:

         firm  - 95% interval sits clear of the shooter's average. Act on it.
         early - 80% interval sits clear. A lead worth investigating, explicitly NOT a
                 diagnosis. 80% is a normal exploratory threshold: roughly a 1-in-5 chance
                 of chasing a ghost, which is a fair trade when the alternative is no
                 direction at all for months.
         none  - genuinely can't tell yet.

       EARLY_MIN_ATTEMPTS stops the early tier firing on a truly tiny subgroup, where even
       an 80% interval is meaningless. Kept at 8 so a ~50-target round can produce signals
       across a handful of presentations. */
    const ANY_MIN_ATTEMPTS = 6;
    const EARLY_MIN_ATTEMPTS = 8;
    const Z_FIRM = 1.96;   // 95%
    const Z_EARLY = 1.2816; // 80%
    function evidenceTier(hits, attempts, baselinePct) {
        /* Hard floor before ANY claim. Worth noting this is a credibility judgement, not a
           statistical one: 0 from 4 against a 60% average genuinely clears a 95% interval
           (about a 2.6% likelihood), so the maths would happily call it confirmed. But
           telling a shooter a weakness is "confirmed" off four targets would rightly look
           absurd and cost trust in every other number on the screen. */
        if (attempts < ANY_MIN_ATTEMPTS) return { tier: 'none', direction: null };
        const firm = wilsonInterval(hits, attempts, Z_FIRM);
        if (firm.hi < baselinePct) return { tier: 'firm', direction: 'weak' };
        if (firm.lo > baselinePct) return { tier: 'firm', direction: 'strong' };
        if (attempts >= EARLY_MIN_ATTEMPTS) {
            const early = wilsonInterval(hits, attempts, Z_EARLY);
            if (early.hi < baselinePct) return { tier: 'early', direction: 'weak' };
            if (early.lo > baselinePct) return { tier: 'early', direction: 'strong' };
        }
        return { tier: 'none', direction: null };
    }
    function confidenceSplit(groups, baselinePct) {
        const firm = [], early = [], unclear = [];
        groups.forEach(g => {
            if (g.attempts === 0) return;
            const ev = evidenceTier(g.hits, g.attempts, baselinePct);
            const row = { ...g, direction: ev.direction, tier: ev.tier };
            if (ev.tier === 'firm') firm.push(row);
            else if (ev.tier === 'early') early.push(row);
            else unclear.push(g);
        });
        firm.sort((a, b) => a.pct - b.pct);
        early.sort((a, b) => a.pct - b.pct);
        unclear.sort((a, b) => b.needMore - a.needMore);
        // `real` kept as firm+early so callers wanting "anything actionable" stay simple.
        return { firm, early, unclear, real: [...firm, ...early] };
    }
    function barrelSplit(shots) {
        const hits = shots.filter(s => s.result === 'hit1' || s.result === 'hit2');
        const hit1 = hits.filter(s => s.result === 'hit1').length, hit2 = hits.filter(s => s.result === 'hit2').length;
        return {
            hit1, hit2, total: hits.length,
            pctFirst: hits.length ? Math.round(hit1 / hits.length * 100) : 0,
            pctSecond: hits.length ? Math.round(hit2 / hits.length * 100) : 0
        };
    }
    /* MISS PATTERNS
       The app already collects *why* each miss happened, but until now that was only ever
       shown as a flat tally, which tells you nothing actionable. The coaching value is in
       crossing miss reason against presentation: "behind on 5 of 6 misses on left-to-right
       crossers" points at a specific, fixable technical fault in a way that "42% on
       crossers" never can.

       Two guards against reading noise as insight:
       - `minMisses` - fewer tagged misses than this and it's flagged low-sample, not a finding.
       - dominance - if misses are spread evenly across reasons there IS no pattern, so a
         group is only called dominant when one reason accounts for at least half of them.
       Both are deliberately conservative: telling someone to rebuild their technique off
       three misses would be worse than saying nothing. */
    /* minMisses lowered from 4 to 3 so patterns surface within a round or two. A group of
       3+ where one cause takes at least half is now reported, but `strength` distinguishes
       a solid pattern from an early one so the UI can say which it is rather than
       presenting both with equal authority. */
    function missPatterns(shots, keyFn, minMisses = 3) {
        const misses = shots.filter(s => s.result === 'miss' && s.missReason);
        const groups = {};
        misses.forEach(s => { const k = keyFn(s) || '(untagged)'; (groups[k] = groups[k] || []).push(s); });
        return Object.entries(groups).map(([key, arr]) => {
            const counts = {};
            arr.forEach(s => { counts[s.missReason] = (counts[s.missReason] || 0) + 1; });
            const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
            const topReason = sorted[0][0], topCount = sorted[0][1];
            const share = Math.round(topCount / arr.length * 100);
            const dominant = arr.length >= minMisses && share >= 50;
            return {
                key, total: arr.length, topReason, topCount, share, counts: sorted,
                lowSample: arr.length < minMisses,
                dominant,
                // A pattern off 6+ misses is worth acting on; 3-5 is a lead to watch.
                strength: !dominant ? 'none' : (arr.length >= 6 ? 'firm' : 'early')
            };
        }).sort((a, b) => (b.dominant - a.dominant) || (b.share - a.share) || (b.total - a.total));
    }
    /* Plain-English reading of a miss reason. These are standard coaching generalisations,
       not certainties - worded as "commonly means" and paired with an on-screen caveat,
       since the same visible miss can have several causes and only a coach watching you
       can confirm which. Returns '' for any reason not in this list, because miss reasons
       are user-editable in Settings and inventing advice for a custom label would be
       worse than staying quiet. */
    function missReasonAdvice(reason) {
        const map = {
            'Behind': 'Commonly means not enough lead, or the gun slowing/stopping as you pull through.',
            'In front': 'Commonly means over-leading, or rushing the shot ahead of the bird.',
            'Above': 'Commonly means shooting over the top — often the head lifting off the stock, or missing the drop on a falling clay.',
            'Below': 'Commonly means the gun is under the line — often not enough gun speed on a riser.',
            "Didn't mount": 'A setup problem rather than a shooting one — look at hold point, mount consistency and timing.',
            'Lost sight of it': 'Usually visual pickup — hold point may be wrong for the bird, or eyes going to the barrels instead of the clay.'
        };
        return map[reason] || '';
    }
    /* PRACTICE PLAN
       Converts the analysis from description into instruction. Everything above tells the
       shooter what happened; this tells them what to go and do about it on the next
       practice session.

       Deliberately built ONLY on findings that survived the confidence check plus miss
       patterns that were dominant - if it drew on raw percentages it would send Paul off
       to fix problems that are really just small-sample noise, which is exactly the
       failure mode the confidence work exists to prevent. That means an empty plan is a
       legitimate and honest output early on, and it says so rather than inventing filler.

       Suggested target counts are round numbers for a practice session, not a formula. */
    function buildPracticePlan(shots, shooterId) {
        const items = [];
        if (!shots.length) return items;
        const hits = shots.filter(s => s.result === 'hit1' || s.result === 'hit2').length;
        const overallPct = Math.round(hits / shots.length * 100);

        const presGroups = pctBy(shots, s => s.presentation);
        const distGroups = pctBy(shots.filter(s => s.distance && s.distance !== '(not set)'), s => s.distance);
        const typeGroups = pctBy(shots, s => s.clayType);
        const split = confidenceSplit([...presGroups, ...distGroups, ...typeGroups], overallPct);
        const firmWeak = split.firm.filter(g => g.direction === 'weak');
        const earlyWeak = split.early.filter(g => g.direction === 'weak');

        // 1. Weak areas - firm findings first, then early signals clearly marked as such.
        firmWeak.slice(0, 3).forEach(g => {
            items.push({
                priority: items.length + 1, tier: 'firm',
                title: g.key,
                headline: `${g.pct}% against your ${overallPct}% average`,
                detail: `A real gap, not a small-sample wobble — your range on this sits entirely below your overall rate. Book a stand that throws this and shoot it deliberately rather than hoping it comes up in a round.`,
                targetShots: 40
            });
        });
        earlyWeak.slice(0, Math.max(0, 3 - firmWeak.length)).forEach(g => {
            items.push({
                priority: items.length + 1, tier: 'early',
                title: g.key,
                headline: `${g.pct}% vs your ${overallPct}% average — early signal off ${g.attempts} shots`,
                detail: `Not confirmed yet, but leaning worse than your average. Treat it as a lead: put some deliberate targets into it and the picture will firm up or disappear. Another ~${g.needMore} shots would settle it.`,
                targetShots: 25
            });
        });

        // 2. Dominant miss patterns - the technical "how" to pair with the "what".
        const patterns = missPatterns(shots, s => s.presentation).filter(p => p.dominant).slice(0, 2);
        patterns.forEach(p => {
            const advice = missReasonAdvice(p.topReason);
            const provisional = p.strength === 'early';
            items.push({
                priority: items.length + 1, tier: p.strength,
                title: `${p.key} — ${p.topReason.toLowerCase()} misses`,
                headline: `${p.topCount} of ${p.total} tagged misses${provisional ? ' — early signal' : ''}`,
                detail: (advice ? advice + ' ' : 'Your misses here cluster on one cause, which usually means a single fixable fault. ')
                    + (provisional
                        ? 'Only a few misses behind this so far — worth watching on the next outing before you rebuild anything.'
                        : 'Worth a lesson rather than solo practice — repeating a fault on your own just embeds it.'),
                targetShots: 25
            });
        });

        // 3. Fatigue - only if the drop is substantial and there's enough data behind it.
        const fatigue = fatigueBuckets(shots);
        const first = fatigue.find(f => f.key === 'First Third'), last = fatigue.find(f => f.key === 'Last Third');
        if (first && last && first.attempts >= 12 && last.attempts >= 12 && (first.pct - last.pct) >= 10) {
            items.push({
                priority: items.length + 1,
                title: 'Concentration over a full round',
                headline: `${first.pct}% early vs ${last.pct}% late`,
                detail: `You're dropping ${first.pct - last.pct} points by the back end of a round. That's usually routine and stamina rather than technique — look at pre-shot routine, food and water, and practise in longer sessions instead of short bursts.`,
                targetShots: 0
            });
        }

        // 4. Second-barrel reliance.
        const barrels = barrelSplit(shots);
        if (barrels.total >= 20 && barrels.pctSecond >= 40) {
            items.push({
                priority: items.length + 1,
                title: 'First-barrel kills',
                headline: `${barrels.pctSecond}% of your hits come off the second barrel`,
                detail: `Leaning on the second barrel is fine on hard pairs but costly when it becomes the habit. Practise pairs with a deliberate focus on breaking the first bird early, so the second barrel stays a backup rather than the plan.`,
                targetShots: 30
            });
        }
        return items;
    }
    function fatigueBuckets(shots) {
        const buckets = { 'First Third': [], 'Middle Third': [], 'Last Third': [] };
        shots.forEach(s => {
            const frac = s.standPos / s.standTotal;
            if (frac <= 1 / 3) buckets['First Third'].push(s);
            else if (frac <= 2 / 3) buckets['Middle Third'].push(s);
            else buckets['Last Third'].push(s);
        });
        return Object.entries(buckets).map(([key, arr]) => {
            const hits = arr.filter(s => s.result === 'hit1' || s.result === 'hit2').length;
            return { key, attempts: arr.length, hits, pct: arr.length ? Math.round(hits / arr.length * 100) : 0 };
        });
    }
    function trendByDate(shots) {
        const groups = {};
        shots.forEach(s => (groups[s.date] = groups[s.date] || []).push(s));
        return Object.entries(groups).map(([date, arr]) => {
            const hits = arr.filter(s => s.result === 'hit1' || s.result === 'hit2').length;
            return { date, attempts: arr.length, pct: arr.length ? Math.round(hits / arr.length * 100) : 0 };
        }).sort((a, b) => a.date.localeCompare(b.date));
    }
    /* SQUAD COMPARISON
       Your own hit % can't tell you whether 55% on a stand was poor shooting or a genuinely
       brutal stand. Comparing against squad-mates on the EXACT SAME targets - same slots,
       same stand, same round, same weather - controls for difficulty, which no amount of
       analysing your own numbers in isolation can do.

       Strictly like-for-like: only rounds where at least one other shooter also recorded
       shots, and only slots where both you and someone else actually took the target. A
       stand someone skipped isn't a comparison.

       Note this compares you against whoever you happen to shoot with, so it says nothing
       about the wider field - a squad of better shots will drag the differential negative
       and vice versa. It answers "was that stand hard, or was it me?", not "how good am I?". */
    function squadComparison(shooterId) {
        const rounds = [...db.history, ...(db.activeRound ? [db.activeRound] : [])];
        let myHits = 0, myAtt = 0, theirHits = 0, theirAtt = 0, roundsCompared = 0;
        const byPres = {};
        const standRows = [];
        rounds.forEach(r => {
            if (!r.hits || !r.hits[shooterId]) return;
            const others = Object.keys(r.hits).filter(id => id !== shooterId);
            if (!others.length) return;
            let roundCounted = false;
            r.stands.forEach((st, standPos) => {
                let sMy = { h: 0, a: 0 }, sTheir = { h: 0, a: 0 };
                st.slots.forEach(slot => {
                    const mine = r.hits[shooterId]?.[st.id]?.[slot.id];
                    if (!mine || mine.result == null) return;
                    const rivals = others.map(id => r.hits[id]?.[st.id]?.[slot.id]).filter(c => c && c.result != null);
                    if (!rivals.length) return;   // nobody else shot this exact target
                    roundCounted = true;
                    const myHit = (mine.result === 'hit1' || mine.result === 'hit2') ? 1 : 0;
                    myHits += myHit; myAtt++; sMy.h += myHit; sMy.a++;
                    rivals.forEach(c => {
                        const h = (c.result === 'hit1' || c.result === 'hit2') ? 1 : 0;
                        theirHits += h; theirAtt++; sTheir.h += h; sTheir.a++;
                    });
                    const key = slot.presentation || '(untagged)';
                    const g = byPres[key] || (byPres[key] = { key, myHits: 0, myAtt: 0, theirHits: 0, theirAtt: 0 });
                    g.myHits += myHit; g.myAtt++;
                    rivals.forEach(c => { g.theirHits += (c.result === 'hit1' || c.result === 'hit2') ? 1 : 0; g.theirAtt++; });
                });
                if (sMy.a && sTheir.a) {
                    standRows.push({
                        label: `${r.ground || 'Unnamed'} · Stand ${standPos + 1}`,
                        date: r.date,
                        myPct: Math.round(sMy.h / sMy.a * 100),
                        theirPct: Math.round(sTheir.h / sTheir.a * 100),
                        myAtt: sMy.a
                    });
                }
            });
            if (roundCounted) roundsCompared++;
        });
        if (!myAtt || !theirAtt) return null;
        const myPct = Math.round(myHits / myAtt * 100);
        const theirPct = Math.round(theirHits / theirAtt * 100);
        const presentations = Object.values(byPres)
            .filter(g => g.myAtt >= 4 && g.theirAtt >= 4)
            .map(g => {
                const mp = Math.round(g.myHits / g.myAtt * 100);
                const tp = Math.round(g.theirHits / g.theirAtt * 100);
                return { key: g.key, myPct: mp, theirPct: tp, diff: mp - tp, myAtt: g.myAtt };
            })
            .sort((a, b) => a.diff - b.diff);
        // Stands everyone found hard: squad also scored poorly, so it wasn't just you.
        const brutalStands = standRows.filter(s => s.theirPct <= 50 && s.myAtt >= 3).sort((a, b) => a.theirPct - b.theirPct).slice(0, 3);
        return { myPct, theirPct, diff: myPct - theirPct, myAtt, theirAtt, roundsCompared, presentations, brutalStands };
    }
    function bestRound(shooterId) {
        const rounds = db.history.filter(r => r.shooterIds.includes(shooterId));
        let best = null;
        rounds.forEach(r => {
            const att = shooterRoundAttempts(r, shooterId);
            if (!att) return;
            const total = shooterRoundTotal(r, shooterId);
            const pct = total / att * 100;
            if (!best || pct > best.pct || (pct === best.pct && total > best.total)) {
                best = { roundId: r.id, ground: r.ground || 'Unnamed Ground', date: r.date, event: r.event, total, att, pct: Math.round(pct) };
            }
        });
        return best;
    }
    function rollingAverage(shooterId, windowSize) {
        const rounds = db.history.filter(r => r.shooterIds.includes(shooterId)).sort((a, b) => (b.finishedAt || 0) - (a.finishedAt || 0)).slice(0, windowSize);
        if (rounds.length === 0) return null;
        const pcts = rounds.map(r => { const att = shooterRoundAttempts(r, shooterId); const t = shooterRoundTotal(r, shooterId); return att ? t / att * 100 : 0; });
        return Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length);
    }

    /* =========================================================================================
       BACKUP / RESTORE
    ========================================================================================= */
    function backupFilename(prefix) {
        return `${prefix}-${new Date().toISOString().split('T')[0]}.json`;
    }
    function writeBackupFile(filename) {
        const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        // Give the download a moment to start before releasing the blob.
        setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
    function exportBackup() { writeBackupFile(backupFilename('sarge-backup')); }
    /* AUTOMATIC BACKUP - runs on finishing a round, at most ONCE PER DAY.
       All the app's data lives in browser storage for this origin, so anything that clears
       site data destroys it. A file in Downloads sits outside browser storage entirely, so
       it survives that (and survives reinstalling the app). That's the whole point: it
       turns "Paul remembered to press Export" from the only safeguard into a backstop.

       WHY ONCE A DAY RATHER THAN OVERWRITING A SINGLE FILE: a web app cannot overwrite a
       file in Downloads. Reusing one filename doesn't replace anything - Android saves
       "sarge-auto (1).json", "(2)" and so on, which is worse, because you can no longer
       tell which is newest. The File System Access API would allow genuine overwriting via
       a retained file handle, but Chrome on Android doesn't support showSaveFilePicker
       (planned for a future Android release, not available now). So the practical fix is
       fewer files: one per shooting day, dated, newest obvious by name.

       The trade-off, stated plainly because it matters: if two rounds are shot in one day,
       only the first triggers a backup, so that file won't contain the second round until
       the next day's backup catches up. The data is still safe in the app; it's only the
       off-device copy that lags. Manual Export is there for an immediate up-to-date copy.

       Failure must be silent and harmless - a blocked download must never interrupt
       finishing a round. */
    function alreadyBackedUpToday() {
        if (!db.lastAutoBackupAt) return false;
        const last = new Date(db.lastAutoBackupAt).toISOString().split('T')[0];
        return last === new Date().toISOString().split('T')[0];
    }
    function autoBackupAfterRound() {
        try {
            if (alreadyBackedUpToday()) return;
            writeBackupFile(backupFilename('sarge-auto'));
            db.lastAutoBackupAt = Date.now();
            saveDB();
        } catch (e) {}
    }
    function toggleAutoBackup() { db.autoBackup = (db.autoBackup === false); saveDB(); render(); }
    function triggerImport() { document.getElementById('import-file-input').click(); }
    function handleImportFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const parsed = JSON.parse(e.target.result);
                if (!parsed.profiles || !parsed.history) { alert('That file doesn\'t look like a Sarge backup.'); return; }
                if (!confirm('This will REPLACE all current data (profiles, history, in-progress round) with the backup. Continue?')) return;
                db = Object.assign(defaultDB(), parsed);
                db.presets = Object.assign(defaultPresets(), db.presets || {});
                saveDB(); render();
                alert('Backup restored.');
            } catch (err) { alert('Could not read that file - is it a valid Sarge backup JSON?'); }
        };
        reader.readAsText(file);
    }
    function resetAllData() {
        if (!confirm('This wipes EVERYTHING — all profiles, all round history, all presets. This cannot be undone. Consider exporting a backup first. Continue?')) return;
        localStorage.removeItem(DB_KEY);
        location.reload();
    }

    /* =========================================================================================
       PRESETS (Settings)
    ========================================================================================= */
    function addPreset(listName, value) {
        if (!value || !value.trim()) return;
        if (!db.presets[listName].includes(value.trim())) db.presets[listName].push(value.trim());
        saveDB(); render();
    }
    function removePreset(listName, value) {
        db.presets[listName] = db.presets[listName].filter(v => v !== value);
        saveDB(); render();
    }

    /* =========================================================================================
       GOALS
    ========================================================================================= */
    function addGoal(shooterId) {
        const p = getProfile(shooterId); if (!p) return;
        if (!p.goals) p.goals = [];
        p.goals.push({ id: newId(), metricType: 'presentation', metricValue: db.presets.presentations[0], targetPct: 80, targetDate: '', createdAt: Date.now() });
        saveDB(); render();
    }
    function updateGoal(shooterId, goalId, field, value) {
        const p = getProfile(shooterId); const g = (p.goals || []).find(g => g.id === goalId);
        if (!g) return;
        g[field] = field === 'targetPct' ? parseInt(value) || 0 : value;
        if (field === 'metricType') g.metricValue = metricPresetList(value)[0] || '';
        saveDB(); render();
    }
    function removeGoal(shooterId, goalId) {
        const p = getProfile(shooterId); p.goals = (p.goals || []).filter(g => g.id !== goalId); saveDB(); render();
    }
    function resetShooterStats(shooterId) {
        const p = getProfile(shooterId);
        const name = p ? p.name : 'this shooter';
        if (!confirm(`Reset ALL recorded stats for ${name}? This clears every shot they've logged across every round in history (their totals will show as 0/0). Other shooters' data in those rounds is not affected. This cannot be undone.`)) return;
        [...db.history, ...(db.activeRound ? [db.activeRound] : [])].forEach(r => {
            if (r.hits && r.hits[shooterId]) delete r.hits[shooterId];
            if (r.chokes && r.chokes[shooterId]) delete r.chokes[shooterId];
        });
        saveDB(); render();
    }
    function goalProgress(shooterId, goal) {
        const shots = getAllShots({ shooterId });
        const filtered = shots.filter(s => s[goal.metricType] === goal.metricValue);
        const hits = filtered.filter(s => s.result === 'hit1' || s.result === 'hit2').length;
        const pct = filtered.length ? Math.round(hits / filtered.length * 100) : 0;
        return { pct, attempts: filtered.length };
    }
    function metricPresetList(metricType) {
        if (metricType === 'presentation') return db.presets.presentations;
        if (metricType === 'distance') return db.presets.distanceBands;
        return db.presets.clayTypes;
    }

    /* =========================================================================================
       RENDER — ROUTER
    ========================================================================================= */
    function render() {
        document.body.classList.toggle('glove-mode', !!db.gloveMode);
        renderHeaderActions();
        renderNav();
        const container = document.getElementById('app-container');
        switch (db.view) {
            case 'home': container.innerHTML = viewHome(); break;
            case 'profiles': container.innerHTML = viewProfiles(); break;
            case 'setup-info': container.innerHTML = viewSetupInfo(); break;
            case 'setup-squad': container.innerHTML = viewSetupSquad(); break;
            case 'setup-stands': container.innerHTML = viewSetupStands(); break;
            case 'scoring': container.innerHTML = viewScoring(); break;
            case 'history': container.innerHTML = viewHistory(); break;
            case 'round-detail': container.innerHTML = viewRoundDetail(); break;
            case 'analysis': container.innerHTML = viewAnalysis(); break;
            case 'settings': container.innerHTML = viewSettings(); break;
            default: container.innerHTML = viewHome();
        }
        // Guarded: if the Lucide CDN hasn't loaded (offline before first cache, blocked
        // network, slow start) a bare lucide.createIcons() throws a ReferenceError at the
        // end of every render. Icons are decoration - losing them must never take the app
        // down with them.
        try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch (e) {}
        if (db.view === 'analysis') renderTrendChart();
        if (db.view === 'settings') showStorageStatus();
    }
    // Trend chart lives on a <canvas> that gets wiped and recreated every render()
    // (innerHTML replacement above destroys the old canvas element), so the Chart.js
    // instance has to be destroyed and rebuilt each time too - can't just update data.
    // Wrapped defensively: if Chart.js failed to load (offline before first cache, or
    // the CDN is blocked), the rest of the app must keep working - this chart is a
    // nice-to-have on top of the bar-row data, not a dependency for anything else.
    let trendChartInstance = null;
    function renderTrendChart() {
        const canvas = document.getElementById('trend-chart');
        if (!canvas || typeof Chart === 'undefined') return;
        if (trendChartInstance) { trendChartInstance.destroy(); trendChartInstance = null; }
        const shots = getAllShots({ shooterId: db.analysisShooterId });
        const trend = trendByDate(shots);
        if (!trend.length) return;
        try {
            trendChartInstance = new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: trend.map(t => getUKDate(t.date)),
                    datasets: [{
                        label: 'Hit %', data: trend.map(t => t.pct),
                        borderColor: '#f97316', backgroundColor: 'rgba(249,115,22,0.12)',
                        borderWidth: 2, tension: 0.25, fill: true, pointRadius: 3, pointBackgroundColor: '#f97316'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } }
                }
            });
        } catch (e) {}
    }

    function r_upd(field, value) { activeRound()[field] = value; saveDB(); }
    function r_upd_nested(obj, field, value) { activeRound()[obj][field] = value; saveDB(); }

                    <button onclick="goToStandSetup()" class="flex-1 bg-slate-900 text-white py-3 rounded-xl text-xs font-black uppercase">Next: Stands →</button>

       VIEW: SETUP - STANDS (count only — targets are tagged live, stand by stand, during scoring)

                <h3 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">How Many Stands?</h3>
                <p class="text-[9px] text-slate-400 font-bold mb-2">You don't need to know what's on them yet — you'll tag each stand's targets and choke right when you arrive at it.</p>
                <div class="flex items-center gap-2 mb-2">

                    <span class="text-[9px] text-slate-400 font-bold uppercase">stands (change anytime, even mid-round)</span>
                </div>
                <div class="flex flex-wrap gap-1.5">
                    ${r.stands.map((s, i) => `<span class="chip active">Stand ${i + 1}</span>`).join('') || `<p class="text-[10px] text-slate-400 font-bold py-2">No stands yet — set a count above.</p>`}
                </div>
                <div class="flex gap-2 mt-3">
                    <button onclick="wizardNext('setup-squad')" class="flex-1 bg-white border border-slate-300 py-3 rounded-xl text-xs font-black uppercase">← Back</button>
                    <button onclick="finishStandSetup()" class="flex-1 bg-orange-500 text-white py-3 rounded-xl text-xs font-black uppercase">Start Scoring →</button>
