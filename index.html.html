<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Clayscore</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#12161d">
<link rel="manifest" href="manifest2.json">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
/* =============================================================================
   CLAYSCORE v2

   A ground-up rebuild around one idea: SCORING MUST BE FASTER THAN A PENCIL.
   v1 is excellent at analysis but asks for a lot of tagging on the stand, while
   you're cold with a squad waiting. v2 separates CAPTURE from ENRICHMENT - log
   hit/miss in seconds, add the detail afterwards over a coffee if you want to.

   Visual identity is deliberate rather than default-framework: a scorecard
   aesthetic - ruled paper surfaces, stencilled condensed type, clay orange, and
   a dark "field" chrome. No Tailwind, no icon CDN; everything here is hand-written
   so it works offline with zero external dependencies except html2canvas for the
   share card.
============================================================================= */
:root{
  --ink:#12161d; --ink-2:#1d242e; --ink-3:#2b3542;
  --paper:#fbf9f4; --paper-2:#f3efe6; --rule:#e2dbcc;
  --clay:#e8621d; --clay-2:#ff8b47;
  --hit:#1f8a4c; --miss:#c8342b;
  --text:#12161d; --muted:#6b7280; --faint:#9ca3af;
  --radius:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
body.dark{
  --paper:#161b23; --paper-2:#1b212a; --rule:#2b3542;
  --text:#eef2f7; --muted:#9aa7b6; --faint:#6b7787;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; overscroll-behavior-y:none;
}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{background:none;border:0;cursor:pointer}
.stencil{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-stretch:condensed}
.mono{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{
  background:var(--ink);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:40;border-bottom:1px solid #000;
}
header .mark{width:30px;height:30px;flex:0 0 auto}
header h1{font-size:17px;letter-spacing:.14em}
header .spacer{flex:1}
.hbtn{color:#8b97a6;padding:8px;border-radius:10px;line-height:0}
.hbtn.on{color:var(--clay)}
main{flex:1;padding:14px 12px calc(90px + var(--safe-b));display:flex;flex-direction:column;gap:12px}

/* ---------- card: ruled scorecard paper ---------- */
.card{
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);
  padding:14px;position:relative;overflow:hidden;
}
.card.ruled::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
}
.card>*{position:relative}
.card h2{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-bottom:10px}
.card.dark{background:var(--ink-2);border-color:var(--ink-3);color:#fff}
.card.dark h2{color:#8b97a6}

/* ---------- buttons ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px;border-radius:12px;background:var(--ink);color:#fff;
  font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;
}
.btn.clay{background:var(--clay)}
.btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--text)}
/* The page background is ALWAYS dark, whatever the theme - cards are the light
   surface, not the page. So a ghost button sitting directly on the page cannot
   use var(--text): in light mode that is near-black on near-black, i.e. an
   invisible button. Scoping by direct child of <main> makes every top-level
   ghost button legible by construction rather than by me remembering to. */
main>.btn.ghost{color:#e8edf3;border-color:#39465a}
main>.btn.ghost:active{background:rgba(255,255,255,.07)}
main>.tiny,main>.muted{color:#93a0b0}
.btn.sm{padding:10px 12px;font-size:11px;width:auto}
.btn:disabled{opacity:.35}
.row{display:flex;gap:8px}

/* ---------- fast capture: the heart of v2 ---------- */
.capture{display:flex;flex-direction:column;gap:10px}
.tgt-head{display:flex;align-items:baseline;justify-content:space-between}
.tgt-num{font-size:34px;font-weight:900;letter-spacing:-.02em}
.tgt-of{font-size:12px;color:var(--muted);font-weight:700}
.hitmiss{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hm{
  height:132px;border-radius:16px;font-size:20px;font-weight:900;text-transform:uppercase;
  letter-spacing:.1em;border:2px solid transparent;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
}
.hm.hit{background:rgba(31,138,76,.12);color:var(--hit);border-color:rgba(31,138,76,.35)}
.hm.miss{background:rgba(200,52,43,.10);color:var(--miss);border-color:rgba(200,52,43,.3)}
.hm:active{transform:scale(.97)}
.hm small{font-size:10px;letter-spacing:.14em;opacity:.7;font-weight:800}
body.glove .hm{height:168px;font-size:26px}
/* progress pips - the whole stand at a glance */
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:20px;height:20px;border-radius:6px;background:var(--paper-2);border:1px solid var(--rule);
  font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--faint)}
.pip.h{background:var(--hit);border-color:var(--hit);color:#fff}
.pip.m{background:var(--miss);border-color:var(--miss);color:#fff}
.pip.cur{outline:2px solid var(--clay);outline-offset:1px}
button.pip{cursor:pointer}
/* shooter chips for a squad */
.who{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.who::-webkit-scrollbar{display:none}
.chip{
  padding:8px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--paper-2);
  font-size:11px;font-weight:800;white-space:nowrap;color:var(--muted)
}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.clay{background:var(--clay);border-color:var(--clay);color:#fff}

/* ---------- misc ---------- */
.stat{text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;letter-spacing:-.02em}
.stat span{font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--rule);background:var(--paper-2)}
label.lbl{font-size:10px;letter-spacing:.12em;color:var(--muted);font-weight:800;text-transform:uppercase;display:block;margin-bottom:5px}
.muted{color:var(--muted);font-size:11px;font-weight:600;line-height:1.5}
.tiny{font-size:10px;color:var(--faint);font-weight:600}
.bar{height:8px;border-radius:5px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--clay)}
.divider{height:1px;background:var(--rule);margin:10px 0}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);
  display:flex;padding:8px 8px calc(8px + var(--safe-b));border-top:1px solid #000;
}
nav button{flex:1;padding:8px 4px;border-radius:10px;color:#7d8896;font-size:9px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button.on{color:#fff;background:var(--ink-2)}
nav svg{width:19px;height:19px}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;background:rgba(8,11,16,.8);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:18px}
.ov.hide{display:none}
.sheet{background:var(--paper);border-radius:18px;padding:18px;width:100%;max-width:380px;max-height:86vh;overflow:auto}
.sheet h3{font-size:16px;font-weight:900;letter-spacing:-.01em;margin-bottom:6px}

/* ---------- share card ---------- */
#sharecard{position:fixed;left:-9999px;top:0;width:540px;background:var(--ink);color:#fff;padding:34px}
</style>
</head>
<body>
<div id="app">
  <header>
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="18" fill="none" stroke="#e8621d" stroke-width="2.5"/>
      <ellipse cx="20" cy="20" rx="12" ry="5" fill="#e8621d" opacity=".9"/>
      <circle cx="20" cy="20" r="3" fill="#12161d"/>
    </svg>
    <h1 class="stencil">Clayscore</h1>
    <div class="spacer"></div>
    <button class="hbtn" id="btn-glove" onclick="toggleGlove()" title="Glove mode" aria-label="Glove mode">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8"/></svg>
    </button>
    <button class="hbtn" id="btn-dark" onclick="toggleDark()" title="Dark mode" aria-label="Dark mode">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<div class="ov hide" id="ov" onclick="if(event.target.id==='ov')closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>
<div id="sharecard"></div>
<!-- NO accept filter on purpose. Android commonly reports a .json file as
     application/octet-stream or with no type at all, so accept="application/json"
     greys the file out in the picker and it cannot be chosen. Filtering here
     buys nothing - the file is validated when it is read. -->
<input type="file" id="importer" style="display:none" onchange="importBackup(this.files[0])">

<script>
/* =============================================================================
   DATA

   Model is deliberately CLOUD-READY even though v2 ships local-only: every round
   is a self-contained record with its own id and `updatedAt`, and all mutations
   go through saveRound(). That means dropping Firestore in later is a matter of
   syncing individual round documents - no rewrite, and no last-write-wins over a
   single giant blob (the trap flagged in the Firebase note).
============================================================================= */
/* Bumped with every release and shown in Settings. Must match the service
   worker cache name - a test asserts it does - so "which build am I on?" has an
   answer without opening developer tools. */
var APP_VERSION='v48';
const KEY='clayscore_v2';
let uid=0; const newId=()=>Date.now().toString(36)+(uid++).toString(36);
var REASONS=['Behind','In front','Above','Below',"Didn't mount",'Lost it','Unsure'];
const PRESENTATIONS=['Crosser L→R','Crosser R→L','Incomer L→R','Incomer R→L','Outgoer L→R','Outgoer R→L',
  'Quartering L→R','Quartering R→L','Teal L→R','Teal R→L','Looper L→R','Looper R→L','Rabbit L→R','Rabbit R→L','Driven','Overhead'];

function blank(){return{
  v:2,
  mode:'simple',            // 'simple' | 'pro' - progressive disclosure
  dark:false, glove:false,
  shooters:[],              // {id,name,me}
  grounds:[],               // remembered ground names
  rounds:[],                // finished rounds
  live:null,                // round in progress
  view:'home',
  seenTrophies:[],
  lastDiscipline:'sporting',
  lastThrow:null,
  ssPick:null,
  goals:[],
  groundLocations:{},       // ground key -> {lat,lon} so a re-visit needs no GPS prompt
  autoBackup:true,
  lastBackupDay:null,
  guns:[],                  // armoury
  cartridges:[],
  defaultGunId:null,
  defaultCartridgeId:null
}}
var db=blank();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
function load(){
  try{const r=localStorage.getItem(KEY); if(r) db=Object.assign(blank(),JSON.parse(r));}catch(e){}
  if(!Array.isArray(db.shooters))db.shooters=[];
  if(!Array.isArray(db.rounds))db.rounds=[];
}
function saveRound(r){ r.updatedAt=Date.now(); save(); }

/* Function declarations, not const arrows: these are the helpers tests need to
   reach, and a const at script top level is not a window property. */
function me(){return db.shooters.find(s=>s.me)||db.shooters[0];}
function shooter(id){return db.shooters.find(s=>s.id===id)||{name:'Unknown'};}
function gkey(s){return (s||'').trim().toLowerCase();}

/* ---------- round helpers ---------- */
function newRound(){return{
  id:newId(),date:new Date().toISOString().slice(0,10),ground:'',
  shooterIds:[],stands:[],scores:{},activeStand:0,activeShooter:null,
  createdAt:Date.now(),updatedAt:Date.now(),enriched:false,
  conditions:{readings:[]},  // one reading at the start, more if re-checked mid-round
  gunId:null,cartridgeId:null,countedShots:false,
  discipline:'sporting',layouts:1
}}
/* A stand is just a target count in simple mode.

   In Pro mode the detail lives on the STAND, not on each target. A sporting
   stand presents the same small set of birds over and over — usually a pair,
   sometimes a single, occasionally three or four. So a stand defines `cycle`
   birds (A, B, C, D) and target i simply shows bird i % cycle. Tag A and B once
   and the rest of the stand inherits them; nothing is asked twice. */
/* HOW the stand's targets are thrown. v1 had this as a pair type on every pair
   group and v2 lost it, which left English Sporting silently treating every
   stand as singles. It changes nothing about scoring - each clay is still one
   result - but it is the difference between "I miss teal" and "I miss the second
   bird of a simultaneous pair", which is a completely different fault. */
var THROWS=[
  {k:'single',   label:'Singles',            short:'Single', targets:1},
  {k:'report',   label:'On report pair',     short:'Report', targets:2},
  {k:'sim',      label:'Simultaneous pair',  short:'Sim',    targets:2},
  {k:'following',label:'Following pair',     short:'Following',targets:2}
];
function throwOf(k){return THROWS.find(t=>t.k===k)||null;}
function standThrow(st){return st&&st.throwType?throwOf(st.throwType):null;}
/* Position within its pair, for a stand thrown as pairs: 0 = first bird,
   1 = second. Singles and untyped stands return null. */
function pairPos(st,i){
  const t=standThrow(st);
  if(!t||t.targets!==2)return null;
  return i%2;
}
function throwLabel(st,i){
  const t=standThrow(st);
  if(!t)return null;
  if(t.targets===1)return t.label;
  return t.short+' pair · '+(pairPos(st,i)===0?'1st':'2nd');
}
function makeStand(n){
  return {id:newId(),cycle:Math.min(2,n),birds:[],choke:null,throwType:null,
    slots:Array.from({length:n},()=>({id:newId(),pres:null,dist:null}))};
}
// Enough letters for every target on a stand to be a different bird. A stand of
// 5 pairs is 10 targets, and if all ten differ, all ten need naming.
var LETTER='ABCDEFGHIJKLMNOP';
function standCycle(st){
  const n=st.slots.length||1;
  return Math.max(1,Math.min(st.cycle==null?Math.min(2,n):st.cycle,n));
}
function birdIdx(st,i){return i%standCycle(st);}
// Resolve a target's presentation: stand-level bird first, then any legacy
// per-target value written by an earlier version or a v1 import.
function presFor(st,i){
  const b=(st.birds||[])[birdIdx(st,i)];
  if(b&&b.pres)return b.pres;
  return st.slots[i]?.pres||null;
}
function setBird(st,idx,pres){
  if(!Array.isArray(st.birds))st.birds=[];
  while(st.birds.length<standCycle(st))st.birds.push({pres:null});
  st.birds[idx]={pres:pres||null};
}
// which target numbers a given bird covers, e.g. bird A on a 4-bird pair stand -> "1, 3"
function targetsForBird(st,idx){
  const out=[];
  st.slots.forEach((_,i)=>{if(birdIdx(st,i)===idx)out.push(i+1);});
  return out;
}
/* Distance is a BAND, not a number. Nobody eyeballs 37 yards accurately, and a
   false precision would poison the analysis. Three honest buckets instead. */
var BANDS=['Close','Mid','Long'];
/* Clay types, as v1 had them. A midi behaves nothing like a battue, so this is
   a genuine analytical dimension, not decoration. */
var CLAY_TYPES=['Standard','Midi','Mini','Battue','Rabbit','Flash','Teal'];
var BAND_HINT={Close:'under about 25 yards',Mid:'roughly 25 to 40 yards',Long:'beyond about 40 yards'};
function distFor(st,i){
  const b=(st.birds||[])[birdIdx(st,i)];
  if(b&&b.dist)return b.dist;
  return st.slots[i]?.dist||null;
}
function clayFor(st,i){
  const b=(st.birds||[])[birdIdx(st,i)];
  if(b&&b.clay)return b.clay;
  return st.slots[i]?.clayType||null;
}
function setBirdClay(st,idx,c){
  if(!Array.isArray(st.birds))st.birds=[];
  while(st.birds.length<standCycle(st))st.birds.push({pres:null,dist:null,clay:null});
  st.birds[idx]=Object.assign({pres:null,dist:null,clay:null},st.birds[idx],{clay:c||null});
}
function setBirdDist(st,idx,d){
  if(!Array.isArray(st.birds))st.birds=[];
  while(st.birds.length<standCycle(st))st.birds.push({pres:null,dist:null});
  st.birds[idx]=Object.assign({pres:null,dist:null},st.birds[idx],{dist:d||null});
}

/* =============================================================================
   DISCIPLINES

   English Sporting and CPSA Sportrap. They share the scoring engine — a target
   is killed or lost — but differ in layout, in what a target is identified by,
   and critically in the ORDER OF SHOOTING.

   Sportrap, per the CPSA rules:
   - 5 stands in a line, numbered 1 to 5 from the left. Traps lettered, placed
     wherever the organiser decides, visible from every stand.
   - A menu board in front of each stand lists that stand's targets in order.
   - Each stand is 5 targets: one single, one pair, one pair. A round is 25
     targets; competitions run in multiples of 25.
   - Both barrels may be used at a single. A pair allows two cartridges.
   - THE SQUAD OCCUPIES ALL FIVE STANDS AT ONCE. Every shooter shoots the single
     for the stand they are standing in, in cage order; then every shooter the
     first pair; then every shooter the second pair. Only then does the squad
     rotate — 1 to 4 move one stand right, 5 goes to stand 1.

   That last point is the whole reason this needs its own ordering engine: unlike
   Sporting, no shooter completes a stand before the next begins, and at any
   moment every shooter is on a DIFFERENT stand.
============================================================================= */
var DISCIPLINES={
  sporting:{key:'sporting',name:'English Sporting',short:'Sporting'},
  sportrap:{key:'sportrap',name:'Sportrap',short:'Sportrap'},
  compak:{key:'compak',name:'Compak Sporting',short:'Compak'},
  skeet:{key:'skeet',name:'English Skeet',short:'Skeet'},
  abt:{key:'abt',name:'Automatic Ball Trap',short:'ABT'},
  supersporting:{key:'supersporting',name:'Super Sporting',short:'Super Sp'}
};
var TRAPS=['A','B','C','D','E','F'];      // lettered, as marked in front of each trap
var SR_STANDS=5;                          // stands in a standard layout
var SR_PER_STAND=5;                       // 1 single + 2 pairs
var PAIR_TYPES=[{k:'report',label:'On report'},{k:'sim',label:'Simultaneous'},
  {k:'rafale',label:'Rafale'}];           // rafale is Compak only - see pairTypesFor()
function isSportrap(r){return r&&r.discipline==='sportrap';}
function isCompak(r){return r&&r.discipline==='compak';}
/* Sportrap and Compak share a shape: a line of stands, lettered traps, a menu
   board at each stand, 5 targets a stand, and the squad rotating element by
   element. Everything below is written against that shared shape rather than
   against either discipline, so a third one of the same family is configuration
   rather than code. */
function isMenuFormat(r){return isSportrap(r)||isCompak(r);}
function cageCount(r){return Math.max(1,(r&&r.cages)||SR_STANDS);}
function trapsFor(r){return TRAPS.slice(0,Math.max(2,(r&&r.trapCount)||TRAPS.length));}
/* Rafale - two targets from the same trap on the same line, the second released
   as fast as possible - exists in the Compak rules and not in Sportrap. */
function pairTypesFor(r){return isCompak(r)?PAIR_TYPES:PAIR_TYPES.filter(p=>p.k!=='rafale');}
function pairTypeLabel(k){const p=PAIR_TYPES.find(x=>x.k===k);return p?p.label:'Pair';}

/* Element labels follow the menu board: a single, then the two pairs in order. */
function elementLabel(st,sl){
  if(sl.element==='single')return 'Single';
  const t=pairTypeLabel(sl.element==='d1'?st.d1Type:st.d2Type);
  const n=sl.element==='d1'?'first':'second';
  return t+' pair ('+n+')'+(sl.pos===0?' — 1st barrel':' — 2nd barrel');
}
function elementShort(st,sl){
  if(sl.element==='single')return 'Single';
  const t=(sl.element==='d1'?st.d1Type:st.d2Type)==='sim'?'Sim':'Report';
  return t+' '+(sl.pos===0?'1':'2');
}
function makeMenuStand(index){
  const slots=[];
  const add=(element,pos)=>slots.push({id:newId(),element:element,pos:pos,trap:null});
  add('single',0); add('d1',0); add('d1',1); add('d2',0); add('d2',1);
  return{id:newId(),index:index,cycle:1,birds:[],choke:null,
    d1Type:'report',d2Type:'sim',   // single, on report pair, simultaneous pair
    slots:slots};
}
// a stand's menu is complete once every target on it has a trap letter against it
function menuComplete(st){return st.slots.every(sl=>!!sl.trap);}
function menuSummary(st){
  const s=st.slots;
  const t=i=>s[i].trap||'?';
  return 'Single '+t(0)+' · '+(st.d1Type==='sim'?'Sim':'Rep')+' '+t(1)+t(2)+
         ' · '+(st.d2Type==='sim'?'Sim':'Rep')+' '+t(3)+t(4);
}

/* ---------- the ordering engine ----------
   Shooter k starts in cage k+1. On rotation r they are on stand (k + r) mod 5 of
   their current layout. Within a rotation the squad shoots the single in cage
   order, then the first pair in cage order, then the second. */
var SR_PHASES=['single','d1','d2'];
function sportrapQueue(r){
  const out=[];
  const n=r.shooterIds.length;
  const layouts=Math.max(1,r.layouts||1);
  const cages=cageCount(r);
  for(let L=0;L<layouts;L++){
    for(let rot=0;rot<cages;rot++){
      for(const phase of SR_PHASES){
        for(let k=0;k<n;k++){
          const standIdx=L*cages+((k+rot)%cages);
          const st=r.stands[standIdx]; if(!st)continue;
          st.slots.forEach(sl=>{
            if(sl.element===phase)out.push({sh:r.shooterIds[k],standIndex:standIdx,slot:sl.id});
          });
        }
      }
    }
  }
  return out;
}
// the next unscored entry in the queue, for the whole squad
function sportrapNext(r){
  const q=sportrapQueue(r);
  for(const e of q){
    if(done(r,e.sh))continue;
    const c=r.scores[e.sh]&&r.scores[e.sh][e.slot];
    if(!c||!c.r)return e;
  }
  return null;
}

/* =============================================================================
   SUPER SPORTING (SSP) — CPSA technical rules

   "Except as detailed below all of the rules and regulations for English
   Sporting are fully applicable." So it uses the Sporting ordering engine
   unchanged; what it adds is the menu board.

   - Every stand carries a MINIMUM OF 3 TRAPS, lettered A, B, C... with the
     letter visible from the stand. Traps may be anywhere, in front of or behind
     the line of fire.
   - A menu board lists the traps in the order they will be released.
   - 6 to 10 targets a stand; at a registered shoot at least 7 stands and 50
     targets, and at least 20% of the competition's targets thrown as singles.
   - Elements: singles, on report pairs, FOLLOWING pairs, simultaneous pairs.
   - On a mixed stand, singles and on report pairs are shot before the sim pairs.
   - Full use of the gun on singles - two shots at one target, still one result.

   IMPORTANT DIFFERENCE FROM SPORTRAP AND COMPAK: those letter the traps across
   the whole layout, so trap C means the same target from every stand. In Super
   Sporting the traps are lettered PER STAND, so stand 1's trap A and stand 4's
   trap A are different machines throwing different birds. Pooling results by
   letter would therefore be meaningless, and the analysis deliberately does not
   do it.
============================================================================= */
var SS_ELEMENTS=[
  {k:'single',label:'Single',targets:1,traps:1},
  {k:'report',label:'On report',targets:2,traps:2},
  {k:'following',label:'Following',targets:2,traps:1},   // both from the same trap
  {k:'sim',label:'Simultaneous',targets:2,traps:2}
];
var SS_MIN_TRAPS=3, SS_MIN_STANDS=7, SS_MIN_TARGETS=50;
var SS_STAND_MIN=6, SS_STAND_MAX=10, SS_SINGLES_SHARE=0.2;
function isSuperSporting(r){return r&&r.discipline==='supersporting';}
function ssElement(k){return SS_ELEMENTS.find(e=>e.k===k)||SS_ELEMENTS[0];}
function makeSSStand(index,trapCount){
  return{id:newId(),index:index,station:index+1,cycle:1,birds:[],choke:null,
    trapCount:Math.max(SS_MIN_TRAPS,trapCount||SS_MIN_TRAPS),
    menu:[],slots:[]};
}
function ssTraps(st){return TRAPS.slice(0,Math.max(SS_MIN_TRAPS,st.trapCount||SS_MIN_TRAPS));}
function ssTargetCount(st){return st.slots.length;}
// rebuild the stand's slots from its menu, preserving nothing - callers guard
function ssRebuild(st){
  st.slots=[];
  (st.menu||[]).forEach(el=>{
    const def=ssElement(el.type);
    for(let i=0;i<def.targets;i++){
      st.slots.push({id:newId(),element:el.type,pos:i,
        trap:def.traps===1?(el.traps[0]||null):(el.traps[i]||null)});
    }
  });
}
function ssStandScored(r,st){
  return st.slots.some(sl=>r.shooterIds.some(id=>{
    const c=r.scores[id]&&r.scores[id][sl.id];return c&&c.r;}));
}
function ssAddElement(standId,type,traps){
  const r=db.live,st=r.stands.find(x=>x.id===standId); if(!st)return;
  const def=ssElement(type);
  if(ssTargetCount(st)+def.targets>SS_STAND_MAX){
    notice('Stand full','A Super Sporting stand takes at most '+SS_STAND_MAX+' targets. Remove something first.');
    return;
  }
  st.menu.push({type:type,traps:traps||[]});
  ssRebuild(st); saveRound(r); render();
}
function ssRemoveElement(standId,idx){
  const r=db.live,st=r.stands.find(x=>x.id===standId); if(!st)return;
  const go=()=>{st.menu.splice(idx,1);ssRebuild(st);saveRound(r);render();};
  if(ssStandScored(r,st))confirmSheet('Change the menu?',
    'This stand already has scores against it. Changing the menu rebuilds its targets and clears them.','Change',go);
  else go();
}
function ssSetTrapCount(standId,n){
  const r=db.live,st=r.stands.find(x=>x.id===standId); if(!st)return;
  st.trapCount=Math.max(SS_MIN_TRAPS,Math.min(n,TRAPS.length));
  // drop any trap letters that no longer exist
  const valid=ssTraps(st);
  (st.menu||[]).forEach(el=>el.traps=(el.traps||[]).map(t=>valid.includes(t)?t:null));
  ssRebuild(st); saveRound(r); render();
}
function ssElementLabel(st,sl){
  const def=ssElement(sl.element);
  if(def.targets===1)return def.label+(sl.trap?' · '+sl.trap:'');
  return def.label+' '+(sl.pos===0?'1st':'2nd')+(sl.trap?' · '+sl.trap:'');
}
/* Compliance against the registered-shoot minimums. Reported, never enforced -
   club and practice shoots routinely will not comply and the round is still
   worth recording. */
function ssCompliance(r){
  const out=[];
  const stands=r.stands.length;
  const total=r.stands.reduce((a,s)=>a+s.slots.length,0);
  if(stands<SS_MIN_STANDS)out.push(stands+' stands — a registered shoot needs at least '+SS_MIN_STANDS+'.');
  if(total<SS_MIN_TARGETS)out.push(total+' targets — a registered shoot needs at least '+SS_MIN_TARGETS+'.');
  const badSize=r.stands.filter(s=>s.slots.length&&(s.slots.length<SS_STAND_MIN||s.slots.length>SS_STAND_MAX));
  if(badSize.length)out.push(badSize.length+' stand'+(badSize.length===1?'':'s')+' outside the '+SS_STAND_MIN+'–'+SS_STAND_MAX+' target range.');
  const fewTraps=r.stands.filter(s=>(s.trapCount||0)<SS_MIN_TRAPS);
  if(fewTraps.length)out.push(fewTraps.length+' stand'+(fewTraps.length===1?'':'s')+' with fewer than '+SS_MIN_TRAPS+' traps.');
  if(total){
    const singles=r.stands.reduce((a,s)=>a+s.slots.filter(x=>x.element==='single').length,0);
    if(singles/total<SS_SINGLES_SHARE)
      out.push(Math.round(singles/total*100)+'% singles — the rules require at least '+Math.round(SS_SINGLES_SHARE*100)+'%.');
  }
  const unlettered=r.stands.reduce((a,s)=>a+s.slots.filter(x=>!x.trap).length,0);
  if(unlettered)out.push(unlettered+' target'+(unlettered===1?'':'s')+' with no trap letter recorded.');
  return out;
}

/* =============================================================================
   AUTOMATIC BALL TRAP (ABT) — UIT/ISSF automatic trap rules as used by the CPSA

   The simplest discipline in the app to score and the most awkward to order.

     6.4   ONE trap, centre of the layout, oscillating in both the vertical and
           horizontal planes. There is nothing to tag: no houses, no trap
           letters, no menu. Every target comes from the same machine.
     6.3   Five stations on an arc 15m behind the traphouse.
     9.1   A squad is normally SIX competitors.
     9.2   Five take stations 1 to 5; the sixth waits behind post 1 and moves in
           as soon as the shooter on station 1 has fired. Firing runs strictly by
           station - 1, 2, 3, 4, 5 - and each shooter moves one station right
           once the shooter to their right has fired. From station 5 they walk
           round the back to post 1. This continues until each has shot 25.
     9.2   Two cartridges may be used at each target and a kill scores ONE point
           whichever barrel breaks it. That is what makes ABT easy here and DTL
           hard: DTL scores 3 for the first barrel and 2 for the second, which
           the killed/lost model cannot express.

   The rotation, derived: the squad occupies a ring of positions - five stations
   plus any waiting places. Over one lap of five shots every shooter advances
   exactly one position around that ring. So during lap L the shooter on station
   i is squad[(i - L) mod R], where R is the ring size. With six shooters R is 6
   and the waiting man comes in at station 1; with five R is 5 and the shooter
   coming off station 5 fires again immediately at station 1 - which is precisely
   why squads are normally six.
============================================================================= */
var ABT_STATIONS=5;
var ABT_PER_SHOOTER=25;
function isABT(r){return r&&r.discipline==='abt';}
function abtRing(r){
  const n=r.shooterIds.length;
  const R=Math.max(n,ABT_STATIONS);
  const ring=[];
  for(let i=0;i<R;i++)ring.push(i<n?r.shooterIds[i]:null);   // empty places if short-squadded
  return ring;
}
function abtQueue(r){
  const ring=abtRing(r),R=ring.length;
  const visits={},out=[];
  for(let L=0;L<ABT_PER_SHOOTER*R/ABT_STATIONS;L++){
    for(let i=0;i<ABT_STATIONS;i++){
      const sh=ring[((i-L)%R+R)%R];
      if(!sh)continue;
      const v=visits[sh]||(visits[sh]=new Array(ABT_STATIONS).fill(0));
      const j=v[i]++;
      const st=r.stands[i];
      if(!st||!st.slots[j])continue;
      out.push({sh:sh,standIndex:i,slot:st.slots[j].id,lap:L});
    }
  }
  return out;
}
function abtNext(r){
  for(const e of abtQueue(r)){
    if(done(r,e.sh))continue;
    const c=r.scores[e.sh]&&r.scores[e.sh][e.slot];
    if(!c||!c.r)return e;
  }
  return null;
}

/* =============================================================================
   ENGLISH SKEET — CPSA General and Technical Rule Booklet 1 (CPSA/B1/2019/01)

   Seven stations, a High House on the left and a Low House on the right. The
   sequence is fixed by rule, which is precisely why this is worth encoding: a
   shooter new to Skeet should never have to remember which house comes first.

     22.3  St1 two singles + double · St2 two singles + double · St3 two singles
           St4 two singles + double (shooter NOMINATES the first target)
           St5 two singles · St6 two singles + double · St7 two singles + double
     22.4  Singles: HIGH house first on stations 1 to 6. On station 7 it must be
           the LOW house first.
     22.5  Doubles: HIGH first on stations 1 and 2; LOW first on stations 6 and 7.
     22.7  That is 24. The 25th is the OPTION: the first target missed is
           repeated immediately and recorded as the 25th shot. Hit all 24 and the
           shooter instead chooses a High or Low target from station 7.
     22.6  Each competitor completes a station before leaving it, and nobody
           moves on until the whole squad has finished that station.
     22.22 One shot only at each target.

   Two consequences the shared-slot model has to bend around, both per-shooter:
   the station 4 nomination, and the option target - which lands at a different
   moment for each shooter because it follows THEIR first miss.
============================================================================= */
var SKEET_STATIONS=7;
var HOUSE={high:'High house',low:'Low house'};
/* The rule-defined sequence. `house:null` on station 4's double means "whatever
   this shooter nominated" - resolved per shooter, never guessed. */
function skeetStationPlan(n){           // n is 1-based
  const singles=(n===7)?['low','high']:['high','low'];   // 22.4
  const plan=singles.map(h=>({element:'single',house:h}));
  if(n===3||n===5)return plan;                            // 22.3c, 22.3e
  let first=null;                                         // 22.5
  if(n===1||n===2)first='high';
  else if(n===6||n===7)first='low';
  else if(n===4)first=null;                               // 22.3d - nominated
  const second=first===null?null:(first==='high'?'low':'high');
  plan.push({element:'double',house:first,pos:0});
  plan.push({element:'double',house:second,pos:1});
  return plan;
}
function isSkeet(r){return r&&r.discipline==='skeet';}
function makeSkeetStation(n){
  const plan=skeetStationPlan(n);
  return{id:newId(),index:n-1,station:n,cycle:1,birds:[],choke:null,
    slots:plan.map(p=>({id:newId(),element:p.element,house:p.house,
      pos:p.pos==null?0:p.pos,trap:null}))};
}
/* Station 4's double is shot in the order the shooter nominated. Until they
   nominate, the app says so rather than assuming. */
function skeetHouse(r,st,sl,sh){
  if(sl.house)return sl.house;
  if(st.station!==4||sl.element!=='double')return null;
  const nom=(r.nominations||{})[sh];
  if(!nom)return null;
  return sl.pos===0?nom:(nom==='high'?'low':'high');
}
function skeetLabel(r,st,sl,sh){
  const h=skeetHouse(r,st,sl,sh);
  const which=h?HOUSE[h]:'Nominate first';
  if(sl.element==='single')return which+' single';
  return which+(h?'':'')+' · double '+(sl.pos===0?'first':'second');
}
function nominate(house){
  const r=db.live; if(!r)return;
  if(!r.nominations)r.nominations={};
  r.nominations[r.activeShooter]=house;
  saveRound(r);render();
}
/* ---------- the option, rule 22.7 ----------
   Held on a dedicated eighth stand with one slot per shooter, because it is a
   different target at a different moment for every one of them. */
function optionStand(r){return r.stands[SKEET_STATIONS];}
function optionSlot(r,sh){
  const os=optionStand(r); if(!os)return null;
  return os.slots.find(s=>s.owner===sh)||null;
}
// the shooter's first lost target in station order, or null if they are clean
function firstMiss(r,sh){
  for(let i=0;i<SKEET_STATIONS;i++){
    const st=r.stands[i]; if(!st)continue;
    for(const sl of st.slots){
      const c=r.scores[sh]&&r.scores[sh][sl.id];
      if(!c||!c.r)return undefined;      // not yet reached - unknown
      if(c.r==='m')return{st:st,sl:sl};
    }
  }
  return null;                            // all 24 struck
}
/* Walks the round exactly as the referee does: station by station, each shooter
   completing that station, and the option inserted the moment it falls due. */
function skeetNext(r){
  for(let i=0;i<SKEET_STATIONS;i++){
    const st=r.stands[i]; if(!st)continue;
    for(const sh of r.shooterIds){
      let firstMissSeen=false;
      // has this shooter already dropped one at an earlier station?
      for(let j=0;j<i;j++){
        for(const sl of r.stands[j].slots){
          const c=r.scores[sh]&&r.scores[sh][sl.id];
          if(c&&c.r==='m'){firstMissSeen=true;break;}
        }
        if(firstMissSeen)break;
      }
      for(const sl of st.slots){
        const c=r.scores[sh]&&r.scores[sh][sl.id];
        if(!c||!c.r)return{sh:sh,standIndex:i,slot:sl.id};
        if(c.r==='m'&&!firstMissSeen){
          firstMissSeen=true;
          const os=optionSlot(r,sh);
          if(os){
            const oc=r.scores[sh]&&r.scores[sh][os.id];
            if(!oc||!oc.r)return{sh:sh,standIndex:SKEET_STATIONS,slot:os.id};
          }
        }
      }
    }
  }
  // everyone through all seven stations: any clean shooter takes their choice
  for(const sh of r.shooterIds){
    const os=optionSlot(r,sh); if(!os)continue;
    const oc=r.scores[sh]&&r.scores[sh][os.id];
    if(!oc||!oc.r)return{sh:sh,standIndex:SKEET_STATIONS,slot:os.id};
  }
  return null;
}

/* =============================================================================
   ARMOURY — guns, chokes, cartridges

   Two honest limits recorded up front, because the numbers would otherwise
   flatter themselves:

   1. SHOT COUNTS ARE A FLOOR, NOT A TALLY. The app knows how many targets you
      shot at, not how many cartridges left the gun. A second barrel on a miss,
      or on a pair, is invisible to it. So the count is stated as "at least N"
      everywhere it appears, and the maintenance interval should be read with
      that in mind.
   2. GUN AND CARTRIDGE COMPARISONS ARE OBSERVATIONAL, NOT EXPERIMENTAL. You
      don't shoot two guns alternately on the same birds — you change gun
      between rounds, grounds and seasons. Any difference the app reports is
      confounded with everything else that changed. It says so on the card.
============================================================================= */
/* Ordered by constriction, in the eighths British shooters actually use. The
   earlier list jumped from 1/4 to 1/2 to 3/4 and omitted the odd eighths
   entirely, which left common chokes like 3/8 unrecordable. */
var CHOKES=['Cyl','Skeet','1/8','1/4','3/8','1/2','5/8','3/4','7/8','Full','Extra Full'];
var GAUGES=['12','20','28','.410','16'];
function gunById(id){return db.guns.find(g=>g.id===id)||null;}
function cartById(id){return db.cartridges.find(c=>c.id===id)||null;}
function makeGun(name){return{id:newId(),name:name,gauge:'12',chokeType:'multi',
  shots:0,cleanEvery:500,shotsAtLastClean:0,log:[],retired:false};}
function makeCart(name){return{id:newId(),name:name,load:'28',shot:'7.5',fibre:false};}
function gunLabel(g){return g?g.name+(g.gauge?' · '+g.gauge+'g':''):'Not recorded';}
function cartLabel(c){return c?c.name+(c.load?' · '+c.load+'g':'')+(c.shot?' · '+c.shot:''):'Not recorded';}
// shots since the gun was last cleaned, and whether that's over the interval
function cleanState(g){
  if(!g)return null;
  const since=Math.max(0,(g.shots||0)-(g.shotsAtLastClean||0));
  const every=g.cleanEvery||0;
  return{since,every,due:every>0&&since>=every,pct:every>0?Math.min(1,since/every):0};
}
function gunsDue(){return db.guns.filter(g=>!g.retired&&cleanState(g).due);}
/* Called once per round, guarded by countedShots so re-saving or importing the
   same round can never double-count a gun's wear. */
function countShots(r){
  if(r.countedShots)return 0;
  const g=gunById(r.gunId); if(!g)return 0;
  let n=0;
  r.stands.forEach(st=>st.slots.forEach(sl=>{
    r.shooterIds.forEach(id=>{const c=r.scores[id]?.[sl.id];if(c&&c.r&&id===(me()||{}).id)n++;});
  }));
  g.shots=(g.shots||0)+n; r.countedShots=true; save();
  return n;
}
function logClean(gunId,note){
  const g=gunById(gunId); if(!g)return;
  if(!Array.isArray(g.log))g.log=[];
  g.log.unshift({at:Date.now(),atShots:g.shots||0,
    since:Math.max(0,(g.shots||0)-(g.shotsAtLastClean||0)),note:note||null});
  g.shotsAtLastClean=g.shots||0;
  save();
}

/* =============================================================================
   CONDITIONS

   Wind and light change a sporting round more than most kit does, so the round
   records them. Bands rather than raw figures, for the same reason distance is
   banded: "18 mph gusting 27" is not something you can compare across rounds,
   but "Breezy" is.

   Everything here fails soft. No GPS permission, no network, offline in a field
   with no signal - the round still scores perfectly, it just has no reading.
============================================================================= */
function windBand(mph){
  if(mph==null)return null;
  if(mph<4)return'Calm'; if(mph<11)return'Light'; if(mph<19)return'Breezy';
  if(mph<29)return'Windy'; return'Strong';
}
function lightBand(cloud){
  if(cloud==null)return null;
  if(cloud<25)return'Bright'; if(cloud<70)return'Mixed'; return'Overcast';
}
function cardinal(deg){
  if(deg==null)return'';
  return['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(deg/22.5)%16];
}
function deviceCoords(){
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    let settled=false;
    const done=v=>{if(!settled){settled=true;res(v);}};
    setTimeout(()=>done(null),8000);
    navigator.geolocation.getCurrentPosition(
      p=>done({lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)}),
      ()=>done(null),{timeout:7000,maximumAge:600000});
  });
}
async function fetchConditions(r,note){
  const k=gkey(r.ground);
  let loc=k?db.groundLocations[k]:null;
  if(!loc){
    loc=await deviceCoords();
    if(loc&&k){db.groundLocations[k]=loc;save();}
  }
  if(!loc)return{error:'no-location'};
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+
      '&current=temperature_2m,precipitation,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m'+
      '&wind_speed_unit=mph&temperature_unit=celsius';
    const res=await fetch(u);
    if(!res.ok)return{error:'http-'+res.status};
    const j=await res.json();
    const c=j&&j.current; if(!c)return{error:'no-data'};
    const reading={
      at:Date.now(),note:note||null,
      temp:c.temperature_2m,wind:c.wind_speed_10m,gust:c.wind_gusts_10m,
      dir:c.wind_direction_10m,cloud:c.cloud_cover,precip:c.precipitation,
      windBand:windBand(c.wind_speed_10m),lightBand:lightBand(c.cloud_cover)
    };
    if(!r.conditions)r.conditions={readings:[]};
    r.conditions.readings.push(reading);
    saveRound(r);
    return{reading};
  }catch(e){return{error:'offline'}}
}
function conditionsText(r){
  const rd=r.conditions&&r.conditions.readings;
  if(!rd||!rd.length)return null;
  const a=rd[rd.length-1];
  const bits=[];
  if(a.temp!=null)bits.push(Math.round(a.temp)+'°C');
  if(a.wind!=null)bits.push(a.windBand+' '+Math.round(a.wind)+'mph'+(a.dir!=null?' '+cardinal(a.dir):''));
  if(a.lightBand)bits.push(a.lightBand);
  if(a.precip>0)bits.push('rain');
  return bits.join(' · ');
}
// the band a round was shot in, for grouping shots in analysis
function roundBand(r,which){
  const rd=r.conditions&&r.conditions.readings;
  if(!rd||!rd.length)return null;
  return rd[0][which]||null;
}
function cell(r,sh,slotId,make){
  if(!r.scores[sh])r.scores[sh]={};
  if(!r.scores[sh][slotId]&&make)r.scores[sh][slotId]={r:null,why:null};
  return r.scores[sh][slotId];
}
function roundStats(r,sh){
  let hit=0,shot=0;
  r.stands.forEach(st=>st.slots.forEach(sl=>{
    const c=r.scores[sh]?.[sl.id];
    if(c&&c.r){shot++;if(c.r==='h')hit++;}
  }));
  return{hit,shot,pct:shot?Math.round(hit/shot*100):0};
}
function allShots(sh){
  const out=[];
  db.rounds.forEach(r=>r.stands.forEach((st,si)=>st.slots.forEach((sl,i)=>{
    const c=r.scores[sh]?.[sl.id];
    if(!c||!c.r)return;
    out.push({round:r.id,date:r.date,ground:r.ground||'—',stand:si+1,
      seq:0,ofRound:0,   // filled in below: position through the round
      standOf:r.stands.length,
      res:c.r,why:c.why,
      discipline:r.discipline||'sporting',
      trap:isMenuFormat(r)?(sl.trap||null):null,
      standTrap:isSuperSporting(r)&&sl.trap?('S'+(st.index+1)+' '+sl.trap):null,
      element:(r.discipline||'sporting')==='sporting'?(standThrow(st)?standThrow(st).label:null)
        :isSuperSporting(r)?ssElement(sl.element).label
        :isABT(r)?'Single'
        :isSkeet(r)?(sl.element==='option'?'Option':(sl.element==='single'?'Single':'Double'))
        :isMenuFormat(r)?elementShort(st,sl):null,
      house:isSkeet(r)?(skeetHouse(r,st,sl,sh)||null):null,
      srStand:(isSkeet(r)||isABT(r))?(st.station||null)
        :isSuperSporting(r)?(st.index+1)
        :isMenuFormat(r)?((st.index%cageCount(r))+1):null,
      pres:presFor(st,i),dist:distFor(st,i),clay:clayFor(st,i),
      pairPos:pairPos(st,i),
      wind:roundBand(r,'windBand'),light:roundBand(r,'lightBand'),
      choke:st.choke||null,
      gun:r.gunId?gunLabel(gunById(r.gunId)):null,
      cart:r.cartridgeId?cartLabel(cartById(r.cartridgeId)):null});
  })));
  /* Position through the round, for the fatigue curve. Slots are stored in the
     order they were shot, so the running index is the shooting order. */
  const byRound={};
  out.forEach(x=>(byRound[x.round]=byRound[x.round]||[]).push(x));
  Object.values(byRound).forEach(list=>{
    list.forEach((x,i)=>{x.seq=i;x.ofRound=list.length;});
  });
  return out;
}
function careerPct(sh){const a=allShots(sh);return a.length?Math.round(a.filter(s=>s.res==='h').length/a.length*100):0;}

/* ---------- untagged misses drive the enrichment prompt ---------- */
function untaggedMisses(r,sh){
  const out=[];
  r.stands.forEach((st,si)=>st.slots.forEach((sl,i)=>{
    const c=r.scores[sh]?.[sl.id];
    // a miss still needs review if it has no reason at all, OR if it is carrying
    // the automatic "Unsure" that nobody has actually thought about yet
    if(c&&c.r==='m'&&(!c.why||c.whyAuto))out.push({stand:si,idx:i,slot:sl});
  }));
  return out;
}

/* =============================================================================
   BRIEFING - what history knows about where you're about to shoot.
   Only claims things it can actually evidence; stays quiet otherwise.
============================================================================= */
function briefing(groundName,sh){
  const k=gkey(groundName); if(!k)return null;
  const rounds=db.rounds.filter(r=>gkey(r.ground)===k&&r.scores[sh]);
  if(!rounds.length)return null;
  const per=rounds.map(r=>roundStats(r,sh)).filter(s=>s.shot>0);
  if(!per.length)return null;
  const best=per.reduce((a,b)=>b.pct>a.pct?b:a);
  const avg=Math.round(per.reduce((a,s)=>a+s.pct,0)/per.length);
  // weakest reason at this ground, only if we have enough tagged misses to mean it
  const shots=[]; rounds.forEach(r=>r.stands.forEach(st=>st.slots.forEach(sl=>{
    const c=r.scores[sh]?.[sl.id]; if(c&&c.r)shots.push(c);})));
  const misses=shots.filter(c=>c.r==='m'&&c.why&&c.why!=='Unsure');
  let topWhy=null;
  if(misses.length>=5){
    const t={}; misses.forEach(c=>t[c.why]=(t[c.why]||0)+1);
    const [w,n]=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
    if(n/misses.length>=.35)topWhy={why:w,n,of:misses.length};
  }
  return{visits:per.length,avg,best:best.pct,topWhy};
}

/* =============================================================================
   RIVALRY - head-to-head on rounds actually shot together. This is the
   retention mechanic: a standing record against people you know beats any
   badge an app invents for you.
============================================================================= */
function rivalries(sh){
  const map={};
  db.rounds.forEach(r=>{
    const mine=roundStats(r,sh); if(!mine.shot)return;
    r.shooterIds.forEach(id=>{
      if(id===sh)return;
      const theirs=roundStats(r,id); if(!theirs.shot)return;
      const m=map[id]||(map[id]={w:0,l:0,d:0,n:0,myPts:0,theirPts:0});
      m.n++; m.myPts+=mine.pct; m.theirPts+=theirs.pct;
      if(mine.pct>theirs.pct)m.w++; else if(mine.pct<theirs.pct)m.l++; else m.d++;
    });
  });
  return Object.entries(map).map(([id,m])=>({
    id,name:shooter(id).name,...m,
    myAvg:Math.round(m.myPts/m.n),theirAvg:Math.round(m.theirPts/m.n)
  })).sort((a,b)=>b.n-a.n);
}

/* =============================================================================
   TROPHIES - derived from history on every read, never stored. Nothing here is
   awarded for merely opening the app; every one requires a real shooting result.
============================================================================= */
function trophies(sh){
  const out=[];
  const rounds=db.rounds.filter(r=>roundStats(r,sh).shot>0);
  if(!rounds.length)return out;
  const per=rounds.map(r=>({r,s:roundStats(r,sh)}));

  // straight stands
  let straights=0,bestStraight=0;
  rounds.forEach(r=>r.stands.forEach(st=>{
    const cs=st.slots.map(sl=>r.scores[sh]?.[sl.id]).filter(c=>c&&c.r);
    if(cs.length>=4&&cs.every(c=>c.r==='h')){straights++;bestStraight=Math.max(bestStraight,cs.length);}
  }));
  if(straights)out.push({t:'Straight Stand',d:`${straights} stand${straights>1?'s':''} cleared without a miss`,tier:straights>=10?'gold':straights>=3?'silver':'bronze',icon:'star'});

  // personal best
  const best=per.reduce((a,b)=>b.s.pct>a.s.pct?b:a);
  if(best.s.shot>=25)out.push({t:'Personal Best',d:`${best.s.hit}/${best.s.shot} (${best.s.pct}%) at ${best.r.ground||'unrecorded ground'}`,tier:best.s.pct>=80?'gold':best.s.pct>=65?'silver':'bronze',icon:'crown'});

  // consistency: 3 rounds in a row above career average
  const sorted=[...per].sort((a,b)=>a.r.createdAt-b.r.createdAt);
  const car=careerPct(sh); let run=0,bestRun=0;
  sorted.forEach(p=>{if(p.s.pct>=car){run++;bestRun=Math.max(bestRun,run);}else run=0;});
  if(bestRun>=3)out.push({t:'In The Groove',d:`${bestRun} rounds running at or above your average`,tier:bestRun>=6?'gold':'silver',icon:'flame'});

  // ground explorer
  const gs=new Set(rounds.map(r=>gkey(r.ground)).filter(Boolean));
  if(gs.size>=2)out.push({t:'Travelling Gun',d:`Shot at ${gs.size} different grounds`,tier:gs.size>=6?'gold':gs.size>=4?'silver':'bronze',icon:'map'});

  // volume
  const total=allShots(sh).length;
  if(total>=100)out.push({t:'Barrel Time',d:`${total} targets logged`,tier:total>=1000?'gold':total>=500?'silver':'bronze',icon:'target'});

  // honest self-reporter - only counts if misses are actually tagged
  const ms=allShots(sh).filter(s=>s.res==='m');
  const tagged=ms.filter(s=>s.why&&s.why!=='Unsure').length;
  if(ms.length>=20&&tagged/ms.length>=.8)out.push({t:'Kept The Book',d:`${Math.round(tagged/ms.length*100)}% of your misses diagnosed`,tier:'silver',icon:'book'});

  return out;
}

}
