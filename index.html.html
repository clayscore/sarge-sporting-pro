          value="${draft.counts[id]||draft.stands*draft.per}" onchange="draft.counts['${id}']=+this.value||0">
      </div>`).join('')}
      <div class="tiny">Different totals are fine — everyone stops when they've shot theirs.</div>`:''}
  </div>

  ${disc==='supersporting'?`<div class="card">
    <h2 class="stencil">Layout</h2>
    <label class="lbl">Stands</label>${numPicker(1,10,draft.stands,'draft.stands')}
    <label class="lbl" style="margin-top:12px">Traps on each stand</label>
    ${numPicker(SS_MIN_TRAPS,6,draft.ssTraps||SS_MIN_TRAPS,'draft.ssTraps')}
    <div class="tiny" style="margin-top:8px">Targets come from the menu board at each stand, not from here — build each stand's menu when you get to it. ${draft.stands<SS_MIN_STANDS?'<b>A registered shoot needs at least '+SS_MIN_STANDS+' stands.</b>':''}</div>
  </div>`:disc==='skeet'||disc==='abt'?'':disc==='sportrap'||disc==='compak'?(()=>{
    const cages=disc==='compak'?(draft.cages||SR_STANDS):SR_STANDS;
    const lay=draft.layouts||1;
    return `<div class="card">
    <h2 class="stencil">Layout</h2>
    ${disc==='compak'?`<label class="lbl">Stands</label>
      <div class="row" style="margin-bottom:12px">
        <button class="btn ${cages===5?'clay':'ghost'}" onclick="draft.cages=5;render()">5 stands · traps A–F</button>
        <button class="btn ${cages===4?'clay':'ghost'}" onclick="draft.cages=4;render()">4 stands · traps A–E</button>
      </div>`:''}
    <label class="lbl">Layouts</label>
    ${numPicker(1,4,lay,'draft.layouts')}
    <div class="tiny" style="margin-top:8px">${lay*cages*SR_PER_STAND} targets — ${lay} layout${lay===1?'':'s'} of ${cages} stands. You will copy each stand's menu board as you reach it.</div>
  </div>`})():`<div class="card">
    <h2 class="stencil">Layout</h2>
    <div class="grid2">
      <div><label class="lbl">Stands</label>${numPicker(1,10,draft.stands,'draft.stands')}</div>
      <div><label class="lbl">${(draft.throwType==='single')?'Singles per stand':'Pairs per stand'}</label>
        ${(draft.throwType==='single')
          ? numPicker(1,10,draft.per,'draft.per')
          : numPicker(1,5,Math.max(1,Math.round(draft.per/2)),'draft.pairs')}</div>
    </div>
    <label class="lbl" style="margin-top:12px">How are they usually thrown here?</label>
    <div style="display:flex;flex-wrap:wrap;gap:5px">
      ${THROWS.map(t=>`<button class="chip ${draft.throwType===t.k?'clay':''}" style="padding:11px 12px"
        onclick="setDraftThrow('${t.k}')">${esc(t.label)}</button>`).join('')}
    </div>
    <div class="tiny" style="margin-top:8px">${draft.stands*draft.per} targets — ${draft.stands} stand${draft.stands===1?'':'s'} of ${
      (draft.throwType==='single')?draft.per+' single'+(draft.per===1?'':'s')
      :(draft.per/2)+' pair'+(draft.per===2?'':'s')+' ('+draft.per+' clays)'}. Sets every stand to start with; change any stand as you reach it. Need more than 10 stands, or a stand with more targets than the rest? Add them from the Stand menu once you have started.</div>
  </div>`}

  ${db.mode==='pro'?kitCard():''}

  <button class="btn clay" onclick="beginRound()" ${draft.ids.length?'':'disabled'}>Start scoring</button>`;
}
/* A number chosen from a row of big taps rather than typed. Typing a number on a
   phone summons the keyboard over the form and needs a confirm; tapping does not. */
function numPicker(lo,hi,cur,target){
  const opts=[];for(let i=lo;i<=hi;i++)opts.push(i);
  /* `draft.pairs` is a view onto `draft.per`: a shooter walking up to a stand
     counts pairs, not clays, so that is what the app asks for. The stored value
     stays in targets because that is what a stand is actually made of. */
  const set=target==='draft.pairs'?'setDraftPairs':null;
  return `<div style="display:flex;flex-wrap:wrap;gap:5px">
    ${opts.map(n=>`<button class="chip ${cur===n?'clay':''}" style="padding:12px 0;min-width:40px;font-size:14px;text-align:center"
      onclick="${set?set+'('+n+')':target+'='+n+';render()'}">${n}</button>`).join('')}
  </div>`;
}
function setDraftPairs(n){ draft.per=Math.max(2,n*2); render(); }
/* Switching to singles keeps the clay count sensible rather than halving the
   card without telling anyone. */
function setDraftThrow(k){
  const was=draft.throwType;
  draft.throwType=(was===k?null:k);
  if(draft.throwType==='single'&&was!=='single'&&draft.per%2===0)draft.per=Math.max(1,draft.per);
  if(was==='single'&&draft.throwType&&draft.throwType!=='single'&&draft.per%2)draft.per=draft.per+1;
  render();
}
function kitCard(){
  const due=gunsDue();
  const gid=draft.gunId!==undefined?draft.gunId:db.defaultGunId;
  const cid=draft.cartridgeId!==undefined?draft.cartridgeId:db.defaultCartridgeId;
  if(!db.guns.length&&!db.cartridges.length)return `<div class="card">
    <h2 class="stencil">Kit</h2>
    <div class="muted">No guns or cartridges set up. Add them under Setup → Armoury if you want to track wear and compare kit. Entirely optional — rounds record fine without it.</div>
  </div>`;
  return `<div class="card">
    <h2 class="stencil">Kit</h2>
    ${db.guns.filter(g=>!g.retired).length?`<label class="lbl">Gun</label>
      <div class="who" style="margin-bottom:10px">
        ${db.guns.filter(g=>!g.retired).map(g=>`<button class="chip ${gid===g.id?'clay':''}" onclick="draft.gunId='${g.id}';render()">${esc(gunLabel(g))}</button>`).join('')}
        <button class="chip ${gid?'':'on'}" onclick="draft.gunId=null;render()">None</button>
      </div>`:''}
    ${db.cartridges.length?`<label class="lbl">Cartridge</label>
      <div class="who">
        ${db.cartridges.map(c=>`<button class="chip ${cid===c.id?'clay':''}" onclick="draft.cartridgeId='${c.id}';render()">${esc(cartLabel(c))}</button>`).join('')}
        <button class="chip ${cid?'':'on'}" onclick="draft.cartridgeId=null;render()">None</button>
      </div>`:''}
    ${due.length?`<div class="divider"></div><div class="muted" style="color:var(--miss)">
      ${due.map(g=>`${esc(g.name)} is ${cleanState(g).since} shots past its ${cleanState(g).every}-shot cleaning interval.`).join(' ')}</div>`:''}
  </div>`;
}
function toggleShooter(id){
  const i=draft.ids.indexOf(id);
  if(i<0)draft.ids.push(id); else draft.ids.splice(i,1);
  render();
}
function addShooter(){
  const el=document.getElementById('newname');const n=(el.value||'').trim();
  if(!n)return;
  const s={id:newId(),name:n,me:!db.shooters.length};
  db.shooters.push(s);draft.ids.push(s.id);save();render();
}
function beginRound(){
  const r=newRound();
  r.ground=(draft.ground||'').trim();
  if(r.ground&&!db.grounds.some(g=>gkey(g)===gkey(r.ground)))db.grounds.push(r.ground);
  r.shooterIds=[...draft.ids];
  // random start order so the same person isn't always first
  for(let i=r.shooterIds.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r.shooterIds[i],r.shooterIds[j]]=[r.shooterIds[j],r.shooterIds[i]];}
  r.discipline=draft.discipline||'sporting';
  r.gunId=draft.gunId||null; r.cartridgeId=draft.cartridgeId||null;
  db.lastDiscipline=r.discipline;
  if(r.gunId)db.defaultGunId=r.gunId;
  if(r.cartridgeId)db.defaultCartridgeId=r.cartridgeId;
  if(r.discipline==='supersporting'){
    /* Sporting's course shape with a menu board on every stand. Stands start
       empty - the menu is copied off the board on arrival, and defines the
       stand's targets. */
    r.layouts=1;
    for(let i=0;i<draft.stands;i++)r.stands.push(makeSSStand(i,draft.ssTraps||SS_MIN_TRAPS));
    r.limits={}; draft.ids.forEach(id=>r.limits[id]=Infinity);   // set by the menus as they are built
    r.activeShooter=r.shooterIds[0];
  }else if(r.discipline==='abt'){
    /* Five stations, one trap, 25 targets each. Every shooter shoots five from
       every station, so the stations hold five shared slots apiece. */
    r.layouts=1;
    for(let i=0;i<ABT_STATIONS;i++){
      const st={id:newId(),index:i,station:i+1,cycle:1,birds:[],choke:null,slots:[]};
      for(let j=0;j<5;j++)st.slots.push({id:newId(),element:'single',house:null,pos:j,trap:null});
      r.stands.push(st);
    }
    r.limits={}; r.shooterIds.forEach(id=>r.limits[id]=ABT_PER_SHOOTER);
    const firstA=abtNext(r);
    r.activeShooter=firstA?firstA.sh:r.shooterIds[0];
    r.activeStand=firstA?firstA.standIndex:0;
  }else if(r.discipline==='skeet'){
    /* Seven stations by rule, plus an eighth holder for the per-shooter option
       target. 24 scheduled + 1 option = 25. */
    r.layouts=1;
    for(let n=1;n<=SKEET_STATIONS;n++)r.stands.push(makeSkeetStation(n));
    const opt={id:newId(),index:SKEET_STATIONS,station:null,cycle:1,birds:[],choke:null,slots:[]};
    r.shooterIds.forEach(id=>opt.slots.push({id:newId(),element:'option',house:null,pos:0,owner:id,trap:null}));
    r.stands.push(opt);
    r.nominations={};
    r.limits={}; r.shooterIds.forEach(id=>r.limits[id]=25);
    const first=skeetNext(r);
    r.activeShooter=first?first.sh:r.shooterIds[0];
    r.activeStand=first?first.standIndex:0;
  }else if(isMenuFormat(r)){
    /* A layout is one target per stand per element - 5 targets a stand. Every
       shooter shoots every stand exactly once per layout, so the limit is fixed
       by the layout and is not a per-shooter choice. Sportrap is always 5
       stands; Compak is shot on either a 5-stand (6 traps) or the older 4-stand
       (5 traps) layout, so the cage count travels on the round. */
    r.layouts=Math.max(1,draft.layouts||1);
    r.cages=r.discipline==='compak'?(draft.cages||SR_STANDS):SR_STANDS;
    r.trapCount=r.cages===4?5:6;
    for(let i=0;i<r.cages*r.layouts;i++)r.stands.push(makeMenuStand(i));
    r.limits={}; r.shooterIds.forEach(id=>r.limits[id]=r.cages*SR_PER_STAND*r.layouts);
    const first=sportrapNext(r);
    r.activeShooter=first?first.sh:r.shooterIds[0];
    r.activeStand=first?first.standIndex:0;
  }else{
    r.limits={}; draft.ids.forEach(id=>r.limits[id]=draft.counts[id]||draft.stands*draft.per);
    db.lastThrow=draft.throwType||null;
    for(let i=0;i<draft.stands;i++){
      const ns=makeStand(draft.per);
      ns.throwType=draft.throwType||null;
      r.stands.push(ns);
    }
    r.activeShooter=r.shooterIds[0];
  }
  db.live=r;db.view='capture';draft=null;save();render();
  // fire and forget - the round is already fully usable without it
  fetchConditions(r,'Start of round').then(res=>{if(res&&res.reading&&db.live===r)render();});
}

/* =============================================================================
   CAPTURE - one target at a time, two enormous buttons, auto-advance.

   This is the single biggest change from v1. v1 showed a whole stand as a wide
   scrolling grid, which is why taps kept resetting the horizontal scroll. Here
   there is nothing to scroll: the app always knows exactly which target is next,
   and moves on by itself. Minimum taps to log a 100-bird round is 100.
============================================================================= */
function shotCount(r,sh){let n=0;r.stands.forEach(st=>st.slots.forEach(sl=>{const c=r.scores[sh]?.[sl.id];if(c&&c.r)n++;}));return n;}
function done(r,sh){
  if(isSuperSporting(r)){
    /* A stand with no menu yet is undefined, not finished - so the round cannot
       be complete while any stand is still waiting for its board to be copied.
       Finishing early is still available from the Finish button. */
    if(r.stands.some(s=>!s.slots.length))return false;
    const total=r.stands.reduce((a,s)=>a+s.slots.length,0);
    return total>0&&shotCount(r,sh)>=total;
  }
  return shotCount(r,sh)>=(r.limits?.[sh]??Infinity);
}
// next unscored slot for this shooter within the active stand, else null
function nextSlot(r,sh){
  if(isABT(r)){
    const e=abtNext(r);
    if(!e||e.sh!==sh)return null;
    const st=r.stands[e.standIndex];
    return st?st.slots.find(x=>x.id===e.slot)||null:null;
  }
  if(isSkeet(r)){
    // the referee's order decides who shoots and where; there is no cursor
    const e=skeetNext(r);
    if(!e||e.sh!==sh)return null;
    const st=r.stands[e.standIndex];
    return st?st.slots.find(x=>x.id===e.slot)||null:null;
  }
  if(isMenuFormat(r)){
    // the shooter's stand is fixed by the rotation, not by a cursor
    const e=sportrapNext(r);
    if(!e||e.sh!==sh)return null;
    const st=r.stands[e.standIndex];
    return st?st.slots.find(x=>x.id===e.slot)||null:null;
  }
  const st=r.stands[r.activeStand]; if(!st)return null;
  for(const sl of st.slots){const c=r.scores[sh]?.[sl.id];if(!c||!c.r)return sl;}
  return null;
}
function advance(r){
  if(isABT(r)){
    const e=abtNext(r);
    if(e){r.activeShooter=e.sh;r.activeStand=e.standIndex;}
    return;
  }
  if(isSkeet(r)){
    const e=skeetNext(r);
    if(e){r.activeShooter=e.sh;r.activeStand=e.standIndex;}
    return;
  }
  if(isMenuFormat(r)){
    // the queue decides who is next and where they are standing - there is no
    // cursor to move, only a position to read off
    const e=sportrapNext(r);
    if(e){r.activeShooter=e.sh;r.activeStand=e.standIndex;}
    return;
  }
  return advanceSporting(r);
}
/* Shooting order for the stand currently in front of us.

   As in v1: the squad is drawn once at the start, and THE LEAD ROTATES ON EACH
   STAND, so the same person is not always first up. Stand 1 leads with shooter
   1, stand 2 with shooter 2, and so on round the squad. */
function sportingOrder(r,standIdx){
  const n=r.shooterIds.length;
  if(!n)return [];
  const lead=((standIdx==null?r.activeStand:standIdx)%n+n)%n;
  const out=[];
  for(let i=0;i<n;i++)out.push(r.shooterIds[(i+lead)%n]);
  return out;
}
// this shooter's next unscored target on a given stand, ignoring the cursor
function nextSlotOnStand(r,sh,st){
  if(!st)return null;
  for(const sl of st.slots){const c=r.scores[sh]&&r.scores[sh][sl.id];if(!c||!c.r)return sl;}
  return null;
}
function standPosition(r,sh){
  const o=sportingOrder(r);
  const i=o.indexOf(sh);
  return i<0?null:{pos:i+1,of:o.length};
}
function advanceSporting(r){
  /* Super Sporting stands start empty until their menu is copied off the board,
     so an empty stand is 'not yet defined' rather than 'finished'. Stop on it
     so the builder is what the shooter sees, instead of skipping past it. */
  if(isSuperSporting(r)){
    const cur=r.stands[r.activeStand];
    if(cur&&!cur.slots.length)return;
  }
  const st=r.stands[r.activeStand];
  const order=sportingOrder(r);
  if(!order.length)return;

  /* A SHOOTER COMPLETES THE WHOLE STAND BEFORE THE NEXT ONE STEPS IN.

     v2 originally rotated after every single target, which meant a simultaneous
     pair was scored as "everyone shoots the first bird, then everyone shoots the
     second" - not how anyone shoots. You take your pair, then your next pair,
     until your card for that stand is done, then the next gun goes. */
  if(st){
    if(!done(r,r.activeShooter)&&nextSlotOnStand(r,r.activeShooter,st))return;   // still your turn
    const ci=order.indexOf(r.activeShooter);
    for(let k=1;k<=order.length;k++){
      const id=order[(Math.max(ci,0)+k)%order.length];
      if(!done(r,id)&&nextSlotOnStand(r,id,st)){r.activeShooter=id;return;}
    }
  }
  // stand finished by everyone - move on, and the lead rotates with the stand
  if(r.activeStand<r.stands.length-1){
    r.activeStand++;
    const next=sportingOrder(r);
    r.activeShooter=next.find(id=>!done(r,id))||next[0];
  }
}
function vCapture(){
  const r=db.live; if(!r){db.view='home';return vHome();}
  const sh=r.activeShooter; const st=r.stands[r.activeStand];
  const remaining=r.shooterIds.filter(id=>!done(r,id));
  const slot=nextSlot(r,sh);
  const total=roundStats(r,sh);
  const limit=r.limits?.[sh]??0;

  if(!remaining.length||(!slot&&r.activeStand>=r.stands.length-1&&r.shooterIds.every(id=>!nextSlot(r,id)))){
    return vRoundDone();
  }
  /* A Super Sporting stand has no targets until its menu is copied off the
     board, so there is nothing to score and nothing to advance to. Show the
     builder rather than recursing - an earlier version stack-overflowed here. */
  if(isSuperSporting(r)&&st&&!st.slots.length){
    return `<div class="card ruled">
      <div class="tgt-head">
        <div>
          <div class="tiny">${esc(r.ground||'Round')} · Stand ${r.activeStand+1} of ${r.stands.length}</div>
          <div class="tgt-num">Menu board</div>
        </div>
      </div>
      <p class="muted" style="margin-top:6px">Copy this stand's board before you shoot it. Nothing can be scored until the menu says what the targets are.</p>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" style="flex:1;padding:16px 8px" onclick="standSheet()">Stand</button>
        <button class="btn" style="flex:1;padding:16px 8px" onclick="finishSheet()">Finish</button>
      </div>
    </div>
    ${ssPanel(r,st)}`;
  }
  if(!slot){advance(r);save();return vCapture();}

  const slotIndex=st.slots.indexOf(slot);
  const idx=slotIndex+1;
  // In Pro mode the pips show which bird each target is, so the repeat is visible.
  const pips=st.slots.map((sl,i)=>{
    const c=r.scores[sh]?.[sl.id];
    const cls=c&&c.r==='h'?'h':c&&c.r==='m'?'m':'';
    const pp=(r.discipline||'sporting')==='sporting'?pairPos(st,i):null;
    const pairEdge=pp===1?'margin-right:9px':'';
    const lab=isSuperSporting(r)?(sl.trap||'·')
      :isABT(r)?(i+1)
      :isSkeet(r)?((skeetHouse(r,st,sl,sh)||'?')==='high'?'H':(skeetHouse(r,st,sl,sh)==='low'?'L':'?'))
      :isMenuFormat(r)?(sl.trap||'·'):(db.mode==='pro'?LETTER[birdIdx(st,i)]:(i+1));
    const cur=sl.id===slot.id?'cur':'';
    // a recorded miss stays tappable, so an earlier one can be diagnosed later
    if(c&&c.r==='m')
      return `<button class="pip m ${cur}" style="${pairEdge};${c.whyAuto?'box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)':''}"
        title="${attrStrSafe(c.why)}" onclick="openMissReason('${sh}','${sl.id}')">${lab}</button>`;
    return `<div class="pip ${cls} ${cur}" style="${pairEdge}">${lab}</div>`;
  }).join('');
  const curPres=db.mode==='pro'?presFor(st,slotIndex):null;
  const thLab=throwLabel(st,slotIndex);
  let tgtLabel=db.mode==='pro'
    ? `Target ${idx} · ${LETTER[birdIdx(st,slotIndex)]}${curPres?' '+curPres:''}${thLab?' · '+thLab:''}`
    : `Target ${idx}${thLab&&standThrow(st)&&standThrow(st).targets===2?' · '+thLab:''}`;
  if(isMenuFormat(r))tgtLabel=elementShort(st,slot)+(slot.trap?' · trap '+slot.trap:'');
  if(isSkeet(r))tgtLabel=slot.element==='option'?'Option — 25th':skeetLabel(r,st,slot,sh);
  if(isABT(r))tgtLabel='Station '+st.station;
  if(isSuperSporting(r))tgtLabel=ssElementLabel(st,slot);


  return `<div class="card ruled capture">
    <div class="tgt-head">
      <div>
        <div class="tiny">${esc(r.ground||'Round')} · ${isSuperSporting(r)
          ? 'Stand '+(r.activeStand+1)+' of '+r.stands.length+' · '+st.slots.length+' targets'
          : isABT(r)
          ? 'Station '+st.station+' · target '+(roundStats(r,sh).shot+1)+' of 25'
          : isSkeet(r)
          ? (slot.element==='option'?'Option target — the 25th':'Station '+st.station+' of 7')
          : isMenuFormat(r)
          ? 'Stand '+((r.activeStand%cageCount(r))+1)+(r.layouts>1?' · layout '+(Math.floor(r.activeStand/cageCount(r))+1)+' of '+r.layouts:'')+' · '+esc(elementLabel(st,slot))
          : 'Stand '+(r.activeStand+1)+' of '+r.stands.length+' · '+esc(standSize(st))}</div>
        <div class="tgt-num">${esc(shooter(sh).name)}</div>
        ${(()=>{const sp=(r.discipline||'sporting')==='sporting'||isSuperSporting(r)?standPosition(r,sh):null;
          return sp&&sp.of>1?`<div class="tiny">${sp.pos===1?'First':sp.pos===2?'Second':sp.pos===3?'Third':sp.pos+'th'} up on this stand · shoots the whole stand before the next gun</div>`:''})()}
      </div>
      <div style="text-align:right">
        <div class="mono" style="font-size:22px;font-weight:900">${total.hit}/${total.shot}</div>
        <div class="tgt-of">of ${limit}</div>
      </div>
    </div>

    ${r.shooterIds.length>1?`<div class="who" style="margin:10px 0">
      ${(((r.discipline||'sporting')==='sporting'||isSuperSporting(r))?sportingOrder(r):r.shooterIds).map(id=>{const s2=roundStats(r,id);
        return `<button class="chip ${id===sh?'clay':''}" onclick="pickShooter('${id}')">${esc(shooter(id).name)} ${s2.hit}/${s2.shot}</button>`}).join('')}
    </div>`:'<div style="height:6px"></div>'}

    <div class="pips" style="margin-bottom:12px">${pips}</div>

    <div class="hitmiss">
      <button class="hm hit" onclick="mark('h')">Hit<small>${esc(tgtLabel)}</small></button>
      <button class="hm miss" onclick="mark('m')">Miss<small>${esc(tgtLabel)}</small></button>
    </div>
    ${missReasonRow(r)}

    <div class="row" style="margin-top:12px">
      <button class="btn ghost" style="flex:1;padding:16px 8px" onclick="undo()">Undo</button>
      <button class="btn ghost" style="flex:1;padding:16px 8px" onclick="standSheet()">Stand</button>
      <button class="btn" style="flex:1;padding:16px 8px" onclick="finishSheet()">Finish</button>
    </div>
    ${(()=>{const c=conditionsText(r);return `<button class="tiny" style="width:100%;text-align:center;margin-top:10px;color:var(--muted)" onclick="conditionsSheet()">
      ${c?esc(c)+' · re-check':'Conditions not recorded · tap to fetch'}</button>`})()}
  </div>

  ${renderScoreboard(r)}
  ${isSuperSporting(r)?ssPanel(r,st)
    :isABT(r)?abtPanel(r,st,slot,sh)
    :isSkeet(r)?skeetPanel(r,st,slot,sh)
    :isMenuFormat(r)?menuPanel(st)
    :db.mode==='pro'?birdPanel(st,st.slots.indexOf(slot)):`<div class="tiny" style="text-align:center">Simple mode · tag misses after the round · <button style="color:var(--clay);font-weight:800" onclick="db.mode='pro';save();render()">switch to Pro</button></div>`}`;
}

/* The stand's menu board, copied off the board itself. Letters only - which trap
   throws each target, and whether each pair is on report or simultaneous. It
   never blocks: score first and fill the menu in later if the squad is moving. */
function menuPanel(st){
  const s=st.slots;
  const trapRow=(i,label)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
    <div style="flex:0 0 70px;font-size:11px;font-weight:800">${esc(label)}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;flex:1">
      ${trapsFor(db.live).map(t=>`<button class="chip ${s[i].trap===t?'clay':''}"
        style="padding:11px 0;min-width:36px;text-align:center;font-size:14px;font-weight:900"
        onclick="setTrap('${st.id}','${s[i].id}','${t}')">${t}</button>`).join('')}
      <button class="chip ${s[i].trap?'':'on'}" style="padding:11px 10px" onclick="setTrap('${st.id}','${s[i].id}',null)">—</button>
    </div></div>`;
  const typeRow=(which,cur)=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
    <div style="flex:0 0 70px;font-size:11px;font-weight:800">${which==='d1'?'1st pair':'2nd pair'}</div>
    <div style="display:flex;gap:5px;flex:1">
      ${pairTypesFor(db.live).map(p=>`<button class="chip ${cur===p.k?'clay':''}" style="padding:11px 12px"
        onclick="setPairType('${st.id}','${which}','${p.k}')">${esc(p.label)}</button>`).join('')}
    </div></div>`;
  return `<div class="card" style="margin-top:12px;padding:12px">
    <h2 class="stencil">Menu board · stand ${(st.index%cageCount(db.live))+1}</h2>
    ${menuComplete(st)?`<div class="tiny" style="margin-bottom:8px">${esc(menuSummary(st))} — copied. Nothing more to enter until the next stand.</div>`
      :`<div class="tiny" style="margin-bottom:8px">Copy the board in front of you: which trap throws each target. Letters only.</div>`}
    ${trapRow(0,'Single')}
    ${typeRow('d1',st.d1Type)}
    ${trapRow(1,'1st pair a')}
    ${trapRow(2,'1st pair b')}
    ${typeRow('d2',st.d2Type)}
    ${trapRow(3,'2nd pair a')}
    ${trapRow(4,'2nd pair b')}
  </div>`;
}
/* The whole point of Skeet in this app: never make the shooter remember which
   house is next. The panel states it plainly and shows the station's full
   sequence, with the rule it comes from. */
function skeetPanel(r,st,slot,sh){
  if(slot.element==='option'){
    const fm=firstMiss(r,sh);
    if(fm===null||fm===undefined){
      // clean so far, or not yet resolved - offer the choice from station 7
      return `<div class="card" style="margin-top:12px">
        <h2 class="stencil">Option — the 25th</h2>
        <p class="muted" style="margin-bottom:10px">Twenty-four struck. Rule 22.7 lets you take the twenty-fifth from station 7 as either house. Which do you want?</p>
        <div class="row">
          <button class="btn ${slot.house==='high'?'clay':'ghost'}" onclick="setOptionHouse('high')">High house</button>
          <button class="btn ${slot.house==='low'?'clay':'ghost'}" onclick="setOptionHouse('low')">Low house</button>
        </div>
      </div>`;
    }
    return `<div class="card" style="margin-top:12px">
      <h2 class="stencil">Option — the 25th</h2>
      <p class="muted">Rule 22.7: your first lost target is repeated and recorded as the twenty-fifth. That was <b>${esc(skeetLabel(r,fm.st,fm.sl,sh))}</b> on station ${fm.st.station}. Take it again.</p>
    </div>`;
  }
  const needsNomination=st.station===4&&slot.element==='double'&&!skeetHouse(r,st,slot,sh);
  const seq=st.slots.map((sl,i)=>{
    const h=skeetHouse(r,st,sl,sh);
    const c=r.scores[sh]&&r.scores[sh][sl.id];
    const mark=c&&c.r==='h'?'✓':c&&c.r==='m'?'✗':'';
    const cur=sl.id===slot.id;
    return `<div style="display:flex;gap:8px;align-items:center;padding:5px 0;${cur?'font-weight:900':''}">
      <div style="width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;
        font-size:10px;font-weight:900;background:${h==='high'?'var(--ink)':h==='low'?'var(--clay)':'var(--paper-2)'};
        color:${h?'#fff':'var(--faint)'}">${h==='high'?'H':h==='low'?'L':'?'}</div>
      <div style="flex:1;font-size:11px;font-weight:${cur?'900':'700'}">${esc(sl.element==='single'?(h?HOUSE[h]:'—')+' single':(h?HOUSE[h]:'nominate')+' · double '+(sl.pos===0?'first':'second'))}</div>
      <div style="font-weight:900;color:${mark==='✓'?'var(--hit)':'var(--miss)'}">${mark}</div>
    </div>`;
  }).join('');
  return `<div class="card" style="margin-top:12px">
    <h2 class="stencil">Station ${st.station} sequence</h2>
    ${needsNomination?`<p class="muted" style="margin-bottom:10px">Station 4 is the one you choose. Rule 22.3d — nominate which house you take first, and any repeat must follow the same order.</p>
      <div class="row" style="margin-bottom:12px">
        <button class="btn clay" onclick="nominate('high')">High first</button>
        <button class="btn clay" onclick="nominate('low')">Low first</button>
      </div>`:''}
    ${seq}
    <div class="tiny" style="margin-top:8px">${esc(skeetRuleNote(st))}</div>
  </div>`;
}
/* The Super Sporting menu board, built the way the board reads: a sequence of
   elements in release order, each with its trap letter. Nothing here blocks
   scoring - a stand with no menu yet simply has no targets to score, and the
   builder is the first thing on screen when you arrive. */
function ssPanel(r,st){
  const traps=ssTraps(st);
  const n=ssTargetCount(st);
  const pick=db.ssPick||{};
  const chosen=pick.standId===st.id?pick:{type:null,traps:[]};
  const def=chosen.type?ssElement(chosen.type):null;
  const needed=def?def.traps:0;
  const ready=def&&chosen.traps.length===needed;
  return `<div class="card" style="margin-top:12px">
    <h2 class="stencil">Menu board · stand ${st.index+1}</h2>

    ${st.menu.length?`<div style="margin-bottom:10px">
      ${st.menu.map((el,i)=>{const d=ssElement(el.type);
        return `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule)">
          <div style="width:20px;font-weight:900;font-size:11px;color:var(--muted)">${i+1}</div>
          <div style="flex:1;font-size:12px;font-weight:800">${esc(d.label)} <span style="color:var(--clay)">${esc((el.traps||[]).filter(Boolean).join(' + ')||'no letter')}</span></div>
          <div class="tiny">${d.targets}</div>
          <button class="btn ghost sm" style="color:var(--miss);padding:6px 9px" onclick="ssRemoveElement('${st.id}',${i})">✕</button>
        </div>`}).join('')}
      <div class="tiny" style="margin-top:6px">${n} target${n===1?'':'s'} on this stand${n<SS_STAND_MIN?` — the rules ask for at least ${SS_STAND_MIN}`:n>SS_STAND_MAX?` — over the ${SS_STAND_MAX} maximum`:''}.</div>
    </div>`:`<p class="muted" style="margin-bottom:10px">Copy the board in front of you. Add each element in the order it will be released, with the trap letter beside it.</p>`}

    <label class="lbl">Add</label>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
      ${SS_ELEMENTS.map(e=>`<button class="chip ${chosen.type===e.k?'clay':''}" style="padding:11px 12px"
        onclick="ssPick('${st.id}','${e.k}')">${esc(e.label)}</button>`).join('')}
    </div>
    ${def?`<label class="lbl">${needed===1?'Trap':'Traps — first, then second'}</label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
        ${traps.map(t=>`<button class="chip ${chosen.traps.includes(t)?'clay':''}"
          style="padding:13px 0;min-width:42px;text-align:center;font-size:15px;font-weight:900"
          onclick="ssPickTrap('${st.id}','${t}')">${t}</button>`).join('')}
      </div>
      <div class="tiny" style="margin-bottom:8px">${esc(def.label)}${def.k==='following'?' — both targets come from the same trap.':''} ${chosen.traps.length}/${needed} chosen.</div>
      <button class="btn ${ready?'clay':'ghost'}" ${ready?'':'disabled'} onclick="ssCommit('${st.id}')">Add to menu</button>`:''}

    <div class="tiny" style="margin-top:10px">Trap letters are per stand in Super Sporting — stand 1's A and stand 4's A are different machines — so results are never pooled by letter.</div>
  </div>`;
}
function ssPick(standId,type){
  const def=ssElement(type);
  const cur=db.ssPick&&db.ssPick.standId===standId&&db.ssPick.type===type;
  db.ssPick=cur?null:{standId:standId,type:type,traps:[]};
  save();render();
}
function ssPickTrap(standId,t){
  const p=db.ssPick; if(!p||p.standId!==standId||!p.type)return;
  const def=ssElement(p.type);
  const i=p.traps.indexOf(t);
  if(i>=0)p.traps.splice(i,1);
  else if(p.traps.length<def.traps)p.traps.push(t);
  else{p.traps=[t];}                    // starting again
  save();render();
}
function ssCommit(standId){
  const p=db.ssPick; if(!p||p.standId!==standId)return;
  const def=ssElement(p.type);
  if(p.traps.length!==def.traps)return;
  ssAddElement(standId,p.type,p.traps.slice());
  db.ssPick=null; save(); render();
}

/* ABT needs no tagging at all - one trap, no houses, no menu. The panel exists
   only to show where the shooter is in the rotation, which is the one thing that
   is genuinely hard to keep track of. */
function abtPanel(r,st,slot,sh){
  const ring=abtRing(r),R=ring.length;
  const q=abtQueue(r);
  const idx=q.findIndex(e=>e.sh===sh&&e.slot===slot.id);
  const lap=idx>=0?q[idx].lap:0;
  const line=Array.from({length:ABT_STATIONS},(_,i)=>{
    const who=ring[((i-lap)%R+R)%R];
    return{station:i+1,who:who};
  });
  const waiting=[];
  for(let k=ABT_STATIONS;k<R;k++){
    const who=ring[((k-lap)%R+R)%R];
    if(who)waiting.push(who);
  }
  return `<div class="card" style="margin-top:12px">
    <h2 class="stencil">On the line</h2>
    <div style="display:flex;gap:5px;margin-bottom:8px">
      ${line.map(p=>`<div style="flex:1;text-align:center;padding:8px 2px;border-radius:8px;
        background:${p.who===sh?'var(--clay)':'var(--paper-2)'};color:${p.who===sh?'#fff':'var(--muted)'}">
        <div style="font-size:9px;font-weight:800;letter-spacing:.08em">ST ${p.station}</div>
        <div style="font-size:11px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.who?shooter(p.who).name:'—')}</div>
      </div>`).join('')}
    </div>
    ${waiting.length?`<div class="tiny">Waiting behind station 1: ${esc(waiting.map(x=>shooter(x).name).join(', '))}</div>`:
      `<div class="tiny">No spare gun — whoever comes off station 5 walks straight round to station 1 and shoots again. Squads are normally six to avoid exactly that.</div>`}
    <div class="tiny" style="margin-top:6px">One trap, oscillating both ways, so there is nothing to record but the result. Two cartridges allowed; a kill counts one either way.</div>
  </div>`;
}
function skeetRuleNote(st){
  const n=st.station;
  if(n===7)return 'Station 7 is the exception: the LOW house is taken first in the singles (22.4), and low first in the double too (22.5).';
  if(n===4)return 'Station 4 has no fixed order — you nominate (22.3d).';
  if(n===6)return 'Singles start with the high house (22.4), but the double is low first (22.5).';
  if(n===3||n===5)return 'Singles only on stations 3 and 5 — no double (22.3).';
  return 'High house first in both the singles and the double on stations 1 and 2 (22.4, 22.5).';
}
function setOptionHouse(h){
  const r=db.live,sh=r.activeShooter;
  const os=optionSlot(r,sh); if(!os)return;
  os.house=h; saveRound(r); render();
}
function setTrap(standId,slotId,t){
  const r=db.live,st=r.stands.find(x=>x.id===standId); if(!st)return;
  const sl=st.slots.find(x=>x.id===slotId); if(!sl)return;
  sl.trap=t||null; saveRound(r); render();
}
function setPairType(standId,which,k){
  const r=db.live,st=r.stands.find(x=>x.id===standId); if(!st)return;
  if(which==='d1')st.d1Type=k; else st.d2Type=k;
  saveRound(r); render();
}

/* The stand's birds, defined once. Only prompts for a presentation that is
   genuinely still unknown; everything already tagged collapses to a one-line
   summary so it stays out of the way for the rest of the stand. */
function birdPanel(st,slotIndex){
  const cyc=standCycle(st);
  const cur=birdIdx(st,slotIndex);
  const birds=Array.from({length:cyc},(_,i)=>({i,
    pres:((st.birds||[])[i]||{}).pres||null,dist:((st.birds||[])[i]||{}).dist||null}));
  const missing=birds.filter(b=>!b.pres);
  const editing=st.editBird!=null?st.editBird:(missing.length?cur:null);

  const th=standThrow(st);
  return `<div class="card">
    <h2 class="stencil">This stand</h2>

    <label class="lbl">How are they thrown?</label>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:${th?'10px':'6px'}">
      ${THROWS.map(t=>`<button class="chip ${st.throwType===t.k?'clay':''}" style="padding:11px 12px"
        onclick="setThrow('${t.k}')">${esc(t.label)}</button>`).join('')}
    </div>
    ${th?`<div class="tiny" style="margin-bottom:10px">${st.slots.length} target${st.slots.length===1?'':'s'}${
      th.targets===2?' — '+Math.floor(st.slots.length/2)+' '+esc(th.label.toLowerCase())+(st.slots.length%2?' plus an odd single':''):''}.</div>`
      :`<div class="tiny" style="margin-bottom:10px;color:var(--clay)">Not set. Scoring works either way, but without this the app cannot tell a missed second barrel of a pair from a missed single — and those are different faults.</div>`}

    <label class="lbl">Birds</label>
    <div class="who" style="margin-bottom:10px">
      ${birds.map(b=>`<button class="chip ${b.i===cur?'clay':b.pres?'on':''}" onclick="editBird(${b.i})">
        ${LETTER[b.i]} · ${b.pres?esc(b.pres):'set'}${b.dist?' · '+esc(b.dist):''}</button>`).join('')}
      <button class="chip" onclick="cycleSheet()">${cyc} bird${cyc>1?'s':''}</button>
    </div>

    ${editing!=null?`
      <label class="lbl">Bird ${LETTER[editing]} — targets ${targetsForBird(st,editing).join(', ')}</label>
      <select class="field" onchange="chooseBird(${editing},this.value)">
        <option value="">Not recorded</option>
        ${PRESENTATIONS.map(p=>`<option ${birds[editing]&&birds[editing].pres===p?'selected':''}>${esc(p)}</option>`).join('')}
      </select>
      <label class="lbl" style="margin-top:12px">Clay</label>
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px">
        ${CLAY_TYPES.map(c=>`<button class="chip ${((st.birds||[])[editing]||{}).clay===c?'clay':''}" style="padding:10px 11px"
          onclick="chooseClay(${editing},'${c}')">${c}</button>`).join('')}
      </div>
      <label class="lbl" style="margin-top:12px">Distance</label>
      <div class="row">
        ${BANDS.map(b=>`<button class="btn ${((st.birds||[])[editing]||{}).dist===b?'clay':'ghost'} sm" style="flex:1"
          onclick="chooseDist(${editing},'${b}')" title="${esc(BAND_HINT[b])}">${b}</button>`).join('')}
      </div>
      <div class="tiny" style="margin-top:8px">Set once and every target on this stand showing bird ${LETTER[editing]} inherits it. Skip it entirely and tag after the round if you'd rather keep shooting. Distance is banded on purpose — ${esc(BAND_HINT.Mid)} for Mid — because a guessed yardage would only make the analysis look precise, not make it right.</div>
      ${st.editBird!=null?`<button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="editBird(null)">Done</button>`:''}
    `:`<div class="tiny">All ${cyc} bird${cyc>1?'s':''} tagged — nothing more to enter until the next stand. Tap a letter above to change one.</div>`}
  </div>`;
}
function setThrow(k){
  const r=db.live,st=r.stands[r.activeStand]; if(!st)return;
  st.throwType=(st.throwType===k)?null:k;
  saveRound(r);render();
}
function editBird(i){const st=db.live.stands[db.live.activeStand];st.editBird=i;saveRound(db.live);render();}
function chooseBird(i,v){
  const r=db.live,st=r.stands[r.activeStand];
  const keepDist=((st.birds||[])[i]||{}).dist||null;
  const keepClay=((st.birds||[])[i]||{}).clay||null;
  setBird(st,i,v); setBirdDist(st,i,keepDist); setBirdClay(st,i,keepClay);
  if(st.editBird!=null)st.editBird=null;
  saveRound(r);render();
}
function chooseClay(i,c){
  const r=db.live,st=r.stands[r.activeStand];
  const cur=((st.birds||[])[i]||{}).clay||null;
  setBirdClay(st,i,cur===c?null:c);   // tapping the active one clears it
  saveRound(r);render();
}
function chooseDist(i,d){
  const r=db.live,st=r.stands[r.activeStand];
  const cur=((st.birds||[])[i]||{}).dist||null;
  const keepClay2=((st.birds||[])[i]||{}).clay||null;
  setBirdDist(st,i,cur===d?null:d);   // tapping the active band clears it
  setBirdClay(st,i,keepClay2);
  saveRound(r);render();
}
function cycleSheet(){
  const st=db.live.stands[db.live.activeStand];
  const n=st.slots.length;
  const cur=standCycle(st);
  // Every count from 1 up to one bird per target is offered - a stand of 5 pairs
  // might be the same two birds ten times, or ten genuinely different birds.
  const opts=[];for(let i=1;i<=Math.min(n,LETTER.length);i++)opts.push(i);
  const note=k=>{
    if(k===1)return'the same single, over and over';
    if(n%k===0)return n/k+' × '+(k===2?'a pair':'a set of '+k);
    return'repeats every '+k+', not evenly';
  };
  sheet(`<h3>Birds on this stand</h3>
    <p class="muted" style="margin:6px 0 12px">How many <b>different</b> targets does this stand show before it starts repeating? This stand has ${esc(standSize(st))} on it.</p>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      ${opts.map(k=>`<button class="chip ${cur===k?'clay':''}"
        style="padding:16px 0;min-width:46px;font-size:17px;font-weight:900;text-align:center"
        onclick="setCycle(${k})">${k}</button>`).join('')}
    </div>
    <div class="card" style="padding:10px;margin-bottom:12px">
      <div style="font-weight:800;font-size:13px">${cur} bird${cur>1?'s':''} — ${esc(note(cur))}</div>
      <div class="tiny" style="margin-top:4px">Targets run ${st.slots.map((_,i)=>LETTER[birdIdx(st,i)]).join(' ')}</div>
    </div>
    <p class="tiny" style="margin-bottom:12px">If the stand needs more targets than it has, add them from the Stand menu first.</p>
    <button class="btn ghost" onclick="closeSheet()">Close</button>`);
}
function setCycle(n){
  const r=db.live,st=r.stands[r.activeStand];
  st.cycle=n;
  if(Array.isArray(st.birds))st.birds=st.birds.slice(0,n);
  st.editBird=null;
  saveRound(r);cycleSheet();render();   // keep the sheet open so the pattern can be seen
}
/* Never blocks. Either an open reason picker for a miss you chose to revisit, or
   a single quiet line offering to put a reason on the one you just dropped. */
function missReasonRow(r){
  const em=r.editMiss;
  if(em){
    const c=(r.scores[em.sh]||{})[em.slot]||{};
    const loc=missLocation(r,em.slot);
    return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--rule)">
      <div class="lbl" style="margin-bottom:8px">${esc(shooter(em.sh).name)} · stand ${loc.stand+1}, target ${loc.idx+1} — why?</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${REASONS.map(x=>`<button class="chip ${c.why===x&&!c.whyAuto?'clay':''}" style="padding:11px 13px" onclick="setMissReason('${js(x)}')">${esc(x)}</button>`).join('')}
      </div>
      <button class="btn ghost sm" style="width:100%;margin-top:9px" onclick="openMissReason(null,null)">Leave it</button>
    </div>`;
  }
  if(!r.lastMiss)return '';
  const c=(r.scores[r.lastMiss.sh]||{})[r.lastMiss.slot];
  if(!c||c.r!=='m')return '';
  const loc=missLocation(r,r.lastMiss.slot);
  if(!loc)return '';
  return `<button style="width:100%;margin-top:11px;padding:11px;border-radius:10px;border:1px dashed var(--rule);
      font-size:11px;font-weight:700;color:${c.whyAuto?'var(--clay)':'var(--muted)'}"
      onclick="editLastMiss()">
      Last miss · stand ${loc.stand+1} target ${loc.idx+1} · <b>${esc(c.why||'no reason')}</b>${c.whyAuto?' — tap to say why':' — tap to change'}
    </button>`;
}
function attrStrSafe(v){return esc(v==null?'':String(v));}
/* "10 clays · 5 pairs" - the phrase used wherever a stand is identified, because
   a stand number alone tells you nothing when you look back at it weeks later. */
function standSize(st){
  const n=st.slots.length;
  return n+' clay'+(n===1?'':'s')+(n%2===0?' · '+(n/2)+' pair'+(n===2?'':'s'):'');
}
function missLocation(r,slotId){
  for(let s=0;s<r.stands.length;s++){
    const i=r.stands[s].slots.findIndex(x=>x.id===slotId);
    if(i>=0)return{stand:s,idx:i};
  }
  return null;
}
function mark(res){
  const r=db.live,sh=r.activeShooter,slot=nextSlot(r,sh); if(!slot)return;
  const c=cell(r,sh,slot.id,true); c.r=res;
  if(res==='m'){
    /* Every miss defaults to "Unsure" and the app moves straight on. Stopping to
       ask why breaks the rhythm of a round, and an answer given under that
       pressure is worth little anyway. "Unsure" is the honest placeholder: it is
       excluded from every pattern and every piece of advice. whyAuto marks it as
       never having been considered, so it still shows up for review afterwards
       and is never mistaken for a real diagnosis. */
    c.why='Unsure'; c.whyAuto=true;
    delete c.whySrc; delete c.whyAt;
    r.lastMiss={sh:sh,slot:slot.id,stand:r.activeStand};
    r.editMiss=null;
  }
  r.lastAction={sh,slot:slot.id};
  advance(r);saveRound(r);render();
}
/* Set or correct a miss reason without leaving the scoring screen. Anything
   chosen here is a considered answer, so whyAuto is cleared and provenance is
   recorded as 'live' - made on the stand, seconds after the shot. */
function setMissReason(w){
  const r=db.live,em=r.editMiss; if(!em)return;
  const c=cell(r,em.sh,em.slot,true);
  c.why=w; c.whyAuto=false;
  if(w){c.whySrc='live';c.whyAt=Date.now();}
  r.editMiss=null;saveRound(r);render();
}
function openMissReason(shId,slotId){
  const r=db.live;
  r.editMiss=(r.editMiss&&r.editMiss.slot===slotId)?null:{sh:shId,slot:slotId};
  saveRound(r);render();
}
function editLastMiss(){
  const r=db.live; if(!r.lastMiss)return;
  openMissReason(r.lastMiss.sh,r.lastMiss.slot);
}
function undo(){
  const r=db.live,la=r.lastAction;
  if(!la){notice('Nothing to undo','No target has been scored yet in this round.');return;}
  if(r.scores[la.sh]&&r.scores[la.sh][la.slot])delete r.scores[la.sh][la.slot];
  r.editMiss=null;r.activeShooter=la.sh;
  if(r.lastMiss&&r.lastMiss.slot===la.slot)r.lastMiss=null;
  // step back to the stand containing that slot
  r.stands.forEach((st,i)=>{if(st.slots.some(s=>s.id===la.slot))r.activeStand=i;});
  r.lastAction=null;saveRound(r);render();
}
function pickShooter(id){
  const r=db.live;
  if(done(r,id)){notice('Finished','That shooter has completed their targets.');return;}
  if(((r.discipline||'sporting')==='sporting'||isSuperSporting(r))&&!nextSlotOnStand(r,id,r.stands[r.activeStand])){
    notice('Stand complete',shooter(id).name+' has already shot this stand. Move to the next stand, or pick someone who still has targets here.');
    return;
  }
  r.editMiss=null;r.activeShooter=id;saveRound(r);render();
}

function setChoke(c){

function addStand(){const r=db.live;
  if(isSuperSporting(r)){
    r.stands.push(makeSSStand(r.stands.length,r.stands[0]?ssTraps(r.stands[0]).length:SS_MIN_TRAPS));
  }else{
    const ns=makeStand(r.stands[0]?.slots.length||4);
    // carry the previous stand's throw type forward - a ground that sets sim
    // pairs on one stand usually sets them on the next, and it is one less tap
    const prev=r.stands[r.stands.length-1];
    if(prev&&prev.throwType)ns.throwType=prev.throwType;
    r.stands.push(ns);
  }
  saveRound(r);closeSheet();render();}
function addTarget(){const r=db.live;r.stands[r.activeStand].slots.push({id:newId(),pres:null,dist:null});saveRound(r);standSheet();render();}
/* Set a stand's target count outright. Growing just appends; shrinking removes
   the surplus slots AND their scores, since a score against a target that no
   longer exists would sit in the data forever, counted but unreachable. */
function setStandTargets(n){
  const r=db.live,st=r.stands[r.activeStand];
  n=Math.max(1,Math.min(n,LETTER.length));
  while(st.slots.length<n)st.slots.push({id:newId(),pres:null,dist:null});
  if(st.slots.length>n){
    const gone=st.slots.splice(n);
    gone.forEach(sl=>r.shooterIds.forEach(id=>{if(r.scores[id])delete r.scores[id][sl.id];}));
  }
  if(standCycle(st)>st.slots.length)st.cycle=st.slots.length;
  st.editBird=null;
  saveRound(r);standSheet();render();
}
function dropStand(){
  const r=db.live;
  if(r.stands.length<2){closeSheet();notice('Cannot remove','A round needs at least one stand.');return;}
  const st=r.stands[r.activeStand];
  st.slots.forEach(sl=>r.shooterIds.forEach(id=>{if(r.scores[id])delete r.scores[id][sl.id];}));
  r.stands.splice(r.activeStand,1);
  r.activeStand=Math.min(r.activeStand,r.stands.length-1);
  saveRound(r);closeSheet();render();
}

/* =============================================================================
   DIAGNOSIS CHECK — a blinded second opinion

   The observer must not see your answers, or the agreement figure is worthless.
   So this hands the phone over showing only WHICH misses to judge (stand and
   target number), never what you said about them, and reveals the comparison
   only once every one is answered.
============================================================================= */
var chk=null;
function startCheck(roundId){
  const s=me(); if(!s)return;
  const r=db.rounds.find(x=>x.id===roundId); if(!r)return;
  // Only diagnoses YOU made. Checking a shared one would compare the observer
  // against the book-keeper and tell you nothing about your own judgement.
  const list=firsthandMisses(r,s.id);
  if(list.length<5){
    let all=0;
    r.stands.forEach(st=>st.slots.forEach(sl=>{const c=r.scores[s.id]&&r.scores[s.id][sl.id];if(c&&c.r==='m'&&c.why)all++;}));
    const secondHand=all-list.length;
    notice('Not enough to check','A check needs at least 5 misses you diagnosed yourself; this round has '+list.length+
      (secondHand?'. The other '+secondHand+' came from a squad code, so they are the book-keeper\'s read rather than yours and checking them would not test your judgement':'')+'.');
    return;
  }
  chk={roundId,list,i:0,tags:{},by:''};
  db.view='check';save();render();window.scrollTo(0,0);
}
function vCheck(){
  const r=db.rounds.find(x=>x.id===chk?.roundId);
  if(!r||!chk){db.view='home';return vHome();}
  if(chk.i>=chk.list.length)return vCheckResult(r);
  const m=chk.list[chk.i];
  return `<div class="card dark">
    <h2 class="stencil">Blind check · ${chk.i+1} of ${chk.list.length}</h2>
    <p class="muted" style="color:#c3ccd6">Hand the phone to whoever was watching. They should say what they saw, without being told what you put. Your own answers stay hidden until the end.</p>
  </div>
  <div class="card ruled">
    <div class="tgt-num" style="font-size:26px">Stand ${m.stand+1}, target ${m.idx+1}</div>
    <p class="muted" style="margin:4px 0 14px">${esc(r.ground||'')} · ${esc(r.date)} — what happened to this one?</p>
    <div style="display:flex;flex-direction:column;gap:7px">
      ${REASONS.map(x=>`<button class="btn ghost" style="justify-content:flex-start;padding:14px;font-size:12px" onclick="checkAnswer('${js(x)}')">${esc(x)}</button>`).join('')}
    </div>
    <button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="abandonCheck()">Stop the check</button>
  </div>`;
}
function checkAnswer(w){chk.tags[chk.list[chk.i].slot]=w;chk.i++;save();render();window.scrollTo(0,0);}
function abandonCheck(){chk=null;db.view='home';save();render();}
function vCheckResult(r){
  const s=me();
  const pairs=chk.list.map(m=>({a:(r.scores[s.id][m.slot]||{}).why,b:chk.tags[m.slot],m}))
    .filter(p=>p.a&&p.b);
  const k=kappa(pairs);
  return `<div class="card ruled">
    <h2 class="stencil">Check complete</h2>
    ${k.ok?`<div class="grid3" style="margin-bottom:12px">
      <div class="stat"><b class="mono">${k.agree}/${k.n}</b><span>Agreed</span></div>
      <div class="stat"><b class="mono" style="color:${k.k>=0.41?'var(--hit)':'var(--miss)'}">${k.k.toFixed(2)}</b><span>Kappa</span></div>
      <div class="stat"><b class="mono">${Math.round(k.pe*100)}%</b><span>By chance</span></div>
    </div>
    <p class="muted">Cohen's kappa of ${k.k.toFixed(2)} — <b>${kappaBand(k.k)}</b> agreement. You matched on ${k.agree} of ${k.n}, and two people guessing independently would have matched about ${Math.round(k.pe*k.n)} times by chance alone. Kappa discounts that luck, which is why it is lower than the raw agreement.</p>
    <p class="tiny" style="margin-top:8px">The wording (slight, fair, moderate, substantial) is a widely used convention rather than a hard rule, and one check on one round is a small sample. ${k.k<0.41?'On this evidence, treat the fault-based coaching in this app with caution — it is built on these diagnoses.':'This supports trusting your own diagnoses, and therefore the coaching built on them.'}</p>`
    :`<p class="muted">${esc(k.why)}</p>`}
    <div class="divider"></div>
    <h2 class="stencil">Where you differed</h2>
    ${pairs.map(p=>`<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)">
      <div style="flex:1"><div style="font-weight:800;font-size:12px">Stand ${p.m.stand+1}, target ${p.m.idx+1}</div>
      <div class="tiny">You: ${esc(p.a)} · Observer: ${esc(p.b)}</div></div>
      <div style="font-weight:900;color:${p.a===p.b?'var(--hit)':'var(--miss)'}">${p.a===p.b?'✓':'✗'}</div>
    </div>`).join('')}
    <input class="field" id="checkby" placeholder="Who did the checking? (optional)" style="margin-top:12px">
    <button class="btn clay" style="margin-top:10px" onclick="saveCheck()">Save this check</button>
    <button class="btn ghost sm" style="width:100%;margin-top:8px" onclick="abandonCheck()">Discard it</button>
  </div>`;
}
function saveCheck(){
  const r=db.rounds.find(x=>x.id===chk.roundId);const s=me();
  const by=document.getElementById('checkby');
  if(r)r.check={shooter:s.id,by:by&&by.value.trim()?by.value.trim():null,at:Date.now(),tags:chk.tags};
  chk=null;db.view='analysis';save();render();
}

/* =============================================================================
   ANALYSIS

   Honesty rules carried over from v1 and kept deliberately: a Wilson interval
   rather than a raw percentage, a minimum sample before anything is called a
   weakness, and a refusal to invent advice for "Unsure". A number that isn't
   trustworthy is worse than no number, because you'd go and practise the wrong
   thing on the back of it.
============================================================================= */
var MIN_N=6;   // var, not const, so tests can assert against the real threshold
function wilson(hit,n,z=1.96){
  if(!n)return{lo:0,hi:1,p:0};
  const p=hit/n,d=1+z*z/n,c=p+z*z/(2*n),m=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n));
  return{p,lo:Math.max(0,(c-m)/d),hi:Math.min(1,(c+m)/d)};
}
function breakdown(shots,keyFn){
  const g={};
  shots.forEach(s=>{const k=keyFn(s);if(!k)return;(g[k]=g[k]||{n:0,h:0}).n++;if(s.res==='h')g[k].h++;});
  return Object.entries(g).map(([k,v])=>({k,...v,...wilson(v.h,v.n)})).sort((a,b)=>a.p-b.p);
}
function pctCol(p){return p>=.75?'var(--hit)':p>=.55?'var(--clay)':'var(--miss)';}
function barRow(label,o,base){
  const solid=o.n>=MIN_N;
  return `<div style="margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <span style="font-size:12px;font-weight:800">${esc(label)}</span>
      <span class="mono tiny" style="font-weight:800;color:${solid?pctCol(o.p):'var(--faint)'}">${Math.round(o.p*100)}% <span style="font-weight:600">(${o.h}/${o.n})</span></span>
    </div>
    <div class="bar" style="position:relative">
      <i style="width:${Math.round(o.p*100)}%;background:${solid?pctCol(o.p):'var(--faint)'}"></i>
      ${solid?`<span style="position:absolute;top:-2px;bottom:-2px;left:${o.lo*100}%;width:${Math.max(1,(o.hi-o.lo)*100)}%;border-left:2px solid rgba(0,0,0,.35);border-right:2px solid rgba(0,0,0,.35)"></span>`:''}
      ${base!=null?`<span style="position:absolute;top:-3px;bottom:-3px;left:${base*100}%;width:2px;background:var(--ink)"></span>`:''}
    </div>
    ${solid?'':`<div class="tiny" style="margin-top:2px">Only ${o.n} shot${o.n>1?'s':''} — not enough to draw a conclusion yet.</div>`}
  </div>`;
}
/* =============================================================================
   RUNNING SCOREBOARD

   Restored from v1. The squad wants to see where everyone is without waiting for
   the end, and — because v2 randomises the draw — WHO SHOOTS WHEN. The order
   chips answer that; the grid answers the rest.

   It is the one place in v2 that scrolls sideways, so its scroll position is
   preserved across re-renders. v1 had exactly this bug: every tap reset the
   table to the left and you lost your place.
============================================================================= */
var _hscroll={};
function keepScrolls(){
  document.querySelectorAll('[data-hscroll]').forEach(el=>{
    _hscroll[el.getAttribute('data-hscroll')]=el.scrollLeft;
  });
}
function restoreScrolls(){
  document.querySelectorAll('[data-hscroll]').forEach(el=>{
    const v=_hscroll[el.getAttribute('data-hscroll')];
    if(v)el.scrollLeft=v;
  });
}
function standScore(r,sh,st){
  let hit=0,shot=0;
  st.slots.forEach(sl=>{
    const c=r.scores[sh]&&r.scores[sh][sl.id];
    if(c&&c.r){shot++;if(c.r==='h')hit++;}
  });
  return{hit,shot};
}
function renderScoreboard(r,opts){
  const o=opts||{};
  const ids=r.shooterIds;
  if(!ids.length)return '';
  const totals={};
  ids.forEach(id=>totals[id]=roundStats(r,id));
  const ranked=[...ids].sort((a,b)=>totals[b].hit-totals[a].hit);
  const rankOf={}; ranked.forEach((id,i)=>rankOf[id]=i+1);
  // stands worth showing: any with targets, or the one in progress
  const stands=r.stands.map((st,i)=>({st,i}))
    .filter(x=>x.st.slots.length&&(!isSkeet(r)||x.st.station!==null));
  return `<div class="card" style="margin-top:12px">
    <h2 class="stencil">${o.title||'Scoreboard'}</h2>

    ${ids.length>1?(()=>{
      const rot=((r.discipline||'sporting')==='sporting'||isSuperSporting(r))&&!o.final
        ? sportingOrder(r) : ids;
      return `<div class="lbl" style="margin-bottom:6px">Shooting order${
        (!o.final&&((r.discipline||'sporting')==='sporting'||isSuperSporting(r)))?' · stand '+(r.activeStand+1):''}</div>
      <div class="who" style="margin-bottom:6px">
        ${rot.map((id,i)=>`<button class="chip ${id===r.activeShooter&&!o.final?'clay':''}"
          onclick="pickShooter('${id}')">
          <span style="opacity:.6">${i+1}</span> ${esc(shooter(id).name)}</button>`).join('')}
      </div>
      ${!o.final&&((r.discipline||'sporting')==='sporting'||isSuperSporting(r))?`<div class="tiny" style="margin-bottom:10px">The lead rotates each stand, so nobody is always first up.</div>`:'<div style="height:4px"></div>'}`;
    })():''}

    <div data-hscroll="scoreboard" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
      <table style="border-collapse:collapse;font-size:11px;width:100%;min-width:${90+ids.length*54}px">
        <thead><tr>
          <th style="text-align:left;padding:5px 4px;font-size:9px;letter-spacing:.1em;color:var(--muted);position:sticky;left:0;background:var(--paper)">STAND</th>
          ${ids.map(id=>`<th style="padding:5px 2px;text-align:center;min-width:50px">
            <div style="font-size:10px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(shooter(id).name)}</div>
            <div class="tiny" style="font-weight:700">${rankOf[id]===1?'&#9733;':'#'+rankOf[id]}</div>
          </th>`).join('')}
        </tr></thead>
        <tbody>
          ${stands.map(({st,i})=>{
            const cur=!o.final&&i===r.activeStand;
            const label=isSkeet(r)?('ST '+st.station):isMenuFormat(r)?('ST '+((st.index%cageCount(r))+1)):('ST '+(i+1));
            const size=st.slots.length;
            return `<tr style="${cur?'background:rgba(232,98,29,.10)':''}">
              <td style="padding:5px 4px;border-bottom:1px solid var(--rule);position:sticky;left:0;background:${cur?'#fbeee6':'var(--paper)'}">
                <div style="font-weight:900;font-size:10px">${label}</div>
                <div class="tiny" style="white-space:nowrap">${size} clay${size===1?'':'s'}${size%2===0?' · '+(size/2)+'pr':''}</div>
              </td>
              ${ids.map(id=>{const c=standScore(r,id,st);
                return `<td style="padding:5px 2px;text-align:center;border-bottom:1px solid var(--rule);border-left:1px solid var(--rule);font-weight:900;
                  color:${!c.shot?'var(--faint)':c.hit===c.shot?'var(--hit)':c.hit===0?'var(--miss)':'var(--text)'}">
                  ${c.shot?c.hit+'<span style="font-weight:600;opacity:.5">/'+c.shot+'</span>':'·'}</td>`}).join('')}
            </tr>`}).join('')}
        </tbody>
        <tfoot><tr style="background:var(--ink);color:#fff">
          <td style="padding:7px 4px;font-size:9px;letter-spacing:.1em;font-weight:900;position:sticky;left:0;background:var(--ink)">TOTAL</td>
          ${ids.map(id=>`<td style="padding:7px 2px;text-align:center;font-weight:900;font-size:13px">
            ${totals[id].hit}<span style="font-weight:600;opacity:.55;font-size:10px">/${totals[id].shot}</span></td>`).join('')}
        </tr></tfoot>
      </table>
    </div>
    ${ids.length>1?`<div class="tiny" style="margin-top:6px">★ marks the leader. A dot means that stand has not been shot yet. Tap a name above to switch shooter.</div>`
      :`<div class="tiny" style="margin-top:6px">A dot means that stand has not been shot yet.</div>`}
  </div>`;
}

/* =============================================================================
   ANALYSIS VISUALS

   Hand-built SVG, no chart library. Three rules throughout:
   - never draw a cell or a point that has no data behind it; leave it blank and
     say so, rather than implying zero
   - colour carries meaning (against YOUR average, not an absolute scale)
   - every visual has a one-line reading of what it shows, because a picture
     nobody can interpret is decoration
============================================================================= */

/* =============================================================================
   GOALS — restored from v1

   A target you set yourself, measured against real shooting. Deliberately
   honest: progress is only reported once there are enough targets behind it to
   mean anything, and a goal that is met is said to be met rather than quietly
   left at 99%.
============================================================================= */
var GOAL_METRICS=[
  {k:'overall',label:'Overall average',pick:false},
  {k:'presentation',label:'A presentation',pick:'pres'},
  {k:'distance',label:'A distance band',pick:'dist'},
  {k:'clay',label:'A clay type',pick:'clay'},
  {k:'ground',label:'A ground',pick:'ground'}
];
function goalOptions(sh,kind){
  const shots=allShots(sh);
  if(kind==='pres')return [...new Set(shots.map(x=>x.pres).filter(Boolean))];
  if(kind==='dist')return BANDS;
  if(kind==='clay')return CLAY_TYPES;
  if(kind==='ground')return [...new Set(shots.map(x=>x.ground).filter(g=>g&&g!=='—'))];
  return [];
}
function goalProgress(sh,g){
  const shots=allShots(sh).filter(x=>{
    if(g.metric==='overall')return true;
    if(g.metric==='presentation')return x.pres===g.value;
    if(g.metric==='distance')return x.dist===g.value;
    if(g.metric==='clay')return x.clay===g.value;
    if(g.metric==='ground')return x.ground===g.value;
    return false;
  });
  const n=shots.length;
  const hit=shots.filter(x=>x.res==='h').length;
  const pct=n?hit/n:0;
  const ci=wilson(hit,n);
  return{n,hit,pct,ci,
    enough:n>=MIN_N*2,
    met:n>=MIN_N*2&&ci.lo>=g.target/100,      // met only when the interval clears it
    close:n>=MIN_N*2&&pct>=g.target/100};
}
function addGoal(){
  const s=me(); if(!s)return;
  if(!Array.isArray(db.goals))db.goals=[];
  db.goals.push({id:newId(),shooter:s.id,metric:'overall',value:null,target:75,createdAt:Date.now()});
  save();render();
}
function updateGoal(id,field,v){
  const g=(db.goals||[]).find(x=>x.id===id); if(!g)return;
  if(field==='target')v=Math.max(1,Math.min(100,parseInt(v,10)||0));
  if(field==='metric'){g.value=null;}
  g[field]=v; save();render();
}
function removeGoal(id){db.goals=(db.goals||[]).filter(x=>x.id!==id);save();render();}
function renderGoals(sh){
  const list=(db.goals||[]).filter(g=>g.shooter===sh);
  if(!list.length)return `<div class="muted">No goals set. A goal is a percentage you are aiming at on something specific — a presentation, a distance, a ground, or your overall average.</div>
    <button class="btn ghost" style="margin-top:10px" onclick="addGoal()">Set a goal</button>`;
  return list.map(g=>{
    const p=goalProgress(sh,g);
    const m=GOAL_METRICS.find(x=>x.k===g.metric)||GOAL_METRICS[0];
    const opts=m.pick?goalOptions(sh,m.pick):[];
    const label=g.metric==='overall'?'Overall average':(g.value||'— choose —');
    return `<div style="padding:10px 0;border-bottom:1px solid var(--rule)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
        <div style="font-weight:900;font-size:13px">${esc(label)}</div>
        <div class="mono" style="font-weight:900;color:${p.met?'var(--hit)':p.enough?'var(--clay)':'var(--faint)'}">
          ${p.enough?Math.round(p.pct*100)+'%':'—'} <span style="font-weight:600;color:var(--muted)">/ ${g.target}%</span></div>
      </div>
      <div class="bar" style="margin-bottom:4px;position:relative">
        <i style="width:${Math.round(Math.min(1,p.pct)*100)}%;background:${p.met?'var(--hit)':'var(--clay)'}"></i>
        <span style="position:absolute;top:-3px;bottom:-3px;left:${g.target}%;width:2px;background:var(--ink)"></span>
      </div>
      <div class="tiny" style="margin-bottom:6px">${
        !p.enough?'Only '+p.n+' target'+(p.n===1?'':'s')+' so far — needs '+(MIN_N*2)+' before this means anything.'
        :p.met?'<b style="color:var(--hit)">Met.</b> '+p.hit+'/'+p.n+', and the plausible range clears your target.'
        :p.close?'At '+Math.round(p.pct*100)+'% over '+p.n+' targets — above the line, but not yet beyond doubt ('+Math.round(p.ci.lo*100)+'–'+Math.round(p.ci.hi*100)+'%).'
        :Math.round((g.target/100-p.pct)*p.n*10)/10+' more targets needed at this volume to reach '+g.target+'%.'}</div>
      <div class="row">
        <select class="field" style="flex:1;font-size:11px" onchange="updateGoal('${g.id}','metric',this.value)">
          ${GOAL_METRICS.map(x=>`<option value="${x.k}" ${g.metric===x.k?'selected':''}>${esc(x.label)}</option>`).join('')}
        </select>
        ${m.pick?`<select class="field" style="flex:1;font-size:11px" onchange="updateGoal('${g.id}','value',this.value)">
          <option value="">— choose —</option>
          ${opts.map(o=>`<option ${g.value===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>`:''}
        <input class="field" style="width:64px;text-align:center" type="number" inputmode="numeric"
          value="${g.target}" onchange="updateGoal('${g.id}','target',this.value)">
        <button class="btn ghost sm" style="color:var(--miss)" onclick="removeGoal('${g.id}')">✕</button>
      </div>
    </div>`;
  }).join('')+`<button class="btn ghost" style="margin-top:10px" onclick="addGoal()">Add another goal</button>`;
}

/* ---------- miss map ----------
   Restored from v1. Where the shot went relative to the bird, as a picture. Four
   directions read instantly in a way four bars never will; the reasons that have
   no direction (mount, lost it, unsure) are listed beside rather than forced
   onto the diagram. */
function renderMissMap(shots){
  const tagged=shots.filter(x=>x.res==='m'&&x.why);
  if(tagged.length<6)return '';
  const n=w=>tagged.filter(x=>x.why===w).length;
  const dirs=[
    {k:'Above',   n:n('Above'),   cx:100,cy:26 },
    {k:'Below',   n:n('Below'),   cx:100,cy:134},
    {k:'Behind',  n:n('Behind'),  cx:30, cy:80 },
    {k:'In front',n:n('In front'),cx:170,cy:80 }
  ];
  const dirTotal=dirs.reduce((a,d)=>a+d.n,0);
  if(!dirTotal)return '';
  const max=Math.max(...dirs.map(d=>d.n));
  const other=['Didn\'t mount','Lost it','Unsure'].map(k=>({k,n:n(k)})).filter(x=>x.n);
  const top=dirs.slice().sort((a,b)=>b.n-a.n)[0];
  return `<svg viewBox="0 0 200 160" style="width:100%;max-width:280px;height:150px;display:block;margin:0 auto">
    <line x1="100" y1="44" x2="100" y2="116" stroke="var(--rule)" stroke-width="1.5"/>
    <line x1="48" y1="80" x2="152" y2="80" stroke="var(--rule)" stroke-width="1.5"/>
    <ellipse cx="100" cy="80" rx="17" ry="7" fill="var(--clay)" opacity=".85"/>
    <circle cx="100" cy="80" r="3" fill="var(--paper)"/>
    ${dirs.map(d=>{
      if(!d.n)return `<text x="${d.cx}" y="${d.cy+4}" text-anchor="middle" font-size="9" fill="var(--faint)" font-weight="700">${d.k} 0</text>`;
      const rr=9+ (d.n/max)*16;
      return `<circle cx="${d.cx}" cy="${d.cy}" r="${rr.toFixed(1)}" fill="var(--miss)" opacity="${(0.20+0.6*d.n/max).toFixed(2)}"/>
        <text x="${d.cx}" y="${d.cy+4}" text-anchor="middle" font-size="11" font-weight="900" fill="var(--miss)">${d.n}</text>
        <text x="${d.cx}" y="${d.cy+rr+11}" text-anchor="middle" font-size="8" font-weight="800" fill="var(--muted)">${d.k.toUpperCase()}</text>`;
    }).join('')}
  </svg>
  <div class="muted" style="margin-top:6px">Of ${dirTotal} misses you placed in a direction, most went <b>${esc(top.k.toLowerCase())}</b> (${top.n}). Circle size is how often.</div>
  ${other.length?`<div class="tiny" style="margin-top:4px">Not shown on the diagram, because they have no direction: ${esc(other.map(o=>o.k+' '+o.n).join(' · '))}.</div>`:''}`;
}

/* ---------- form over time ----------
   A line of round scores with a rolling average through it, so a run of good
   days is distinguishable from a genuine trend. */
function roundHistory(sh){
  return db.rounds.filter(r=>roundStats(r,sh).shot>0)
    .sort((a,b)=>a.createdAt-b.createdAt)
    .map(r=>({date:r.date,ground:r.ground||'—',...roundStats(r,sh),discipline:r.discipline||'sporting'}));
}
function renderForm(hist,career){
  if(hist.length<2)return '';
  const W=320,H=110,P=6;
  const n=hist.length;
  const lo=Math.max(0,Math.min(career,...hist.map(h=>h.pct))-8);
  const hi=Math.min(100,Math.max(career,...hist.map(h=>h.pct))+8);
  const x=i=>P+(n===1?W/2:i*(W-2*P)/(n-1));
  const y=v=>H-P-((v-lo)/Math.max(1,hi-lo))*(H-2*P);
  // rolling average of 3, so the eye follows the trend rather than the noise
  const roll=hist.map((_,i)=>{
    const from=Math.max(0,i-2), slice=hist.slice(from,i+1);
    return slice.reduce((a,b)=>a+b.pct,0)/slice.length;
  });
  const path=hist.map((h,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(h.pct).toFixed(1)).join(' ');
  const rollPath=roll.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const last=hist[n-1], prev=roll[n-1]-roll[Math.max(0,n-4)];
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <line x1="${P}" y1="${y(career)}" x2="${W-P}" y2="${y(career)}"
      stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="${rollPath}" fill="none" stroke="var(--clay)" stroke-width="6" stroke-opacity=".22"
      stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${hist.map((h,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(h.pct).toFixed(1)}" r="${i===n-1?4.5:2.5}"
      fill="${h.pct>=career?'var(--hit)':'var(--miss)'}"/>`).join('')}
  </svg>
  <div class="tiny" style="display:flex;justify-content:space-between;margin-top:2px">
    <span>${esc(hist[0].date)}</span>
    <span>Dashed line = career average · thick line = 3-round rolling</span>
    <span>${esc(last.date)}</span>
  </div>
  <div class="muted" style="margin-top:8px">Last round <b>${last.hit}/${last.shot} (${last.pct}%)</b> at ${esc(last.ground)}. ${
    n>=4? (Math.abs(prev)<2?'Your rolling average is flat over the last few rounds.'
      :prev>0?'Your rolling average is up '+Math.round(prev)+' points over the last few rounds.'
      :'Your rolling average is down '+Math.round(-prev)+' points over the last few rounds.')
    :'Too few rounds yet to call a trend.'}</div>`;
}

/* ---------- where the targets are going ----------
   Hit percentage tells you where you are weak. It does not tell you where the
   TARGETS are, because a 40% category you meet twice a round costs you less
   than a 65% one you meet twenty times. This ranks by targets on the table:
   how many more you would have hit if that category matched your own average.
   It is the honest answer to "what should I work on first". */
function lossLeaders(shots,career){
  const dims=[['Presentation',x=>x.pres],['Distance',x=>x.dist],
    ['Ground',x=>x.ground==='—'?null:x.ground],['Wind',x=>x.wind],['Light',x=>x.light],
    ['Trap',x=>x.standTrap||(x.trap?'Trap '+x.trap:null)],['Target type',x=>x.element]];
  const out=[];
  dims.forEach(([label,fn])=>{
    breakdown(shots,fn).forEach(g=>{
      if(g.n<MIN_N)return;
      const gap=career-g.p;
      if(gap<=0)return;
      out.push({label:label,key:g.k,n:g.n,pct:g.p,onTable:g.n*gap,lo:g.lo,hi:g.hi,
        firm:g.hi<career});
    });
  });
  return out.sort((a,b)=>b.onTable-a.onTable).slice(0,6);
}
function renderLossLeaders(list,career){
  if(!list.length)return '';
  const max=list[0].onTable;
  return list.map(l=>`<div style="margin-bottom:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px">
      <span style="font-size:12px;font-weight:800">${esc(l.key)}<span class="tiny" style="font-weight:600"> · ${esc(l.label.toLowerCase())}</span></span>
      <span class="mono" style="font-size:12px;font-weight:900;color:${l.firm?'var(--miss)':'var(--muted)'}">+${l.onTable.toFixed(1)}</span>
    </div>
    <div class="bar"><i style="width:${Math.round(l.onTable/max*100)}%;background:${l.firm?'var(--miss)':'var(--faint)'}"></i></div>
    <div class="tiny">${Math.round(l.pct*100)}% over ${l.n} targets${l.firm?'':' — not yet beyond doubt'}</div>
  </div>`).join('');
}

/* ---------- presentation x distance heatmap ----------
   Restored from v1. A cross-tab as a grid rather than a list: the eye finds the
   cold corner far faster than it reads twelve bars. Empty cells stay EMPTY -
   never zero - because "you have not shot that" and "you miss that" are
   completely different facts. */
function renderHeatmap(shots,career){
  const withBoth=shots.filter(x=>x.pres&&x.dist);
  if(withBoth.length<12)return '';
  const cols=BANDS.filter(b=>withBoth.some(x=>x.dist===b));
  const rows=[...new Set(withBoth.map(x=>x.pres))];
  if(!cols.length||rows.length<2)return '';
  const cellOf=(p,b)=>{
    const arr=withBoth.filter(x=>x.pres===p&&x.dist===b);
    if(!arr.length)return null;
    const h=arr.filter(x=>x.res==='h').length;
    return{pct:h/arr.length,n:arr.length};
  };
  const shade=c=>{
    if(!c)return 'background:repeating-linear-gradient(45deg,var(--paper-2) 0 4px,transparent 4px 8px)';
    const d=c.pct-career;                       // relative to YOUR average
    const t=Math.max(-1,Math.min(1,d/0.25));
    const col=t>=0?'31,138,76':'200,52,43';
    return 'background:rgba('+col+','+(0.10+Math.abs(t)*0.55).toFixed(2)+')';
  };
  const rowTotals=rows.map(p=>{
    const arr=withBoth.filter(x=>x.pres===p);
    return{p,n:arr.length,pct:arr.filter(x=>x.res==='h').length/arr.length};
  }).sort((a,b)=>a.pct-b.pct);
  return `<div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:10px;min-width:260px">
      <thead><tr>
        <th style="text-align:left;padding:4px;font-size:9px;letter-spacing:.1em;color:var(--muted)">TARGET</th>
        ${cols.map(c=>`<th style="padding:4px;font-size:9px;letter-spacing:.08em;color:var(--muted)">${esc(c.toUpperCase())}</th>`).join('')}
        <th style="padding:4px;font-size:9px;color:var(--muted)">ALL</th>
      </tr></thead>
      <tbody>
      ${rowTotals.map(rt=>`<tr>
        <td style="padding:4px;font-weight:800;font-size:11px;white-space:nowrap">${esc(rt.p)}</td>
        ${cols.map(c=>{const cl=cellOf(rt.p,c);
          return `<td style="padding:0 2px"><div style="${shade(cl)};border-radius:5px;padding:7px 2px;text-align:center;font-weight:900;font-size:11px">
            ${cl?Math.round(cl.pct*100)+'<span style="font-weight:600;opacity:.6;font-size:9px">/'+cl.n+'</span>':'<span style="opacity:.35">·</span>'}
          </div></td>`}).join('')}
        <td style="padding:4px;text-align:center;font-weight:900;font-size:11px;color:${pctCol(rt.pct)}">${Math.round(rt.pct*100)}</td>
      </tr>`).join('')}
      </tbody>
    </table>
  </div>
  <div class="tiny" style="margin-top:6px">Green is above your ${Math.round(career*100)}% average, red below; the number after the slash is how many targets sit behind it. Hatched cells are combinations you have not shot — not zeros. Rows are ordered worst first.</div>`;
}

/* ---------- fatigue ----------
   Restored from v1, at finer resolution. Hit rate by how far through the round
   the target came. A real drop shows as a slope; concentration lapses show as a
   dip in the middle. */
function fatigueBuckets(shots,n){
  const k=n||5;
  const buckets=Array.from({length:k},()=>({hit:0,shot:0}));
  shots.forEach(s=>{
    if(!s.ofRound)return;
    const i=Math.min(k-1,Math.floor(s.seq/s.ofRound*k));
    buckets[i].shot++; if(s.res==='h')buckets[i].hit++;
  });
  return buckets.map((b,i)=>({i,...b,pct:b.shot?b.hit/b.shot:null}));
}
function renderFatigue(shots,career){
  const b=fatigueBuckets(shots,5);
  const usable=b.filter(x=>x.shot>=MIN_N);
  if(usable.length<3)return '';
  const W=320,H=96,P=8;
  const x=i=>P+i*(W-2*P)/4;
  const y=v=>H-P-((v-0)/1)*(H-2*P);
  const pts=b.filter(x=>x.pct!=null);
  const path=pts.map((p,i)=>(i?'L':'M')+x(p.i).toFixed(1)+' '+y(p.pct).toFixed(1)).join(' ');
  const first=b[0],last=b[4];
  let verdict;
  if(first&&last&&first.shot>=MIN_N&&last.shot>=MIN_N){
    const d=(first.pct-last.pct)*100;
    verdict = d>=8 ? 'You finish '+Math.round(d)+' points below where you start. That is a real drop — worth looking at concentration, or food and water, over the back half.'
      : d<=-8 ? 'You finish '+Math.round(-d)+' points ABOVE where you start — you are a slow starter rather than a fader. Worth more looking at the first stand.'
      : 'Your first and last thirds are within '+Math.round(Math.abs(d))+' points of each other. No fade worth acting on.';
  }else verdict='Not enough targets yet at both ends of a round to compare.';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
    <line x1="${P}" y1="${y(career)}" x2="${W-P}" y2="${y(career)}" stroke="var(--faint)" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="${path}" fill="none" stroke="var(--clay)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${b.map(p=>p.pct==null?'':`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.pct).toFixed(1)}" r="3.5"
      fill="${p.pct>=career?'var(--hit)':'var(--miss)'}"/>`).join('')}
  </svg>
  <div class="tiny" style="display:flex;justify-content:space-between">
    <span>Start of round</span><span>Middle</span><span>End</span>
  </div>
  <div class="muted" style="margin-top:8px">${esc(verdict)}</div>
  <div class="tiny" style="margin-top:4px">${b.map(p=>p.shot?Math.round(p.pct*100)+'%':'—').join(' · ')} across the five fifths (${b.map(p=>p.shot).join('/')} targets).</div>`;
}

function vAnalysis(){
  const s=me(); if(!s)return vHome();
  const shots=allShots(s.id);
  if(shots.length<10)return `<div class="card ruled" style="text-align:center;padding:30px 18px">
    <h3 style="font-size:19px;font-weight:900">Not enough yet</h3>
    <p class="muted" style="margin:8px 0 0">You've logged ${shots.length} target${shots.length===1?'':'s'}. Stats start appearing at 10, and the coaching breakdowns need about 50 before they mean anything. Shooting a round is the fastest way to fill this page.</p>
  </div>`;

  const car=careerPct(s.id);
  const byGround=breakdown(shots,x=>x.ground==='—'?null:x.ground);
  const misses=shots.filter(x=>x.res==='m');
  const tagged=misses.filter(x=>x.why&&x.why!=='Unsure');
  const whyCount={}; tagged.forEach(x=>whyCount[x.why]=(whyCount[x.why]||0)+1);
  const whys=Object.entries(whyCount).sort((a,b)=>b[1]-a[1]);
  const riv=rivalries(s.id);
  const tr=trophies(s.id);

  /* ORDER OF THIS SCREEN, most useful first:
       1. Form      - am I improving? the single question people open stats for
       2. Priority  - the one thing worth working on, in targets not percentages
       3. Heatmap   - where those targets are going
       4. Fatigue   - when in the round they go
       5. Why       - and for what stated reason
     Everything after that is context: discipline detail, grounds, rivals, kit,
     how far the diagnoses can be trusted, and the cabinet. */
  const hist=roundHistory(s.id);
  const best=hist.length?hist.reduce((a,b)=>b.pct>a.pct?b:a):null;
  const last5=hist.slice(-5);
  const recentPct=last5.length?Math.round(last5.reduce((a,b)=>a+b.pct,0)/last5.length):0;

  let out=`<div class="card ruled">
    <h2 class="stencil">Form</h2>
