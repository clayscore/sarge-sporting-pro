      <div class="stat"><b class="mono">${car}%</b><span>Career</span></div>
      <div class="stat"><b class="mono" style="color:var(--clay)">${best?best.pct:0}%</b><span>Best</span></div>
    </div>
    ${renderForm(hist,car)}
    <div class="divider"></div>
    <div class="grid3">
      <div class="stat"><b class="mono">${hist.length}</b><span>Rounds</span></div>
      <div class="stat"><b class="mono">${shots.length}</b><span>Targets</span></div>
      <div class="stat"><b class="mono">${misses.length}</b><span>Misses</span></div>
    </div>
  </div>`;

  const leaders=lossLeaders(shots,car/100);
  if(leaders.length)out+=`<div class="card">
    <h2 class="stencil">Where the targets are going</h2>
    <p class="tiny" style="margin-bottom:10px">Ranked by <b>targets on the table</b> — how many more you would have hit if that group matched your own ${car}% average. This is deliberately not a list of your worst percentages: a poor group you rarely meet costs you less than a middling one you meet constantly.</p>
    ${renderLossLeaders(leaders,car/100)}
    <div class="tiny">Red where the gap is beyond reasonable doubt for the number of targets behind it; grey where it is suggestive but not yet proven.</div>
  </div>`;

  if(db.mode==='pro'){
    const hm=renderHeatmap(shots,car/100);
    if(hm)out+=`<div class="card"><h2 class="stencil">Target × distance</h2>${hm}</div>`;
  }
  const ft=renderFatigue(shots,car/100);
  if(ft)out+=`<div class="card"><h2 class="stencil">Through the round</h2>${ft}</div>`;




  if(whys.length){
    const dom=whys[0][1]/tagged.length;
    const mm=renderMissMap(shots);
    if(mm)out+=`<div class="card"><h2 class="stencil">Miss map</h2>${mm}</div>`;
    out+=`<div class="card"><h2 class="stencil">Why you miss</h2>
      ${whys.map(([w,n])=>`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px">

        <div class="bar"><i style="width:${n/tagged.length*100}%"></i></div>
      </div>`).join('')}
      <div class="divider"></div>
      ${tagged.length<8?`<div class="muted">Only ${tagged.length} diagnosed misses so far — too few to name a pattern. Tag a few more rounds and this will start telling you something.</div>`
        :dom>=.4?`<div class="muted"><b>${esc(whys[0][0])}</b> accounts for ${Math.round(dom*100)}% of your diagnosed misses. ${esc(advice(whys[0][0]))}</div>`
        :`<div class="muted">No single cause dominates — your misses are spread fairly evenly, which usually points at inconsistency rather than one fixable fault.</div>`}
      ${(()=>{const cv=confidenceCaveat(s.id);return cv?`<div class="tiny" style="margin-top:8px;color:var(--miss)">${esc(cv)}</div>`:''})()}
      ${misses.length-tagged.length>0?`<div class="tiny" style="margin-top:8px">${misses.length-tagged.length} miss${misses.length-tagged.length>1?'es are':' is'} untagged or unsure and excluded from this.</div>`:''}
    </div>`;
  }

  if(db.mode==='pro'){
    const plan=practicePlan(shots,car/100);
    if(plan.length)out+=`<div class="card dark"><h2 class="stencil">Practice plan</h2>
      ${plan.map((p,i)=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ink-3)">
        <b style="color:var(--clay-2)">${i+1}</b><div><div style="font-weight:800;font-size:13px">${esc(p.t)}</div>
        <div class="tiny" style="color:#8b97a6">${esc(p.d)}</div></div></div>`).join('')}</div>`;
  }

  /* Sportrap analysis. The traps are the same five throughout a round and every
     shooter sees each one from all five stands, so a trap letter is a far
     cleaner unit than anything Sporting can offer: it isolates the target from
     the angle you saw it at. */
  ['sportrap','compak','skeet','abt','supersporting'].forEach(dk=>{
  const srShots=shots.filter(x=>x.discipline===dk);
  if(srShots.length>=10){
    const byTrap=breakdown(srShots,x=>x.trap?'Trap '+x.trap:null);

    out+=`<div class="card"><h2 class="stencil">${esc(DISCIPLINES[dk].name)}</h2>
      <div class="grid3" style="margin-bottom:10px">

        <div class="stat"><b class="mono">${srShots.length}</b><span>Targets</span></div>

      </div>
      ${byTrap.length?`<div class="lbl" style="margin-bottom:6px">By trap</div>${byTrap.map(t=>barRow(t.k,t,srPct/100)).join('')}`:''}
      ${(()=>{const bh=breakdown(srShots,x=>x.house?HOUSE[x.house]:null);return bh.length?`<div class="lbl" style="margin:12px 0 6px">By house</div>${bh.map(t=>barRow(t.k,t,srPct/100)).join('')}`:''})()}
      ${byElement.length?`<div class="lbl" style="margin:12px 0 6px">By target type</div>${byElement.map(t=>barRow(t.k,t,srPct/100)).join('')}`:''}

      <div class="tiny">Compared against your ${esc(DISCIPLINES[dk].short)} average, not your overall one — the disciplines are not the same test and pooling them would be comparing different things. A trap letter is the same target from every stand, so this is the closest the app gets to isolating a target from the angle you saw it at.</div>

  });

  if(db.mode==='pro'){

    /* First bird versus second of a pair is one of the more useful splits in

    const byThrow=breakdown(shots,x=>x.element);
    if(byThrow.length)out+=`<div class="card"><h2 class="stencil">By target type</h2>
      ${byThrow.map(t=>barRow(t.k,t,car/100)).join('')}
      ${(()=>{const bp=breakdown(shots.filter(x=>x.pairPos!==null&&x.pairPos!==undefined),

    const byClay=breakdown(shots,x=>x.clay);

    if(byDist.length)out+=`<div class="card"><h2 class="stencil">By distance</h2>

  if(db.mode==='pro'&&tagged.length>=5){

      ${dc.findings.map(f=>`<div style="display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--rule)">

      ${(()=>{const cands=db.rounds.filter(r=>firsthandMisses(r,s.id).length>=5&&!r.check)
        .sort((a,b)=>b.createdAt-a.createdAt).slice(0,3);
        return cands.length?`<div class="who" style="margin-top:10px">${cands.map(r=>`<button class="chip clay" onclick="startCheck('${r.id}')">Check ${esc(r.ground||r.date)}</button>`).join('')}</div>`
          :`<div class="tiny" style="margin-top:8px">No round yet has 5 or more diagnosed misses without a check already against it.</div>`})()}
      ${lastCheck?`<div class="tiny" style="margin-top:10px">Last checked ${new Date(lastCheck.check.at).toLocaleDateString()}${lastCheck.check.by?' by '+esc(lastCheck.check.by):''}.</div>`:''}
    </div>`;
  }

  if((db.goals||[]).some(g=>g.shooter===s.id))out+=`<div class="card"><h2 class="stencil">Goals</h2>${renderGoals(s.id)}</div>`;

  if(riv.length)out+=`<div class="card"><h2 class="stencil">Head to head</h2>
    ${riv.map(v=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)">
      <div style="flex:1"><div style="font-weight:800;font-size:13px">${esc(v.name)}</div>

    </div>`).join('')}
    <div class="tiny" style="margin-top:8px">Compared on percentage, so it's fair when you shoot different totals.</div>
  </div>`;

  if(tr.length)out+=`<div class="card"><h2 class="stencil">Cabinet</h2>
    <div style="display:flex;flex-direction:column;gap:12px">
    ${tr.map(t=>`<div style="display:flex;gap:12px;align-items:center">${medal(t.icon,t.tier)}
      <div><div style="font-weight:900;font-size:14px">${esc(t.t)}</div><div class="tiny">${esc(t.d)}</div></div></div>`).join('')}
    </div></div>`;

  if(db.mode==='simple')out+=`<div class="tiny" style="text-align:center">Want presentation breakdowns and a practice plan? <button style="color:var(--clay);font-weight:800" onclick="db.mode='pro';save();render()">Switch to Pro</button></div>`;
  return out;
}
function advice(why){
  return{
    'Behind':'Almost always a speed problem rather than a lead problem — start the gun further back and let the barrels move with the bird before you pull.',
    'In front':'Usually over-riding a slow target. Try matching the clay\'s speed first and firing off the movement rather than swinging past it.',
    'Above':'Commonly a head lifting off the stock at the last moment. Check your cheek stays down through the shot.',
    'Below':'Often a dropping barrel on a rising bird — keep the muzzles above the line of flight as you come to it.',
    "Didn't mount":'A gun-mount issue, not a shooting one. Mount practice at home costs nothing and fixes this faster than cartridges will.',
    'Lost it':'A visual pick-up problem. Move your hold point and your eyes back towards the trap so you see it earlier.'
  }[why]||'';
}
function practicePlan(shots,base){
  const out=[];
  const byPres=breakdown(shots,x=>x.pres).filter(p=>p.n>=MIN_N&&p.hi<base);
  byPres.slice(0,3).forEach(p=>out.push({t:p.k,d:`${Math.round(p.p*100)}% against your ${Math.round(base*100)}% average, over ${p.n} targets. Statistically below your standard, not just a bad day.`}));
  breakdown(shots,x=>x.dist).filter(d=>d.n>=MIN_N*2&&d.hi<base).slice(0,1).forEach(d=>
    out.push({t:d.k+' targets',d:`${Math.round(d.p*100)}% on birds ${BAND_HINT[d.k]}, over ${d.n} targets — below your average even allowing for the sample size.`}));
  const tagged=shots.filter(x=>x.res==='m'&&x.why&&x.why!=='Unsure');
  if(tagged.length>=8){
    const t={};tagged.forEach(x=>t[x.why]=(t[x.why]||0)+1);
    const [w,n]=Object.entries(t).sort((a,b)=>b[1]-a[1])[0];
    if(n/tagged.length>=.35&&advice(w))out.push({t:'Fault: '+w,d:advice(w)});
  }
  if(!out.length&&shots.length>=50)out.push({t:'Nothing stands out',d:'No presentation or fault is significantly below your average. At this point general volume and consistency will do more for you than targeted work.'});
  return out;
}

/* =============================================================================
   SHARE CARD - a round summary worth actually sending to the squad WhatsApp.
   Rendered off-screen at fixed width so it looks the same on every phone.
============================================================================= */
function shareRound(id){
  const r=db.rounds.find(x=>x.id===id); const s=me(); if(!r||!s)return;
  const st=roundStats(r,s.id);
  const others=r.shooterIds.filter(i=>i!==s.id).map(i=>({n:shooter(i).name,...roundStats(r,i)})).filter(o=>o.shot);
  const all=[{n:s.name,...st},...others].sort((a,b)=>b.pct-a.pct);
  document.getElementById('sharecard').innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:22px">
      <svg width="30" height="30" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#e8621d" stroke-width="2.5"/><ellipse cx="20" cy="20" rx="12" ry="5" fill="#e8621d"/><circle cx="20" cy="20" r="3" fill="#12161d"/></svg>
      <div style="font-size:15px;font-weight:800;letter-spacing:.18em;text-transform:uppercase">Clayscore</div>
    </div>
    <div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8b97a6;font-weight:800">${esc(r.date)}</div>
    <div style="font-size:34px;font-weight:900;margin:2px 0 20px">${esc(r.ground||'Sporting round')}</div>
    <div style="display:flex;align-items:baseline;gap:14px;margin-bottom:22px">
      <div style="font-size:82px;font-weight:900;line-height:1;color:#e8621d">${st.hit}</div>
      <div style="font-size:30px;font-weight:800;color:#8b97a6">/ ${st.shot}</div>
      <div style="margin-left:auto;text-align:right">
        <div style="font-size:40px;font-weight:900;line-height:1">${st.pct}%</div>
        <div style="font-size:11px;letter-spacing:.12em;color:#8b97a6;font-weight:800;text-transform:uppercase">${esc(s.name)}</div>
      </div>
    </div>
    ${all.length>1?`<div style="border-top:1px solid #2b3542;padding-top:14px">
      ${all.map((o,i)=>`<div style="display:flex;align-items:center;gap:12px;padding:7px 0">
        <div style="width:22px;font-size:13px;font-weight:900;color:${i===0?'#d4a017':'#6b7787'}">${i+1}</div>
        <div style="flex:1;font-size:15px;font-weight:800">${esc(o.n)}</div>
        <div style="font-size:15px;font-weight:900;font-variant-numeric:tabular-nums">${o.hit}/${o.shot}</div>
      </div>`).join('')}</div>`:''}
    <div style="margin-top:24px;font-size:11px;color:#4e5966;letter-spacing:.1em;text-transform:uppercase;font-weight:800">${r.stands.length} stands · English Sporting${(()=>{const c=conditionsText(r);return c?' · '+esc(c):''})()}</div>`;
  const node=document.getElementById('sharecard');
  if(typeof html2canvas!=='function'){notice('Share unavailable','The image library did not load. It needs one online visit to cache, after that sharing works offline.');return;}
  html2canvas(node,{backgroundColor:'#12161d',scale:2}).then(cv=>{
    cv.toBlob(b=>{
      if(!b)return;
      const file=new File([b],'clayscore.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Clayscore'}).catch(()=>{});
      }else{
        const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clayscore-'+r.date+'.png';a.click();
        notice('Saved','Your round card has been downloaded — sharing straight to apps needs a browser that supports it.');
      }
    },'image/png');
  }).catch(()=>notice('Share failed','Could not generate the image on this device.'));
}

/* =============================================================================
   DIAGNOSIS QUALITY

   The whole coaching layer rests on one unexamined assumption: that when you tag
   a miss "behind", you were actually behind. Every honesty measure elsewhere in
   this app guards against SMALL SAMPLES. None of them guard against
   SYSTEMATICALLY WRONG INPUTS, and no amount of statistics fixes bad data — a
   confident average of a hundred wrong diagnoses is still wrong.

   What this section does NOT do: encode shooting theory. I am not a coach, and a
   hard-coded table of "implausible" reason/presentation pairs would be me
   asserting my own guesses as fact. Everything below is derived from Paul's own
   data, or measured against a human observer.

   Four independent lines of evidence:
     1. PROVENANCE  — when was the diagnosis made? On the stand, or from memory
                      days later? Recall degrades; the app knows which.
     2. INFORMATIVENESS — are your reasons statistically associated with the
                      presentations you're shooting? Genuine diagnoses cluster
                      (you miss rabbits over the top, fast crossers behind).
                      Habitual tagging is independent of the target. Chi-square
                      test of association, with Cramér's V for effect size.
     3. VARIETY     — one reason dominating across wildly different targets is
                      either one deep fault or a reporting habit. Flagged, not
                      resolved, because the data cannot tell those apart.
     4. AGREEMENT   — the only real test. Have someone who watched you shoot tag
                      the same misses blind, and measure Cohen's kappa against
                      your own answers.
============================================================================= */

/* Critical value of the chi-square distribution via Wilson–Hilferty.

   Accurate to well under 1% from df=2 upwards (df=10 gives 18.30 against a true
   18.307). df=1 is its known weak case - it returns 3.75 against a true 3.841 -
   so df=1 is computed exactly instead, since chi-square with one degree of
   freedom is just the square of the normal deviate. */
function chiCrit(df,z){
  if(df<1)return Infinity;
  const zz=z||1.6449;
  if(df===1){
    // two-tailed normal deviate matching this one-tailed chi-square area
    const zTwo=zz===1.6449?1.959964:zz;
    return zTwo*zTwo;
  }
  const a=2/(9*df);
  return df*Math.pow(1-a+zz*Math.sqrt(a),3);
}
function contingency(shots){
  const rows=[],cols=[];
  const misses=shots.filter(s=>s.res==='m'&&s.why&&s.pres);
  misses.forEach(s=>{
    if(!rows.includes(s.why))rows.push(s.why);
    if(!cols.includes(s.pres))cols.push(s.pres);
  });
  const m=rows.map(()=>cols.map(()=>0));
  misses.forEach(s=>{m[rows.indexOf(s.why)][cols.indexOf(s.pres)]++;});
  return{rows,cols,m,n:misses.length};
}
/* Returns {ok:false,why} when the table cannot support a test, rather than
   returning a number that looks like an answer. */
function association(tab){
  const{rows,cols,m,n}=tab;
  if(rows.length<2)return{ok:false,why:'You have only used one miss reason on targets with a recorded presentation, so there is nothing to associate.'};
  if(cols.length<2)return{ok:false,why:'Your tagged misses come from only one presentation, so there is nothing to compare across.'};
  const rt=m.map(r=>r.reduce((a,b)=>a+b,0));
  const ct=cols.map((_,j)=>m.reduce((a,r)=>a+r[j],0));
  let chi2=0,small=0,cells=0;
  for(let i=0;i<rows.length;i++)for(let j=0;j<cols.length;j++){
    const e=rt[i]*ct[j]/n; cells++;
    if(e<5)small++;
    if(e>0)chi2+=Math.pow(m[i][j]-e,2)/e;
  }
  const df=(rows.length-1)*(cols.length-1);
  const crit=chiCrit(df,1.6449);
  const v=Math.sqrt(chi2/(n*Math.min(rows.length-1,cols.length-1)));
  // the classic rule: chi-square is unreliable when many expected counts are <5
  if(small/cells>0.2)return{ok:false,chi2,df,v,n,
    why:'Too thinly spread to test yet — '+Math.round(small/cells*100)+'% of the combinations have fewer than 5 expected misses. Chi-square is unreliable below that. Keep tagging and this will become testable.'};
  return{ok:true,chi2,df,crit,v,n,significant:chi2>crit};
}
/* Three tiers of diagnosis, most to least trustworthy:
     live   - you, on the stand, seconds after the shot
     enrich - you, from memory after the round
     shared - somebody else, watching from beside you, in a round they scored */
function provenance(sh){
  const out={total:0,tagged:0,unsure:0,unsureAuto:0,unsureChosen:0,
    live:0,enrich:0,shared:0,v1:0,delays:[]};
  db.rounds.forEach(r=>r.stands.forEach(st=>st.slots.forEach(sl=>{
    const c=r.scores[sh]&&r.scores[sh][sl.id];
    if(!c||c.r!=='m')return;
    out.total++;
    if(!c.why)return;
    if(c.why==='Unsure'){
      out.unsure++;
      // "never looked at" and "looked at and couldn't call" are different facts
      if(c.whyAuto)out.unsureAuto++; else out.unsureChosen++;
      return;
    }
    out.tagged++;
    if(c.whySrc==='live')out.live++;
    else if(c.whySrc==='shared')out.shared++;
    /* Imported from v1: the shooter's own diagnosis, but v1 did not record
       whether it was made on the stand or edited afterwards, so it counts as
       firsthand and is excluded from the recall figure rather than guessed at. */
    else if(c.whySrc==='v1')out.v1++;
    else if(c.whySrc==='enrich'){out.enrich++;
      if(c.whyAt&&r.createdAt)out.delays.push((c.whyAt-r.createdAt)/86400000);}
  })));
  out.known=out.live+out.enrich+out.shared+out.v1;
  out.firsthand=out.live+out.enrich+out.v1;   // your own judgement, whenever it was made
  out.medianDelay=out.delays.length?out.delays.slice().sort((a,b)=>a-b)[Math.floor(out.delays.length/2)]:null;
  return out;
}
// only your own diagnoses are worth testing against an observer
function firsthandMisses(r,sh){
  const out=[];
  r.stands.forEach((st,si)=>st.slots.forEach((sl,i)=>{
    const c=r.scores[sh]&&r.scores[sh][sl.id];
    if(c&&c.r==='m'&&c.why&&c.whySrc!=='shared')out.push({slot:sl.id,stand:si,idx:i});
  }));
  return out;
}
function variety(shots){
  const tagged=shots.filter(s=>s.res==='m'&&s.why&&s.why!=='Unsure');
  if(!tagged.length)return null;
  const t={};tagged.forEach(s=>t[s.why]=(t[s.why]||0)+1);
  const sorted=Object.entries(t).sort((a,b)=>b[1]-a[1]);
  const presOfTop=new Set(tagged.filter(s=>s.why===sorted[0][0]&&s.pres).map(s=>s.pres));
  return{top:sorted[0][0],share:sorted[0][1]/tagged.length,
    reasons:sorted.length,n:tagged.length,spread:presOfTop.size};
}

/* ---------- agreement: the only real test ---------- */
function kappa(pairs){
  const n=pairs.length;
  if(n<5)return{ok:false,why:'A check needs at least 5 misses to mean anything; this one has '+n+'.'};
  const cats=[...new Set(pairs.flatMap(p=>[p.a,p.b]))];
  if(cats.length<2)return{ok:false,why:'Both of you gave the same single answer to everything, so agreement cannot be distinguished from having only one option.'};
  const agree=pairs.filter(p=>p.a===p.b).length;
  const po=agree/n;
  let pe=0;
  cats.forEach(c=>{
    pe+=(pairs.filter(p=>p.a===c).length/n)*(pairs.filter(p=>p.b===c).length/n);
  });
  const k=pe===1?0:(po-pe)/(1-pe);
  return{ok:true,n,agree,po,pe,k};
}
// Landis & Koch bands. A widely used CONVENTION, not a law of nature.
function kappaBand(k){
  if(k<0)return'worse than chance';
  if(k<0.21)return'slight';
  if(k<0.41)return'fair';
  if(k<0.61)return'moderate';
  if(k<0.81)return'substantial';
  return'almost perfect';
}
function allChecks(sh){
  const pairs=[];
  db.rounds.forEach(r=>{
    const ck=r.check; if(!ck||ck.shooter!==sh)return;
    r.stands.forEach(st=>st.slots.forEach(sl=>{
      const mine=r.scores[sh]&&r.scores[sh][sl.id];
      const theirs=ck.tags&&ck.tags[sl.id];
      if(mine&&mine.r==='m'&&mine.why&&theirs)pairs.push({a:mine.why,b:theirs,round:r.id});
    }));
  });
  return pairs;
}

/* Combines the four lines of evidence into a coarse, stated verdict. Coarse on
   purpose: a single number out of 100 would imply a precision none of this has. */
function diagnosisConfidence(sh){
  const shots=allShots(sh);
  const prov=provenance(sh);
  const assoc=association(contingency(shots));
  const va=variety(shots);
  const pairs=allChecks(sh);
  const kap=pairs.length?kappa(pairs):null;
  const findings=[];
  let score=0,weighted=0;

  // 1. coverage
  if(prov.total>=10){
    const cov=prov.tagged/prov.total;
    weighted++;
    const detail=[];
    if(prov.unsureAuto)detail.push(prov.unsureAuto+' still on the automatic "Unsure" you never went back to');
    if(prov.unsureChosen)detail.push(prov.unsureChosen+' you looked at and could not call');
    if(cov>=0.8){score++;findings.push({good:true,t:'Well documented',d:Math.round(cov*100)+'% of your misses carry a real diagnosis.'+(detail.length?' ('+detail.join('; ')+'.)':'')});}
    else findings.push({good:false,t:'Thinly documented',d:'Only '+Math.round(cov*100)+'% of your misses have a real reason against them'+(detail.length?' — '+detail.join('; '):'')+'. The coaching only sees the diagnosed ones, and there is no reason to assume the rest look the same.'});
  }
  // 2. whose judgement is it? Reasons that arrived in a squad code are the
  // book-keeper's read of your miss, not yours.
  if(prov.known>=8&&prov.shared>0){
    weighted++;
    const sharedShare=prov.shared/prov.known;
    if(sharedShare<=0.25){score++;findings.push({good:true,t:'Mostly your own judgement',d:'Only '+Math.round(sharedShare*100)+'% of your diagnoses came from a round somebody else scored.'});}
    else findings.push({good:false,t:'Much of it is second-hand',d:Math.round(sharedShare*100)+'% of your diagnoses ('+prov.shared+' of '+prov.known+') arrived in a squad code, which means whoever kept the book decided why you missed, watching from beside you. That is a legitimate opinion but it is not yours, and it tells you nothing about how well you read your own shooting.'});
  }
  // 3. recall - judged only on the diagnoses you actually made yourself
  if(prov.firsthand>=8&&(prov.live+prov.enrich)>=8){
    weighted++;
    const timed=prov.live+prov.enrich;
    const liveShare=timed?prov.live/timed:0;
    if(liveShare>=0.6){score++;findings.push({good:true,t:'Diagnosed at the time',d:Math.round(liveShare*100)+'% of your own reasons were recorded on the stand rather than from memory afterwards.'});}
    else findings.push({good:false,t:'Mostly from memory',d:Math.round((1-liveShare)*100)+'% of your own reasons were added after the round'+(prov.medianDelay!=null&&prov.medianDelay>=1?', typically '+Math.round(prov.medianDelay)+' day(s) later':'')+'. Recall of a specific miss fades quickly, so these are the weakest entries you made yourself.'});
  }else if(prov.known>=8&&prov.firsthand<8){
    findings.push({good:false,t:'Barely any of your own diagnoses',d:'Only '+prov.firsthand+' of your '+prov.known+' diagnoses were made by you. There is not enough of your own judgement in the data to assess it.'});
  }
  // 3. informativeness
  if(assoc.ok){
    weighted++;
    if(assoc.significant){score++;findings.push({good:true,t:'Your reasons track the targets',d:'Your miss reasons are statistically associated with the presentations you shoot (chi-square '+assoc.chi2.toFixed(1)+' against a '+assoc.crit.toFixed(1)+' threshold, Cramér\'s V '+assoc.v.toFixed(2)+'). Habitual tagging would show no such link, so this is genuine evidence that you are discriminating between targets.'});}
    else findings.push({good:false,t:'Reasons look independent of the target',d:'Your miss reasons show no statistical association with what you were shooting at (chi-square '+assoc.chi2.toFixed(1)+', below the '+assoc.crit.toFixed(1)+' threshold). That is what habitual tagging looks like. It is not proof of it — you may simply have one fault that shows everywhere — but it means the reason data is carrying little information about the targets.'});
  }
  // 4. variety
  if(va&&va.n>=12){
    weighted++;
    if(va.share<0.6){score++;findings.push({good:true,t:'Varied diagnoses',d:'Your commonest reason accounts for '+Math.round(va.share*100)+'% of tagged misses, spread across '+va.spread+' different presentations.'});}
    else findings.push({good:false,t:'One answer dominates',d:'"'+va.top+'" accounts for '+Math.round(va.share*100)+'% of your tagged misses, across '+va.spread+' different presentation'+(va.spread===1?'':'s')+'. That is either one deep, genuine fault or a habitual answer, and the data cannot tell those two apart. A diagnosis check would.'});
  }
  // 5. measured agreement - worth more than everything above put together
  if(kap&&kap.ok){
    weighted+=2;
    if(kap.k>=0.41){score+=2;findings.push({good:true,t:'Checked against an observer',d:'Cohen\'s kappa '+kap.k.toFixed(2)+' ('+kappaBand(kap.k)+' agreement) over '+kap.n+' checked misses. This is the only direct evidence here, and it is favourable.'});}
    else findings.push({good:false,t:'An observer disagreed with you',d:'Cohen\'s kappa '+kap.k.toFixed(2)+' ('+kappaBand(kap.k)+' agreement) over '+kap.n+' checked misses — you agreed on '+kap.agree+' of them, and chance alone would give about '+Math.round(kap.pe*kap.n)+'. Treat the coaching in this app with real caution until this improves.'});
  }else if(pairs.length){
    findings.push({good:false,t:'Check too small to read',d:kap.why});
  }else{
    findings.push({good:false,t:'Never checked against anyone',d:'Every line of evidence above is indirect. The only way to know whether your diagnoses are right is to have someone who watched you shoot tag the same misses blind and compare. Until you do that, the coaching rests on your own unverified judgement.'});
  }

  let level='unknown';
  if(weighted>=2){
    const ratio=score/weighted;
    level=ratio>=0.75?'good':ratio>=0.4?'mixed':'weak';
  }
  return{level,score,weighted,findings,prov,assoc,variety:va,kappa:kap,checks:pairs.length};
}
function confidenceCaveat(sh){
  const c=diagnosisConfidence(sh);
  if(c.level==='good')return'';
  if(c.level==='weak')return'Read the fault-based advice below with real scepticism: the diagnosis check on your data came out weak, so the input this rests on may be unreliable.';
  if(c.level==='mixed')return'Treat fault-based advice as provisional — the evidence that your miss diagnoses are accurate is mixed.';
  return'There is not yet enough tagged data to judge whether your miss diagnoses are reliable, so treat fault-based advice as a hypothesis.';
}

/* =============================================================================
   SQUAD SHARING — no server, no account, no signal

   The squad book-keeper finishes a round and gets a short text code. They paste
   it into the squad's WhatsApp group; everyone else pastes it into Clayscore and
   the round lands in their own history with their own scores against their name.

   Why a text code rather than a cloud:
   - Clay grounds routinely have no usable signal. A cloud sync fails exactly
     where you need it. A code sent later, from the car park or the pub, doesn't.
   - No accounts, no logins, no one else's data sitting in someone's cloud.
   - No new dependency. A QR code would need a library; a text string needs
     nothing, and WhatsApp is already on everyone's phone.

   Format is deliberately plain text rather than base64 so it stays inspectable
   and diagnosable. One character per target keeps a 100-bird, 5-gun round to
   roughly 700 characters, well inside any messaging app.
============================================================================= */
/* Version 3 of the format. v2 encoded presentations, distances and chokes as
   INDEXES into the app's lists - which silently corrupts the moment a list
   changes. Adding 3/8 to the choke list proved that: a v2 code would have
   decoded "1/2" as "3/8" on the newer version, with nothing to indicate
   anything was wrong. Silent corruption is exactly the failure this app guards
   against everywhere else, so these are now encoded as NAMES. Costs a few
   hundred characters on a long round and is immune to the lists ever changing.
   A v2 code is now rejected with an explanation rather than misread. */
var SHARE_TAG='CLAY3';
var RES_CHARS='abcdefg';   // index into REASONS - safe, as REASONS is fixed and full
function encField(s){
  // '~' is a sub-separator and encodeURIComponent leaves it alone, so escape it
  return encodeURIComponent(s==null?'':String(s)).replace(/~/g,'%7E');
}
function decField(s){try{return decodeURIComponent(s||'')}catch(e){return s||''}}
function safeLabel(s){const v=decField(s||'').trim();return v?v.slice(0,40):null;}

function encodeRound(r){
  const ids=r.shooterIds;
  const stands=r.stands.map(st=>{
    const cyc=standCycle(st);
    let birds;
    if(isSkeet(r)){
      // element and house per target; station numbers and order come from the rules
      birds=st.slots.map(sl=>encField(sl.element)+'~'+encField(sl.house)).join(',');
    }else if(isMenuFormat(r)){
      // pair types first, then one entry per target carrying its trap letter
      const parts=[encField(st.d1Type)+'~',encField(st.d2Type)+'~'];
      st.slots.forEach(sl=>parts.push(encField(sl.trap)+'~'));
      birds=parts.join(',');
    }else{
      birds=Array.from({length:cyc},(_,i)=>{
        const b=(st.birds||[])[i]||{};
        return encField(b.pres)+'~'+encField(b.dist);
      }).join(',');
    }
    return st.slots.length+':'+cyc+':'+encField(st.choke)+':'+birds+':'+encField(st.throwType);
  }).join(';');
  const names=ids.map(id=>encField(shooter(id).name)).join(',');
  const scores=ids.map(id=>{
    let s='';
    r.stands.forEach(st=>st.slots.forEach(sl=>{
      const c=r.scores[id]&&r.scores[id][sl.id];
      if(!c||!c.r){s+='.';return;}
      if(c.r==='h'){s+='H';return;}
      const ri=c.why?REASONS.indexOf(c.why):-1;
      s+=ri>=0?RES_CHARS[ri]:'M';
    }));
    return s;
  }).join(',');
  let cond='';
  const rd=r.conditions&&r.conditions.readings;
  if(rd&&rd.length){const a=rd[0];
    cond=encField([a.windBand||'',a.lightBand||'',a.temp==null?'':Math.round(a.temp)].join('~'));}
  return [SHARE_TAG,r.id,r.date,encField(r.ground),stands,names,scores,cond,
    encField(r.discipline||'sporting'),String(r.layouts||1),String(r.cages||'')].join('|');
}

/* Returns {round,names} or {error}. Refuses anything it cannot fully understand
   rather than importing a half-round - a partly-decoded score is worse than none. */
function decodeRound(text){
  if(!text)return{error:'Nothing to read.'};
  const i=text.indexOf(SHARE_TAG);
  if(i<0){
    // an older code would decode to the wrong chokes and presentations, so refuse
    if(text.indexOf('CLAY2')>=0)return{error:'That code was made by an older version of Clayscore and cannot be read safely — the target and choke lists have changed since, so it would import the wrong details. Ask them to update and send it again.'};
    return{error:'No Clayscore code found in that text.'};
  }
  // tolerate surrounding chatter and stray whitespace from a paste
  const raw=text.slice(i).split(/\s/).join('');
  const p=raw.split('|');
  if(p.length<7)return{error:'That code looks incomplete — it may have been cut short when it was copied.'};
  const [,srcId,date,groundE,standsE,namesE,scoresE,condE,discE,layoutsE,cagesE]=p;
  const dl=safeLabel(discE);
  const disc=DISCIPLINES[dl]?dl:'sporting';   // any known discipline, else Sporting
  const names=namesE?namesE.split(',').map(decField).filter(Boolean):[];
  if(!names.length)return{error:'That code has no shooters in it.'};
  const specs=standsE?standsE.split(';'):[];
  if(!specs.length)return{error:'That code has no stands in it.'};

  const stands=[];let total=0;
  for(const spec of specs){
    const bits=spec.split(':');
    const n=parseInt(bits[0],10);
    if(!(n>0))return{error:'That code has a malformed stand and cannot be trusted.'};
    const cyc=Math.max(1,Math.min(parseInt(bits[1],10)||1,n));
    const birds=(bits[3]||'').split(',').map(b=>{
      const parts=b.split('~');
      return{pres:safeLabel(parts[0]),dist:safeLabel(parts[1])};
    });
    stands.push({id:newId(),cycle:cyc,birds:birds,
      throwType:(function(){const t=safeLabel(bits[4]);return throwOf(t)?t:null;})(),
      choke:safeLabel(bits[2]),
      slots:Array.from({length:n},()=>({id:newId(),pres:null,dist:null}))});
    total+=n;
  }

  const scoreStrs=scoresE?scoresE.split(','):[];
  if(scoreStrs.length!==names.length)
    return{error:'That code has '+names.length+' shooters but '+scoreStrs.length+' score lines. It is corrupt.'};
  for(const s of scoreStrs)
    if(s.length!==total)
      return{error:'That code expects '+total+' targets but one score line has '+s.length+'. It is corrupt.'};

  const r=newRound();
  r.sharedId=srcId||null;
  r.date=(date||'').slice(0,10)||r.date;
  r.ground=decField(groundE);
  r.discipline=disc;
  r.layouts=Math.max(1,parseInt(layoutsE,10)||1);
  if(disc!=='sporting'){
    r.cages=parseInt(cagesE,10)||Math.max(1,Math.round(stands.length/r.layouts));
    r.trapCount=r.cages===4?5:6;
  }
  r.stands=stands;
  /* A Sportrap round carries trap letters and element positions on its slots.
     The bird fields of the stand grammar are reused to convey them, so a shared
     Sportrap round rebuilds with its menu intact rather than as bare hit/miss. */
  if(disc==='skeet')stands.forEach((st,si)=>{
    st.index=si;
    st.station=si<SKEET_STATIONS?si+1:null;
    let doublesSeen=0;
    st.slots.forEach((sl,i)=>{
      const b=(st.birds||[])[i]||{};
      sl.element=b.pres||'single';
      sl.house=b.dist||null;
      sl.pos=sl.element==='double'?doublesSeen++:0;
    });
    st.birds=[];
  });
  else if(disc!=='sporting')stands.forEach((st,si)=>{
    st.index=si;
    st.d1Type=(st.birds[0]&&st.birds[0].pres==='sim')?'sim':'report';
    st.d2Type=(st.birds[1]&&st.birds[1].pres==='sim')?'sim':'report';
    const seq=[['single',0],['d1',0],['d1',1],['d2',0],['d2',1]];
    st.slots.forEach((sl,i)=>{
      sl.element=seq[i]?seq[i][0]:'single';
      sl.pos=seq[i]?seq[i][1]:0;
      sl.trap=(st.birds[2+i]&&st.birds[2+i].pres)||null;
    });
    st.birds=[];
  });
  if(condE){
    const [w,l,t]=decField(condE).split('~');
    if(w||l||t)r.conditions={readings:[{at:Date.now(),note:'Shared with the round',
      windBand:w||null,lightBand:l||null,temp:t===''?null:+t,
      wind:null,gust:null,dir:null,cloud:null,precip:null}]};
  }
  return{round:r,names:names,scoreStrs:scoreStrs};
}

/* Matches shooters by name, creating any who are new. Deliberately does NOT
   overwrite a round already imported or shot on this device: a duplicate is
   reported and skipped, because silently merging two versions of the same round
   is how you end up with scores nobody can account for. */
function mergeShared(text){
  const d=decodeRound(text);
  if(d.error)return{error:d.error};
  const r=d.round;
  if(r.sharedId&&db.rounds.some(x=>x.sharedId===r.sharedId||x.id===r.sharedId))
    return{error:'You already have this round.'};
  // also catch the round still open on this phone - the book-keeper pasting back
  // their own code mid-round would otherwise get a duplicate of what they're shooting
  if(r.sharedId&&db.live&&(db.live.id===r.sharedId||db.live.sharedId===r.sharedId))
    return{error:'That is the round you are scoring right now.'};

  let created=0;
  const ids=d.names.map(nm=>{
    let s=db.shooters.find(x=>x.name.toLowerCase()===nm.toLowerCase());
    if(!s){s={id:newId(),name:nm,me:!db.shooters.length};db.shooters.push(s);created++;}
    return s.id;
  });
  r.shooterIds=ids;
  /* The Skeet option target is per shooter, so the eighth stand holds one slot
     each. Ownership can only be attached once the local shooter ids exist. */
  if(r.discipline==='skeet'){
    const os=r.stands[SKEET_STATIONS];
    if(os)os.slots.forEach((sl,i)=>{sl.element='option';sl.owner=ids[i]||null;});
    if(!r.nominations)r.nominations={};
  }

  ids.forEach((id,k)=>{
    const str=d.scoreStrs[k];let pos=0;
    r.stands.forEach(st=>st.slots.forEach(sl=>{
      const ch=str[pos++];
      if(ch==='.')return;
      const c=cell(r,id,sl.id,true);
      if(ch==='H'){c.r='h';return;}
      c.r='m';
      const ri=RES_CHARS.indexOf(ch);
      c.why=ri>=0?REASONS[ri]:null;
      /* Provenance matters here. Whoever kept the book tagged this miss, which
         means it is THEIR read of it from beside you, not your own judgement.
         Marking it 'shared' keeps the diagnosis-quality check honest - it would
         otherwise treat someone else's guess as your most trusted category. */
      if(c.why){c.whySrc='shared';c.whyAt=Date.now();}
    }));
  });
  r.limits={};ids.forEach(id=>r.limits[id]=roundStats(r,id).shot);
  if(r.ground&&!db.grounds.some(g=>gkey(g)===gkey(r.ground)))db.grounds.push(r.ground);
  db.rounds.push(r);save();
  const s=me();
  return{round:r,created:created,
    mine:s&&ids.includes(s.id)?roundStats(r,s.id):null,
    inRound:!!(s&&ids.includes(s.id))};
}

function shareSquad(roundId){
  const r=db.rounds.find(x=>x.id===roundId)||db.live;
  if(!r)return;
  const code=encodeRound(r);
  const msg=(r.ground||'Round')+' — '+r.date+'\n'+
    r.shooterIds.map(id=>{const t=roundStats(r,id);return shooter(id).name+' '+t.hit+'/'+t.shot}).join('\n')+
    '\n\nPaste this into Clayscore to add it to your own stats:\n'+code;
  if(navigator.share){
    navigator.share({text:msg}).catch(()=>codeSheet(code,msg));
    return;
  }
  codeSheet(code,msg);
}
function codeSheet(code,msg){
  sheet(`<h3>Squad code</h3>
    <p class="muted" style="margin:8px 0 10px">Send this to the squad. Anyone with Clayscore can paste it in and the round lands in their own history, with their own scores against their name.</p>
    <textarea class="field" id="sharecode" rows="5" readonly style="font-size:11px;font-family:ui-monospace,monospace">${esc(msg||code)}</textarea>
    <button class="btn clay" style="margin:10px 0 8px" onclick="copyCode()">Copy</button>
    <button class="btn ghost" onclick="closeSheet()">Close</button>
    <p class="tiny" style="margin-top:10px">${code.length} characters. No account, no signal and no server involved — it is just text.</p>`);
}
function copyCode(){
  const el=document.getElementById('sharecode');
  if(!el)return;
  el.select();
  const done=()=>{closeSheet();notice('Copied','Paste it into your squad chat.');};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).then(done,()=>notice('Copy it by hand','Your browser blocked the clipboard. Select the text and copy it manually.'));
  }else{
    try{document.execCommand('copy');done();}
    catch(e){notice('Copy it by hand','Select the text in the box and copy it manually.');}
  }
}
function importSheet(){
  sheet(`<h3>Paste a squad code</h3>
    <p class="muted" style="margin:8px 0 10px">Paste the whole message from your squad chat — Clayscore will find the code inside it.</p>
    <textarea class="field" id="impcode" rows="5" placeholder="CLAY2|…" style="font-size:11px;font-family:ui-monospace,monospace"></textarea>
    <button class="btn clay" style="margin:10px 0 8px" onclick="doImportCode()">Add round</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button>`);
}
function doImportCode(){
  const el=document.getElementById('impcode');
  const res=mergeShared(el?el.value:'');
  closeSheet();
  if(res.error){notice('Could not add that round',res.error);render();return;}
  render();
  const bits=[];
  if(res.inRound&&res.mine)bits.push('Your score: '+res.mine.hit+'/'+res.mine.shot+'.');
  else bits.push('You were not in this round, so it has been saved for reference but does not count towards your stats.');
  if(res.created)bits.push(res.created+' new shooter'+(res.created===1?'':'s')+' added to your list.');
  let shared=0;
  const s=me();
  if(s&&res.round.scores[s.id])Object.values(res.round.scores[s.id]).forEach(c=>{if(c.why&&c.whySrc==='shared')shared++;});
  if(shared)bits.push('The '+shared+' miss reason'+(shared===1?'':'s')+' on your card came from whoever kept the book, so they are recorded as their read rather than yours.');
  notice('Round added',(res.round.ground||'Round')+' on '+res.round.date+'. '+bits.join(' '));
}

/* =============================================================================
   REPORT

   A full printable stats report, built as a standalone HTML document so it needs
   no PDF library at all - the phone's own print dialog turns it into a PDF, and
   the same file can be saved or emailed as-is. Kept as a pure function so it can
   be asserted on in tests.
============================================================================= */
function buildReport(){
  const s=me();
  if(!s)return '<p>No shooter set up.</p>';
  const shots=allShots(s.id);
  const car=careerPct(s.id);
  const rounds=db.rounds.filter(r=>roundStats(r,s.id).shot>0)
    .sort((a,b)=>b.createdAt-a.createdAt);
  const sec=(title,rows,note)=>!rows.length?'':`<h2>${esc(title)}</h2>
    <table><thead><tr><th>Group</th><th class="n">Hit</th><th class="n">Shot</th><th class="n">%</th><th class="n">Plausible range</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${r.n<MIN_N?'weak':''}"><td>${esc(r.k)}</td><td class="n">${r.h}</td><td class="n">${r.n}</td>
      <td class="n">${Math.round(r.p*100)}%</td>
      <td class="n">${r.n<MIN_N?'too few to say':Math.round(r.lo*100)+'–'+Math.round(r.hi*100)+'%'}</td></tr>`).join('')}</tbody></table>
    ${note?`<p class="note">${note}</p>`:''}`;

  const misses=shots.filter(x=>x.res==='m');
  const tagged=misses.filter(x=>x.why&&x.why!=='Unsure');
  const whyRows=Object.entries(tagged.reduce((a,x)=>{a[x.why]=(a[x.why]||0)+1;return a},{}))
    .sort((a,b)=>b[1]-a[1]);

  return `<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Clayscore report — ${esc(s.name)}</title>
<style>
  @page{margin:16mm}
  body{font:13px/1.5 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;color:#12161d;max-width:820px;margin:0 auto;padding:20px}
  h1{font-size:24px;margin:0 0 2px;letter-spacing:-.01em}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:#6b7280;margin:26px 0 8px;border-bottom:1px solid #e2dbcc;padding-bottom:5px}
  .sub{color:#6b7280;font-size:12px;margin-bottom:18px}
  .kpis{display:flex;gap:10px;margin-bottom:6px}
  .kpi{flex:1;border:1px solid #e2dbcc;border-radius:8px;padding:10px;text-align:center}
  .kpi b{display:block;font-size:22px}
  .kpi span{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#6b7280}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #eee}
  th{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:#6b7280}
  .n{text-align:right;font-variant-numeric:tabular-nums}
  tr.weak td{color:#9ca3af}
  .note{font-size:10px;color:#6b7280;margin-top:6px}
  .bar{height:6px;background:#f3efe6;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:#e8621d}
  @media print{body{padding:0} .noprint{display:none}}
</style></head><body>
<h1>Clayscore report — ${esc(s.name)}</h1>
<div class="sub">Generated ${new Date().toLocaleDateString()} · ${rounds.length} rounds · ${shots.length} targets</div>

<div class="kpis">
  <div class="kpi"><b>${car}%</b><span>Career average</span></div>
  <div class="kpi"><b>${shots.length}</b><span>Targets</span></div>
  <div class="kpi"><b>${misses.length}</b><span>Misses</span></div>
  <div class="kpi"><b>${rounds.length}</b><span>Rounds</span></div>
</div>
<p class="note">Percentages are point estimates. The "plausible range" column is a 95% Wilson interval — the band your true ability sits in given the sample. Rows greyed out have too few targets to support a conclusion (fewer than ${MIN_N}); they are shown for completeness, not for acting on.</p>

<h2>Rounds</h2>
<table><thead><tr><th>Date</th><th>Ground</th><th class="n">Score</th><th class="n">%</th><th>Conditions</th><th>Gun</th></tr></thead>
<tbody>${rounds.map(r=>{const t=roundStats(r,s.id);const g=gunById(r.gunId);
  return `<tr><td>${esc(r.date)}</td><td>${esc(r.ground||'—')}</td><td class="n">${t.hit}/${t.shot}</td>
  <td class="n">${t.pct}%</td><td>${esc(conditionsText(r)||'—')}</td><td>${esc(g?g.name:'—')}</td></tr>`}).join('')}</tbody></table>

${sec('By ground',breakdown(shots,x=>x.ground==='—'?null:x.ground))}
${sec('By presentation',breakdown(shots,x=>x.pres))}
${sec('By distance',breakdown(shots,x=>x.dist).sort((a,b)=>BANDS.indexOf(a.k)-BANDS.indexOf(b.k)),
  'Distance is banded — Close is under about 25 yards, Mid roughly 25 to 40, Long beyond about 40.')}
${sec('By conditions',breakdown(shots,x=>x.wind).map(x=>Object.assign({},x,{k:'Wind: '+x.k}))
  .concat(breakdown(shots,x=>x.light).map(x=>Object.assign({},x,{k:'Light: '+x.k}))),
  'Conditions are recorded once per round, so every target in a round shares one band. These are the slowest figures to become meaningful.')}
${sec('By kit',breakdown(shots,x=>x.gun).map(x=>Object.assign({},x,{k:'Gun: '+x.k}))
  .concat(breakdown(shots,x=>x.cart).map(x=>Object.assign({},x,{k:'Cartridge: '+x.k})))
  .concat(breakdown(shots,x=>x.choke).map(x=>Object.assign({},x,{k:'Choke: '+x.k}))),
  'Observational, not experimental. Guns and cartridges change between rounds and grounds rather than between targets, so any gap here is confounded with everything else that changed. Correlation only.')}

${whyRows.length?`<h2>Why you miss</h2>
<table><thead><tr><th>Cause</th><th class="n">Count</th><th class="n">Share</th></tr></thead>
<tbody>${whyRows.map(([w,n])=>`<tr><td>${esc(w)}</td><td class="n">${n}</td><td class="n">${Math.round(n/tagged.length*100)}%</td></tr>`).join('')}</tbody></table>
<p class="note">Based on ${tagged.length} diagnosed misses. ${misses.length-tagged.length} further miss${misses.length-tagged.length===1?' is':'es are'} untagged or recorded as unsure and excluded.</p>`:''}

${(()=>{if(tagged.length<5)return'';const dc=diagnosisConfidence(s.id);
  return `<h2>Reliability of these diagnoses</h2>
  <p><b>${esc({good:'Good grounds for trusting them',mixed:'Mixed evidence',weak:'Weak grounds for trusting them',unknown:'Not yet judgeable'}[dc.level])}</b></p>
  <ul>${dc.findings.map(f=>`<li><b>${f.good?'':'⚠ '}${esc(f.t)}</b> — ${esc(f.d)}</li>`).join('')}</ul>
  <p class="note">Everything above that names a fault depends on these diagnoses being correct. The confidence intervals elsewhere in this report guard against small samples; they do not guard against consistently mistaken diagnoses.</p>`})()}

${(()=>{const plan=practicePlan(shots,car/100);return plan.length?`<h2>Practice priorities</h2>
<ol>${plan.map(p=>`<li><b>${esc(p.t)}</b> — ${esc(p.d)}</li>`).join('')}</ol>`:''})()}

${(()=>{const riv=rivalries(s.id);return riv.length?`<h2>Head to head</h2>
<table><thead><tr><th>Shooter</th><th class="n">Rounds</th><th class="n">W–L–D</th><th class="n">You</th><th class="n">Them</th></tr></thead>
<tbody>${riv.map(v=>`<tr><td>${esc(v.name)}</td><td class="n">${v.n}</td><td class="n">${v.w}–${v.l}–${v.d}</td>
  <td class="n">${v.myAvg}%</td><td class="n">${v.theirAvg}%</td></tr>`).join('')}</tbody></table>`:''})()}

${(()=>{const kit=db.guns.filter(g=>!g.retired);return kit.length?`<h2>Armoury</h2>
<table><thead><tr><th>Gun</th><th class="n">Shots</th><th class="n">Since clean</th><th class="n">Interval</th><th>Last cleaned</th></tr></thead>
<tbody>${kit.map(g=>{const c=cleanState(g);const l=(g.log||[])[0];
  return `<tr><td>${esc(gunLabel(g))}</td><td class="n">${g.shots||0}</td><td class="n">${c.since}${c.due?' (due)':''}</td>
  <td class="n">${c.every||'—'}</td><td>${l?new Date(l.at).toLocaleDateString():'never'}</td></tr>`}).join('')}</tbody></table>
<p class="note">Shot counts are a floor, not a tally: the app records targets shot at, not cartridges fired, so second barrels are not counted. The true figure is higher.</p>`:''})()}

<h2>Trophies</h2>
${(()=>{const t=trophies(s.id);return t.length?`<ul>${t.map(x=>`<li><b>${esc(x.t)}</b> (${x.tier}) — ${esc(x.d)}</li>`).join('')}</ul>`
  :'<p class="note">None yet.</p>'})()}

<p class="note" style="margin-top:26px">Clayscore v2 — all figures derived from ${shots.length} recorded targets on this device.</p>
</body></html>`;
}
function openReport(){
  const html=buildReport();
  const w=window.open('','_blank');
  if(!w){notice('Blocked','Your browser blocked the new window. Use "Download as a file" instead, then open it.');return;}

  confirmSheet('Erase everything?',
    n+' round'+(n===1?'':'s')+' and '+t+' shooter'+(t===1?'':'s')+' will be deleted from this device permanently. If you have not exported a backup, close this and do that first.',
    'Erase it all',eraseAll);

function eraseAll(){

/* Auto-backup, and an honest note about its limits.

   A web page cannot silently overwrite a file in your Downloads folder - the
   browser will not allow it, and on Android there is no File System Access API
   to ask for permission either. So "overwrite instead of accumulating" is not
   something I can deliver here; what I can do is back up at most ONCE PER DAY
   with a date-stamped name, which means one file per shooting day rather than
   one per round. That is the honest version. Do not let it replace the manual
   export before you wipe a phone. */
function autoBackup(){
  if(!db.autoBackup)return false;
  const day=new Date().toISOString().slice(0,10);
  if(db.lastBackupDay===day)return false;
  db.lastBackupDay=day;save();
  try{exportBackup();return true;}catch(e){return false;}
}
function importBackup(file){
  if(!file)return;
  const fr=new FileReader();
  fr.onload=()=>applyBackupText(fr.result,file.name);
  fr.onerror=()=>notice('Could not read that file','The phone would not hand the file over. Try "Paste a backup instead" and paste the contents.');
  fr.readAsText(file);
}
/* One path for a backup however it arrived - picked, or pasted when the picker
   will not cooperate. Reports what it found rather than failing silently. */
function applyBackupText(text,label){
  let p;
  try{ p=JSON.parse(text); }
  catch(e){
    notice('Not valid JSON',(label?'"'+label+'" ':'That ')+'could not be read as JSON. If you pasted it, make sure you copied the whole file including the first { and the last }.');
    return;
  }
  if(p&&p.v===2){
    db=Object.assign(blank(),p); save(); render();
    notice('Imported',db.rounds.length+' round'+(db.rounds.length===1?'':'s')+' restored from a Clayscore v2 backup.');
    return;
  }
  if(p&&(p.history||p.profiles||p.shooters)){ mergeV1(p); return; }
  notice('Not a Clayscore backup','That file parsed as JSON but has none of the things a Clayscore backup has — no rounds, no profiles, no history. Keys found: '+
    Object.keys(p||{}).slice(0,8).join(', ')+'.');
}
function pasteBackupSheet(){
  sheet(`<h3>Paste a backup</h3>
    <p class="muted" style="margin:8px 0 10px">If the file picker will not let you choose the file — Android often blocks .json — open the backup in a text or file app, select all, copy, and paste it here instead.</p>
    <textarea class="field" id="pastebk" rows="6" placeholder="{ &quot;profiles&quot;: [ ..." style="font-size:11px;font-family:ui-monospace,monospace"></textarea>
    <button class="btn clay" style="margin:10px 0 8px" onclick="doPasteBackup()">Import</button>
    <button class="btn ghost" onclick="closeSheet()">Cancel</button>`);
}
function doPasteBackup(){
  const el=document.getElementById('pastebk');
  const t=el?el.value.trim():'';
  closeSheet();
  if(!t){notice('Nothing pasted','The box was empty.');return;}
  applyBackupText(t,'pasted text');
}
function importV1(){
  try{
    const raw=localStorage.getItem('sarge_pwa_pro_v3');
    if(!raw){notice('Nothing found','No Clayscore v1 data exists in this browser. If v1 is on a different browser or a different phone, export a backup there and import the file here.');return;}
    mergeV1(JSON.parse(raw));
  }catch(e){notice('Import failed','The v1 data could not be read.');}
}
/* v1 stored rounds under `history` with a different shape; map what maps cleanly
   and drop nothing silently - the notice reports exactly how much came across. */
/* =============================================================================
   IMPORTING FROM v1

   Rewritten 30 July against a REAL v1 export. The first version was written
   against a structure I assumed rather than one I had checked, and it was wrong
   in three separate ways - so it silently imported nothing but ground names.
   The actual v1 shape, for the record:

     profiles[]                      <- NOT "shooters"
     history[]
       .shooterIds[]                 v1 profile ids
       .stands[].slots[]             {clayType, presentation, distance, pairType…}
       .hits[shooterId][standId][slotId] = {result, missReason}
                                     <- scores live HERE, three levels deep,
                                        not on the slot
       result is "hit1" | "hit2" | "miss"
                                     <- which barrel killed it, not "hit"

   Everything below is mapped from that. Nothing is dropped silently: whatever
   cannot be mapped is counted and reported.
============================================================================= */
var V1_PRES={'Crosser (L→R)':'Crosser L→R','Crosser (R→L)':'Crosser R→L',
  'Incomer (L→R)':'Incomer L→R','Incomer (R→L)':'Incomer R→L',
  'Outgoer (L→R)':'Outgoer L→R','Outgoer (R→L)':'Outgoer R→L',
  'Looper (L→R)':'Looper L→R','Looper (R→L)':'Looper R→L',
  'Rabbit (L→R)':'Rabbit L→R','Rabbit (R→L)':'Rabbit R→L',
  'Springing Teal (L→R)':'Teal L→R','Springing Teal (R→L)':'Teal R→L',
  'Quartering In (L→R)':'Quartering L→R','Quartering In (R→L)':'Quartering R→L',
  'Quartering Away (L→R)':'Quartering L→R','Quartering Away (R→L)':'Quartering R→L'};
/* Only the directional names map cleanly onto v2's list. A plain "Incomer" or
   "Quartering Away" from before v1 had direction variants is kept exactly as it
   was recorded - we genuinely do not know which way that bird was going, and
   inventing a direction would be worse than an odd-looking label. */
function v1Pres(x){ if(!x)return null; return V1_PRES[x]||x; }
function v1Dist(x){ if(!x)return null; return x==='Medium'?'Mid':x; }

function mergeV1(p){
  const idFor={};
  let added=0, dup=0, guests=0, targets=0, reasons=0, skippedCells=0;
  const profiles=p.profiles||p.shooters||[];   // v1 uses profiles; tolerate either

  function ensureShooter(v1id,fallbackName){
    if(idFor[v1id])return idFor[v1id];
    const prof=profiles.find(x=>x.id===v1id);
    let nm=(prof&&prof.name||fallbackName||'').trim();
    if(!nm){ guests++; nm='Unknown v1 shooter '+guests; }
    let ex=db.shooters.find(x=>x.name.toLowerCase()===nm.toLowerCase());
    if(!ex){ ex={id:newId(),name:nm,me:!db.shooters.length}; db.shooters.push(ex); }
    idFor[v1id]=ex.id;
    return ex.id;
  }
  profiles.forEach(pr=>{ if(pr&&pr.id)ensureShooter(pr.id); });

  // kit, so the armoury and per-round gun survive the move
  function ensureGun(name){
    if(!name)return null;
    let g=db.guns.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!g){ g=makeGun(name); db.guns.push(g); }
    return g.id;
  }
  function ensureCart(name){
    if(!name)return null;
    let c=db.cartridges.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!c){ c=makeCart(name); db.cartridges.push(c); }
    return c.id;
  }

  (p.history||[]).forEach(h=>{
    if(db.rounds.some(x=>x.legacyId&&x.legacyId===h.id)){dup++;return;}
    const r=newRound();
    r.legacyId=h.id;
    r.discipline='sporting';                       // v1 recorded ESP only
    r.date=(h.date||'').slice(0,10)||r.date;
    r.ground=h.ground||h.location||'';
    r.createdAt=h.createdAt||r.createdAt;
    const note=[h.event,h.notes].map(x=>(x||'').trim()).filter(Boolean).join(' — ');
    if(note)r.note=note;

    // squad: everyone named on the round OR carrying scores, so a shooter whose
    // profile was later deleted still keeps their card
    const v1Ids=[...new Set([].concat(h.shooterIds||[],Object.keys(h.hits||{})))];
    r.shooterIds=v1Ids.map(x=>ensureShooter(x));

    // stands and slots, remembering the v1 slot id so scores can be attached
    const slotMap={};
    (h.stands||[]).forEach(st=>{
      const ns={id:newId(),cycle:2,birds:[],choke:null,slots:[]};
      (st.slots||[]).forEach(sl=>{
        const nsl={id:newId(),pres:v1Pres(sl.presentation),dist:v1Dist(sl.distance),
          clayType:sl.clayType||null};
        ns.slots.push(nsl);
        slotMap[sl.id]=nsl.id;
      });
      if(ns.slots.length)r.stands.push(ns);
    });

    // THE SCORES: hits[shooterId][standId][slotId]
    Object.entries(h.hits||{}).forEach(([v1sh,stands])=>{
      const sh=ensureShooter(v1sh);
      Object.values(stands||{}).forEach(cells=>{
        Object.entries(cells||{}).forEach(([v1slot,val])=>{
          const slotId=slotMap[v1slot];
          const res=val&&val.result;
          if(!slotId||!res){skippedCells++;return;}
          if(res!=='hit1'&&res!=='hit2'&&res!=='miss'){skippedCells++;return;}
          const c=cell(r,sh,slotId,true);
          c.r=(res==='miss')?'m':'h';
          if(res==='hit1')c.barrel=1;              // kept for DTL later; ESP scores 1 either way
          else if(res==='hit2')c.barrel=2;
          const why=val.missReason;
          if(c.r==='m'&&why){
            c.why=why; c.whyAuto=false; c.whySrc='v1';
            if(why!=='Unsure')reasons++;      // "Unsure" is an answer, not a diagnosis
          }else if(c.r==='m'){
            c.why='Unsure'; c.whyAuto=true;        // never reviewed, same as a v2 default
          }
          targets++;
        });
      });
    });

    // per-shooter limits: v1's own figure if it recorded one, else what they shot
    r.limits={};
    r.shooterIds.forEach((id,i)=>{
      const v1id=v1Ids[i];
      const lim=h.perStandLimit&&h.perStandLimit[v1id];
      r.limits[id]=(typeof lim==='number'&&lim>0)?lim:roundStats(r,id).shot;
    });

    // conditions
    const rd=(h.conditions&&h.conditions.readings)||[];
    if(rd.length){
      r.conditions={readings:rd.map(a=>({at:a.fetchedAt||r.createdAt,note:'Imported from v1',
        temp:a.tempC==null?null:a.tempC, wind:a.windMph==null?null:a.windMph,
        gust:a.gustMph==null?null:a.gustMph, dir:a.windDir==null?null:a.windDir,
        cloud:a.cloudPct==null?null:a.cloudPct, precip:a.precipMm==null?null:a.precipMm,
        windBand:windBand(a.windMph), lightBand:lightBand(a.cloudPct)}))};
    }

    // kit
    const eq=h.equipment||{};
    r.gunId=ensureGun(eq.gunName);
    r.cartridgeId=ensureCart(eq.cartridge);
    /* Do NOT add these to gun wear: v1 kept its own shot counts, and counting
       them again here would inflate the cleaning interval. Correct by hand in
       the Armoury if you want the historic figure. */
    r.countedShots=true;

    if(r.ground&&!db.grounds.some(g=>gkey(g)===gkey(r.ground)))db.grounds.push(r.ground);
    if(r.stands.length&&r.shooterIds.length){db.rounds.push(r);added++;}
  });

  // ground coordinates, so a re-visit needs no GPS prompt
  Object.entries(p.groundLocations||{}).forEach(([k,v])=>{
    if(v&&v.lat!=null&&v.lon!=null&&!db.groundLocations[k])db.groundLocations[k]=v;
  });

  save();render();
  const bits=[];
  bits.push(added+' round'+(added===1?'':'s'));
  bits.push(targets+' target'+(targets===1?'':'s'));
  bits.push(Object.keys(idFor).length+' shooter'+(Object.keys(idFor).length===1?'':'s'));
  let msg=bits.join(', ')+' imported. '+reasons+' diagnosed miss'+(reasons===1?'':'es')+' came with them.';
  if(guests)msg+=' '+guests+' shooter'+(guests===1?' had no':'s had no')+' profile left in v1 and came in as "Unknown v1 shooter" — rename them under Settings → Shooters.';
  if(dup)msg+=' '+dup+' round'+(dup===1?' was':'s were')+' already here and skipped.';
  if(skippedCells)msg+=' '+skippedCells+' cell'+(skippedCells===1?'':'s')+' could not be read and were left out.';
  msg+=' Nothing in v1 was changed or deleted.';
  notice('Import complete',msg);
}
async function storageInfo(){
  const el=document.getElementById('storage'); if(!el)return;
  let bits=[];
  try{
    if(navigator.storage&&navigator.storage.persist){
      let ok=await navigator.storage.persisted();
      if(!ok)ok=await navigator.storage.persist();
      bits.push(ok?'Storage marked persistent — the browser will not evict your data to reclaim space.'
                 :'The browser has not granted persistent storage. Adding Clayscore to your home screen usually earns it.');
    }
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      if(e.usage!=null)bits.push('Using '+(e.usage/1024).toFixed(0)+' KB.');
    }
  }catch(e){}
  el.textContent=bits.join(' ');
}

/* =============================================================================
   INIT
============================================================================= */
function boot(){
  load();
  if(db.view==='enrich'&&!enr)db.view='home';
  if(db.view==='check'&&!chk)db.view='home';   // a blind check must never resume half-done
  if(db.view==='setup'&&!db.live)draft=null;
  render();
  if(db.view==='settings')storageInfo();
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw2.js').catch(()=>{});}
}
if(typeof window!=='undefined'){window.onload=boot;}
</script>
